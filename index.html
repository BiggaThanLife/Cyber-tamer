    </div>`;
    buttons.forEach((b,i)=>{
      controlsEl.querySelector(`[data-i="${i}"]`).addEventListener('click', ()=>{
        if(b.locked){ logMsg(b.lockMsg); render(); return; }
        b.fn();
      });
    });
  }

  function feedPartner(){
    const p = getActive();
    if(state.inventory.primeMeat <= 0){ logMsg('No Prime Meat left — visit the shop.'); render(); return; }
    state.inventory.primeMeat--;
    p.hunger = Math.min(100, p.hunger + 40);
    p.energy = Math.min(100, p.energy + 8);
    logMsg(`Fed ${getForm(p).name} a Prime Meat.`);
    questEvent('care', 1);
    render();
  }
  function restPartner(){
    const p = getActive();
    questEvent('care', 1);
    p.energy = Math.min(100, p.energy + 35);
    p.hunger = Math.max(0, p.hunger - 8);
    logMsg(`${getForm(p).name} rested and recovered energy.`);
    render();
  }


  /* ---------------------------------------------------------
     DAILY OPS — login streak, daily quests, daily sector
     Everything keys off the device's LOCAL calendar date. The clock is
     monotonic (see dailyToday): winding the clock back never re-opens a
     claimed day. Rewards are pull-based and forgiving — one missed day
     never breaks a streak, and a long absence earns a welcome-back gift
     rather than a penalty.
  --------------------------------------------------------- */
  let clockFn = () => new Date();
  function localDayKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dayIndex(key){ const [y,m,d] = key.split('-').map(Number); return Math.floor(Date.UTC(y, m-1, d) / 86400000); }
  function dailyToday(){
    const real = localDayKey(clockFn());
    const seen = state && state.daily && state.daily.lastSeenDay;
    return (seen && seen > real) ? seen : real;
  }
  function msUntilMidnight(){
    const n = clockFn(); const next = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1);
    return Math.max(0, next - n);
  }
  function defaultDaily(){
    return {
      lastSeenDay: null,
      login:   { streak:0, best:0, lastClaimDay:null, nextDay:1, cycles:0, comebacks:0 },
      quests:  { day:null, list:[], bonusClaimed:false, totalCompleted:0 },
      sector:  { day:null, biomeIndex:0, seed:0, claimed:false, total:0 },
    };
  }

  const LOGIN_REWARDS = [
    { day:1, bits:100 },
    { day:2, bits:50,  trapSphere:2 },
    { day:3, bits:150, primeMeat:2 },
    { day:4, bits:100, medicine:2 },
    { day:5, bits:250, trapSphere:2 },
    { day:6, bits:150, seeds:{crestshard:1} },
    { day:7, bits:400, evoCrest:1, medicine:2 },
  ];
  const COMEBACK_REWARD = { bits:150, primeMeat:3, trapSphere:2 };
  const QUEST_BONUS_REWARD = { bits:150, medicine:1, trapSphere:2 };

  // kind → definition. goal:[min,max]; town:true kinds happen at the base rather than in the wild.
  const QUEST_DEFS = {
    win:     { goal:[4,6],   town:false, reward:{bits:80},                     text:(n)=>`Win ${n} battles` },
    winType: { goal:[2,3],   town:false, reward:{bits:90},                     text:(n,t)=>`Defeat ${n} ${t}-type monsters`, param:true },
    catch:   { goal:[1,2],   town:false, reward:{bits:60, trapSphere:2},       text:(n)=>`Capture ${n} wild monster${n>1?'s':''}` },
    step:    { goal:[50,80], town:false, reward:{bits:70},                      text:(n)=>`Explore ${n} tiles of wilderness` },
    chest:   { goal:[2,3],   town:false, reward:{bits:70, trapSphere:1},       text:(n)=>`Open ${n} chests or vaults` },
    dig:     { goal:[20,35], town:false, reward:{bits:90},                     text:(n)=>`Dig through ${n} blocks in the Data Mine`, gate:()=>isMiningUnlocked() },
    harvest: { goal:[2,4],   town:true,  reward:{bits:60, primeMeat:1},        text:(n)=>`Harvest ${n} crops at the Server Farm` },
    job:     { goal:[2,3],   town:true,  reward:{bits:60},                      text:(n)=>`Complete ${n} jobs at the Job Board` },
    train:   { goal:[1,2],   town:true,  reward:{bits:80, medicine:1},         text:(n)=>`Finish ${n} Training Ground session${n>1?'s':''}`, gate:()=>isTrainingUnlocked() },
    care:    { goal:[2,3],   town:true,  reward:{bits:50, primeMeat:1},        text:(n)=>`Feed or rest your partner ${n} times` },
  };

  function grantReward(r, bitsMult){
    const parts = [];
    const bits = Math.round((r.bits||0) * (bitsMult||1));
    if(bits){ state.bits += bits; parts.push(`◈${bits}`); }
    [['trapSphere','Trap Sphere'],['primeMeat','Prime Meat'],['medicine','Medicine'],['evoCrest','Evolution Crest']].forEach(([k,label])=>{
      if(r[k]){ state.inventory[k] = (state.inventory[k]||0) + r[k]; parts.push(`${r[k]} ${label}${r[k]>1?'s':''}`); }
    });
    if(r.seeds){
      Object.keys(r.seeds).forEach(sid => {
        if(!state.inventory.seeds) state.inventory.seeds = {};
        state.inventory.seeds[sid] = (state.inventory.seeds[sid]||0) + r.seeds[sid];
        parts.push(`${r.seeds[sid]} ${(CROPS[sid]&&CROPS[sid].name)||sid} seed${r.seeds[sid]>1?'s':''}`);
      });
    }
    return parts.join(' + ');
  }
  function rewardPreview(r, bitsMult){
    const parts = [];
    if(r.bits) parts.push(`◈${Math.round(r.bits*(bitsMult||1))}`);
    [['trapSphere','Trap Sphere'],['primeMeat','Prime Meat'],['medicine','Medicine'],['evoCrest','Evo Crest']].forEach(([k,label])=>{ if(r[k]) parts.push(`${r[k]} ${label}${r[k]>1?'s':''}`); });
    if(r.seeds) Object.keys(r.seeds).forEach(sid => parts.push(`${r.seeds[sid]} ${(CROPS[sid]&&CROPS[sid].name)||sid} seed`));
    return parts.join(' + ');
  }

  function dailyRefresh(){
    if(!state || !state.daily) return;
    const today = dailyToday(), d = state.daily;
    if(d.lastSeenDay === today && d.quests.day === today && d.sector.day === today) return;
    const hadPrev = !!d.lastSeenDay && d.lastSeenDay !== today;
    d.lastSeenDay = today;
    if(d.quests.day !== today) generateDailyQuests(today);
    if(d.sector.day !== today) generateDailySector(today);
    if(hadPrev) logMsg('🌅 A new day — fresh Daily Ops are ready.');
  }

  function loginClaimable(){ return !!state.daily && state.daily.login.lastClaimDay !== dailyToday(); }
  function loginStreakShown(){
    const L = state.daily.login;
    if(!L.lastClaimDay) return 0;
    return (dayIndex(dailyToday()) - dayIndex(L.lastClaimDay) <= 2) ? L.streak : 0;
  }
  function loginCycleMult(){ return 1 + 0.25 * Math.min(state.daily.login.cycles, 4); }
  function claimLogin(){
    dailyRefresh();
    const L = state.daily.login, today = dailyToday();
    if(L.lastClaimDay === today) return null;
    const gap = L.lastClaimDay ? dayIndex(today) - dayIndex(L.lastClaimDay) : null;
    let note = '', comeback = null;
    if(gap === null){ L.streak = 1; L.nextDay = 1; }
    else if(gap <= 2){ L.streak++; if(gap === 2) note = ' A grace day kept your streak alive.'; }
    else { L.streak = 1; L.nextDay = 1; if(gap >= 4){ comeback = grantReward(COMEBACK_REWARD, 1); L.comebacks++; note = ` Welcome back! Gift: ${comeback}.`; } }
    const rw = LOGIN_REWARDS[L.nextDay-1];
    const txt = grantReward(rw, loginCycleMult());
    L.best = Math.max(L.best, L.streak);
    L.lastClaimDay = today;
    if(L.nextDay >= LOGIN_REWARDS.length){ L.nextDay = 1; L.cycles++; } else { L.nextDay++; }
    logMsg(`📅 Day ${rw.day} login reward: ${txt}. Streak ${L.streak}.${note}`);
    render();
    return txt;
  }

  function generateDailyQuests(today){
    const rng = mulberry32(strToSeed('daily_quests_' + today));
    const kinds = Object.keys(QUEST_DEFS).filter(k => !QUEST_DEFS[k].gate || QUEST_DEFS[k].gate());
    shuffleArray(kinds, rng);
    let pick = kinds.slice(0,3);
    if(pick.every(k => QUEST_DEFS[k].town)){ // never a day of pure chores
      const wildK = kinds.find(k => !QUEST_DEFS[k].town);
      if(wildK) pick[2] = wildK;
    }
    const types = Object.keys(TYPE_CHART);
    const list = pick.map(kind => {
      const def = QUEST_DEFS[kind];
      const goal = def.goal[0] + Math.floor(rng() * (def.goal[1]-def.goal[0]+1));
      const q = { kind, goal, progress:0, claimed:false };
      if(def.param) q.param = types[Math.floor(rng()*types.length)];
      return q;
    });
    state.daily.quests = { day: today, list, bonusClaimed:false, totalCompleted: state.daily.quests.totalCompleted||0 };
  }
  function questText(q){ const def = QUEST_DEFS[q.kind]; return def ? def.text(q.goal, q.param) : 'Unknown task'; }
  function questEvent(kind, amount, meta){
    const d = state && state.daily;
    if(!d || !d.quests || !Array.isArray(d.quests.list)) return;
    dailyRefresh();
    const kinds = kind === 'win' ? ['win','winType'] : [kind];
    d.quests.list.forEach(q => {
      if(q.claimed || q.progress >= q.goal || !kinds.includes(q.kind)) return;
      if(q.kind === 'winType' && !(meta && meta.type === q.param)) return;
      q.progress = Math.min(q.goal, q.progress + (amount||1));
    });
  }
  function claimQuest(i){
    dailyRefresh();
    const q = state.daily.quests.list[i];
    if(!q || q.claimed || q.progress < q.goal) return;
    q.claimed = true;
    state.daily.quests.totalCompleted++;
    const txt = grantReward(QUEST_DEFS[q.kind].reward, 1);
    logMsg(`✔ Daily quest complete: ${questText(q)} — ${txt}.`);
    render();
  }
  function questBonusReady(){
    const Q = state.daily.quests;
    return !Q.bonusClaimed && Q.list.length > 0 && Q.list.every(q => q.claimed);
  }
  function claimQuestBonus(){
    dailyRefresh();
    if(!questBonusReady()) return;
    state.daily.quests.bonusClaimed = true;
    const txt = grantReward(QUEST_BONUS_REWARD, 1);
    logMsg(`🎁 All daily quests done — bonus cache: ${txt}.`);
    render();
  }

  function generateDailySector(today){
    const rng = mulberry32(strToSeed('daily_sector_' + today));
    const idx = Math.floor(rng() * (state.unlockedBiomeIndex + 1));
    const seed = Math.floor(rng() * 4294967296) >>> 0;
    state.daily.sector = { day: today, biomeIndex: idx, seed, claimed:false, total: state.daily.sector.total||0 };
  }
  function enterDailySector(){
    dailyRefresh();
    const sec = state.daily.sector, biome = BIOMES[sec.biomeIndex];
    playTransition(`Daily Sector<br>${biome.name}...`, biome.accentColor, ()=>{
      state.wild = generateWildMap(sec.biomeIndex, undefined, sec.seed, { daily: !sec.claimed, day: sec.day });
      recordVisitedSeed(sec.biomeIndex, state.wild.seed);
      state.screen = 'wild';
      render();
    });
  }
  function claimDailyCache(w){
    const sec = state.daily.sector;
    if(sec.claimed || !w || w.dailyDay !== sec.day){ logMsg('This cache has already been drained.'); return; }
    sec.claimed = true; sec.total = (sec.total||0) + 1;
    const r = { bits: 150 + sec.biomeIndex*50, primeMeat:2, medicine:1 };
    if(sec.total % 5 === 0) r.evoCrest = 1; // every 5th daily sector
    const txt = grantReward(r, 1);
    logMsg(`✪ Daily cache decrypted: ${txt}!${sec.total%5===0 ? ' (5th sector bonus)' : ''}`);
    questEvent('sector', 1);
  }

  function dailyClaimableCount(){
    if(!state || !state.daily) return 0;
    let n = loginClaimable() ? 1 : 0;
    n += state.daily.quests.list.filter(q => !q.claimed && q.progress >= q.goal).length;
    if(questBonusReady()) n++;
    return n;
  }

  function renderDaily(screenEl, controlsEl){
    dailyRefresh();
    const d = state.daily, L = d.login, Q = d.quests, S = d.sector;
    const biome = BIOMES[S.biomeIndex];
    const mins = Math.ceil(msUntilMidnight()/60000);
    const resetTxt = `${Math.floor(mins/60)}h ${mins%60}m`;
    const claimable = loginClaimable();
    const streak = loginStreakShown();
    const mult = loginCycleMult();
    // Today's reward day: if unclaimed it's nextDay; if already claimed, nextDay has moved on (tomorrow's)
    const strip = LOGIN_REWARDS.map(r => {
      const isNext = r.day === L.nextDay;
      const done = claimable ? r.day < L.nextDay : r.day < L.nextDay || (L.nextDay === 1 && L.cycles > 0 && !claimable);
      const border = isNext ? (claimable ? 'var(--amber)' : 'var(--cyan)') : (done ? 'var(--phosphor-dim)' : 'var(--glass-border)');
      const color = isNext ? (claimable ? 'var(--amber)' : 'var(--cyan)') : (done ? 'var(--phosphor)' : 'var(--ink-dim)');
      return `<div style="flex:1; min-width:0; text-align:center; border:1px solid ${border}; border-radius:6px; padding:4px 1px; background:rgba(255,255,255,.03);">
        <div style="font-size:8.5px; color:${color};">${done?'✓':'D'+r.day}</div>
        <div style="font-size:7.5px; color:var(--ink-dim); margin-top:2px; line-height:1.2;">${r.day===7?'★':(r.evoCrest?'★':'◈'+Math.round(r.bits*mult))}</div>
      </div>`;
    }).join('');
    const nextR = LOGIN_REWARDS[L.nextDay-1];

    screenEl.innerHTML = `
      ${screenTitle('📅 DAILY OPS', 'var(--amber)')}
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:8px;">Resets in ${resetTxt} (local midnight) · one missed day never breaks your streak.</div>

      <div class="card" style="margin-bottom:8px; border-color:var(--amber);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:10.5px; color:var(--amber);">🔥 Login Streak: ${streak}</span>
          <span style="font-size:9px; color:var(--ink-dim);">Best ${L.best}${L.cycles>0?` · Cycle ${L.cycles+1} (+${Math.round((mult-1)*100)}% ◈)`:''}</span>
        </div>
        <div style="display:flex; gap:3px; margin-bottom:6px;">${strip}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:6px;">${claimable ? 'Ready — Day '+L.nextDay+': ' : 'Tomorrow — Day '+L.nextDay+': '}${rewardPreview(nextR, mult)}</div>
        ${claimable
          ? `<button class="btn btn-amber" id="claim-login" style="width:100%; padding:7px; font-size:10.5px;">Claim Day ${L.nextDay} Reward</button>`
          : `<div style="font-size:9.5px; color:var(--phosphor); text-align:center;">✓ Claimed today — come back tomorrow</div>`}
      </div>

      <div class="card" style="margin-bottom:8px;">
        <div style="font-size:10.5px; color:var(--cyan); margin-bottom:6px;">📋 Daily Quests <span style="color:var(--ink-dim); font-size:9px;">— ${Q.list.filter(q=>q.claimed).length}/${Q.list.length} claimed</span></div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${Q.list.map((q,i)=>{
            const done = q.progress >= q.goal, pct = Math.round(q.progress/q.goal*100);
            return `<div style="border:1px solid ${q.claimed?'var(--phosphor-dim)':(done?'var(--amber)':'var(--glass-border)')}; border-radius:6px; padding:6px 7px; background:rgba(255,255,255,.03);">
              <div style="display:flex; justify-content:space-between; gap:6px; align-items:center;">
                <div style="font-size:10px; color:${q.claimed?'var(--phosphor)':'var(--ink)'};">${q.claimed?'✓ ':''}${questText(q)}</div>
                ${done && !q.claimed ? `<button class="btn btn-amber" style="padding:3px 8px; font-size:9px; flex-shrink:0;" data-claim-q="${i}">Claim</button>` : ''}
              </div>
              <div style="height:5px; background:#0a1f14; border-radius:3px; margin:5px 0 3px; overflow:hidden;"><div style="height:100%; width:${pct}%; background:${q.claimed?'var(--phosphor-dim)':(done?'var(--amber)':'var(--cyan)')};"></div></div>
              <div style="font-size:8.5px; color:var(--ink-dim);">${q.progress}/${q.goal} · Reward: ${rewardPreview(QUEST_DEFS[q.kind].reward,1)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:8px; border-top:1px dashed var(--glass-border); padding-top:6px; display:flex; justify-content:space-between; align-items:center; gap:6px;">
          <div style="font-size:9.5px; color:${Q.bonusClaimed?'var(--phosphor)':'var(--ink-dim)'};">🎁 Clear all 3: ${rewardPreview(QUEST_BONUS_REWARD,1)}</div>
          ${questBonusReady() ? `<button class="btn btn-amber" id="claim-bonus" style="padding:3px 8px; font-size:9px; flex-shrink:0;">Open</button>` : (Q.bonusClaimed ? '<span style="font-size:9px; color:var(--phosphor);">✓</span>' : '')}
        </div>
      </div>

      <div class="card" style="border-color:${biome.accentColor};">
        <div style="font-size:10.5px; color:${biome.accentColor}; margin-bottom:4px;">🧭 Daily Sector — ${biome.name}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:4px;">Today's fixed map · Seed <span style="color:var(--phosphor);">${S.seed}</span> · every visit today is the same layout. Find the ✪ cache for a bonus.</div>
        ${biome.mechanic ? `<div style="font-size:9px; color:${biome.accentColor}; margin-bottom:6px;">${biome.mechanic.split('.')[0]}.</div>` : ''}
        <div style="font-size:9.5px; margin-bottom:6px; color:${S.claimed?'var(--phosphor)':'var(--amber)'};">${S.claimed ? '✓ Cache claimed today' : '✪ Cache waiting'} · ${S.total||0} total${(S.total||0)%5===4 && !S.claimed ? ' · next claim gives an Evolution Crest!' : ''}</div>
        <button class="btn btn-primary" id="enter-sector" style="width:100%; padding:7px; font-size:10.5px;">Enter Daily Sector</button>
      </div>
    `;
    const cl = screenEl.querySelector('#claim-login'); if(cl) cl.addEventListener('click', ()=>claimLogin());
    screenEl.querySelectorAll('[data-claim-q]').forEach(b=>b.addEventListener('click', ()=>claimQuest(parseInt(b.getAttribute('data-claim-q'),10))));
    const cb = screenEl.querySelector('#claim-bonus'); if(cb) cb.addEventListener('click', ()=>claimQuestBonus());
    screenEl.querySelector('#enter-sector').addEventListener('click', ()=>enterDailySector());
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  /* ---------------------------------------------------------
     BIOME SELECT
  --------------------------------------------------------- */

      });
    };
    screenEl.querySelectorAll('[data-enter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-enter'),10);
        enterBiome(idx);
      });
    });
    screenEl.querySelectorAll('[data-enter-seed]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-enter-seed'),10);
        showPromptModal('Enter a seed number to travel to that exact sector layout:', '', (raw)=>{
          const trimmed = (raw||'').trim();
          if(trimmed === '') return; // cancelled/empty
          const seed = parseInt(trimmed, 10);
          if(!isFinite(seed) || isNaN(seed)){ showAlertModal("That's not a valid seed number."); return; }
          enterBiome(idx, seed >>> 0);
        });
      });
    });
    screenEl.querySelectorAll('[data-fav-enter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const seed = parseInt(btn.getAttribute('data-fav-enter'),10);
        const idx = parseInt(btn.getAttribute('data-fav-biome'),10);
        enterBiome(idx, seed);
      });
    });
    screenEl.querySelectorAll('[data-fav-del]').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const seed = parseInt(btn.getAttribute('data-fav-del'),10);
        const idx = parseInt(btn.getAttribute('data-fav-biome-del'),10);
        state.savedSeeds = state.savedSeeds.filter(s => !(s.seed===seed && s.biomeIndex===idx));
        render();
      });
    });
    screenEl.querySelectorAll('[data-recent-enter]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const r = recent[parseInt(btn.getAttribute('data-recent-enter'),10)];
        if(r) enterBiome(r.biomeIndex, r.seed);
      });
    });
    screenEl.querySelectorAll('[data-recent-fav]').forEach(btn=>{
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const r = recent[parseInt(btn.getAttribute('data-recent-fav'),10)];
        if(r) toggleFavoriteSeed(r.seed, r.biomeIndex);
      });
    });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  /* ---------------------------------------------------------
     WILDERNESS
  --------------------------------------------------------- */
  function renderWild(screenEl, controlsEl){
    const w = state.wild;
    const biome = BIOMES[w.biomeIndex];
    applyFog(w, biome);
    const cell = 26;
    // Camera-centered viewport: a fixed-size window always centered on the
    // player, rather than rendering the full map grid (which could be up to
    // 15x15 tiles — wider than a mobile screen, forcing a second horizontal
    // scrollbar alongside the page's own vertical one). Tiles outside the
    // map's bounds just render as empty space beyond the edge of the world.
    const VIEW_RADIUS = 4;
    const viewSize = VIEW_RADIUS*2 + 1;
    let grid = `<div style="display:grid; grid-template-columns:repeat(${viewSize},${cell}px); grid-template-rows:repeat(${viewSize},${cell}px); gap:1px; justify-content:center; margin:4px auto;">`;
    for(let vy=0; vy<viewSize; vy++){
      for(let vx=0; vx<viewSize; vx++){
        const x = w.px - VIEW_RADIUS + vx;
        const y = w.py - VIEW_RADIUS + vy;
        const inBounds = x>=0 && y>=0 && x<w.size && y<w.size;
        if(!inBounds){
          grid += `<div class="tile" style="background:#000;"></div>`;
          continue;
        }
        const c = w.grid[y][x];
        const visible = w.fog[y][x];
        let bg = '#04120b', glyph='', col='#0a2818';
        if(visible){
          if(c.role==='open'){ bg=biome.tiles.open.bg; glyph='·'; col=biome.tiles.open.col; }
          else if(c.role==='blockA'){ bg=biome.tiles.blockA.bg; glyph=biome.tiles.blockA.glyph; col=biome.tiles.blockA.col; }
          else if(c.role==='blockB'){ bg=biome.tiles.blockB.bg; glyph=biome.tiles.blockB.glyph; col=biome.tiles.blockB.col; }
          else if(c.role==='chest'){ bg='#1c1206'; glyph= c.opened?'▫':'▪'; col='#ffb347'; }
          else if(c.role==='gate'){ bg='#1a0c2a'; glyph='⛩'; col='#a06bff'; }
          else if(c.role==='boss'){ bg='#2a0a12'; glyph='☠'; col='#ff4d5e'; }
          else if(c.role==='shrine'){ bg='#2a220a'; glyph= c.opened?'✧':'✦'; col='#ffd93d'; }
          else if(c.role==='key'){ bg='#0a2a22'; glyph= c.opened?'⚬':'⚷'; col='#3ad6d1'; }
          else if(c.role==='vault'){ bg= c.opened?'#123722':'#2a0a12'; glyph= c.opened?'▢':'▣'; col= c.opened?'#4be37a':'#ff4d5e'; }
          else if(c.role==='anomaly'){ bg='#1a0c2a'; glyph= c.opened?'·':'✕'; col='#ff4d9e'; }
          else if(c.role==='hazard'){ const ht = biome.tiles.hazard || {bg:'#3a1005',glyph:'♨',col:'#ff9a3d'}; bg=ht.bg; glyph=ht.glyph; col=ht.col; }
          else if(c.role==='cache'){ bg='#0a2418'; glyph= c.opened?'·':'✪'; col='#7dffb0'; }
        }
        const isPlayer = (vx===VIEW_RADIUS && vy===VIEW_RADIUS);
        grid += `<div class="tile" style="background:${bg};color:${col};">${isPlayer ? '<span style="color:var(--phosphor);text-shadow:0 0 6px var(--phosphor);">◉</span>' : glyph}</div>`;
      }
    }
    grid += '</div>';
    const seedStr = String(w.seed);
    const isFav = state.savedSeeds.some(s => s.seed === w.seed && s.biomeIndex === w.biomeIndex);
    screenEl.innerHTML = `
      ${screenTitle(`${biome.name.toUpperCase()} — FOG SECTOR`, biome.accentColor)}
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:9.5px; color:var(--ink-dim);">
        <span>Steps ${w.steps} · Ticks ${state.ticks||0}${!state.bossDefeated[w.biomeIndex] ? ' · ☠' : ''}</span>
        <button class="btn" id="legend-toggle" style="padding:2px 6px; font-size:9px;">${wildLegendOpen?'▲ Hide':'❓ Legend'}</button>
      </div>
      ${biome.mechanic ? `<div style="font-size:9px; color:${biome.accentColor}; margin-bottom:4px;">${biome.mechanic.split('.')[0]}.</div>` : ''}
      ${biome.bossSignal ? `<div style="font-size:10px; color:var(--violet); margin-bottom:4px;">${bossSignalText(w)}</div>` : ''}
      ${w.daily && state.daily && !state.daily.sector.claimed ? `<div style="font-size:9.5px; color:#7dffb0; margin-bottom:4px;">✪ Daily Sector — find the cache for today's bonus.</div>` : ''}
      ${wildLegendOpen ? `<div style="font-size:9px; color:var(--ink-dim); margin-bottom:6px; background:rgba(255,255,255,.03); border-radius:6px; padding:4px 6px;">⛩ gate exits · ✦ shrine · ⚷ key / ▣ vault · ✕ anomaly · ☠ boss lurks nearby · ♨ heat vent · ✪ daily cache</div>` : ''}
      ${grid}
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:6px; font-size:9px; color:var(--ink-dim);">
        <span>Seed <span class="pixel-font" style="color:var(--phosphor);">${seedStr}</span></span>
        <button class="btn" id="copy-seed" style="padding:2px 6px; font-size:8.5px;">⧉</button>
        <button class="btn ${isFav?'btn-amber':''}" id="fav-seed" style="padding:2px 6px; font-size:8.5px;">${isFav?'★':'☆'}</button>
      </div>
      <div style="font-size:9.5px; color:var(--ink-dim); margin-top:6px; text-align:center;">${state.log[0] || ''}</div>
    `;
    const legendBtn = screenEl.querySelector('#legend-toggle');
    if(legendBtn) legendBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); wildLegendOpen = !wildLegendOpen; render(); });
    controlsEl.innerHTML = `
      <div class="wild-controls">
        <div class="dpad-grid dpad-sm">
          <div></div><button class="btn dpad-btn" id="mv-up">▲</button><div></div>
          <button class="btn dpad-btn" id="mv-left">◀</button>
          <div></div>
          <button class="btn dpad-btn" id="mv-right">▶</button>
          <div></div><button class="btn dpad-btn" id="mv-down">▼</button><div></div>
        </div>
        <button class="btn btn-crimson wild-exit" id="mv-exit">EXIT</button>
      </div>`;
    controlsEl.querySelector('#mv-up').addEventListener('click', ()=>moveWild(0,-1));
    controlsEl.querySelector('#mv-down').addEventListener('click', ()=>moveWild(0,1));
    controlsEl.querySelector('#mv-left').addEventListener('click', ()=>moveWild(-1,0));
    controlsEl.querySelector('#mv-right').addEventListener('click', ()=>moveWild(1,0));
    controlsEl.querySelector('#mv-exit').addEventListener('click', ()=>{ state.screen='town'; logMsg('Returned to Neon Haven.'); render(); });
    screenEl.querySelector('#copy-seed').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const seedStr = String(w.seed);
      const done = () => { logMsg('Seed copied to clipboard.'); render(); };
      const manualCopyFallback = () => showPromptModal('Copy this seed:', seedStr, ()=>{});
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(seedStr).then(done).catch(manualCopyFallback);
      } else {
        manualCopyFallback();
      }
    });
    screenEl.querySelector('#fav-seed').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleFavoriteSeed(w.seed, w.biomeIndex);
    });
  }

  // Shared by anything that "spends time" in the world — wilderness steps
  // and mine digs/moves alike — so cooldowns and crop growth advance
  // consistently regardless of which activity you're doing.
  function advanceTick(){
    advanceTickCore();
    tickModules();
    if(state.farm && state.farm.boostTicks > 0) state.farm.boostTicks--;
  }
  function advanceTickCore(){
    state.ticks = (state.ticks||0) + 1;
    state.storage.forEach(mon => {
      if(mon.jobCooldown > 0) mon.jobCooldown--;
      if(mon.trainCooldown > 0) mon.trainCooldown--;
      if(mon.playCooldown > 0) mon.playCooldown--;
    });
    if(state.farm){
      state.farm.pods.forEach(pod => {
        if(pod.state === 'growing'){
          pod.growTicks++;
          if((state.farm.boostTicks||0) > 0) pod.growTicks++; // Pod Overclock: double speed
          const crop = CROPS[pod.cropId];
          if(crop && pod.growTicks >= crop.growTicks){
            pod.state = 'ready';
            pod.readyAtTick = state.ticks;
          }
        } else if(pod.state === 'ready'){
          const crop = CROPS[pod.cropId];
          if(crop && (state.ticks - pod.readyAtTick) > crop.witherTicks){
            pod.state = 'withered';
          }
        }
      });
    }
  }

  function moveWild(dx,dy){
    const w = state.wild;
    const biome = BIOMES[w.biomeIndex];
    const nx = w.px+dx, ny = w.py+dy;
    if(nx<0||ny<0||nx>=w.size||ny>=w.size) return;
    const cell = w.grid[ny][nx];
    if(!isPassableRole(cell.role)){
      const tileInfo = cell.role==='blockA' ? biome.tiles.blockA : biome.tiles.blockB;
      logMsg(`A ${tileInfo.name} blocks the way.`);
      render(); return;
    }

    w.px = nx; w.py = ny; w.steps++;
    applyFog(w, biome);
    questEvent('step', 1);

    advanceTick();

    const p = getActive();
    p.hunger = Math.max(0, p.hunger - (hasModule(p,'nutrientCell') ? 1 : 2));
    p.energy = Math.max(0, p.energy - 1);
    gainXp(p, 1);

    if(cell.role === 'chest' && !cell.opened){
      cell.opened = true;
      questEvent('chest', 1);
      const roll = Math.random();
      if(roll < 0.5){ const bits = 10+w.biomeIndex*8+Math.floor(Math.random()*30); state.bits += bits; logMsg(`Found a chest with ◈${bits} Bits!`); }
      else { state.inventory.trapSphere++; logMsg('Found a chest with a Trap Sphere!'); }
      render(); return;
    }
    if(cell.role === 'shrine' && !cell.opened){
      cell.opened = true;
      const bits = 20 + w.biomeIndex*10;
      state.bits += bits;
      gainXp(p, 8);
      logMsg(`A quiet shrine hums with old code. You feel steadier. +◈${bits} Bits and a flicker of insight.`);
      render(); return;
    }
    if(cell.role === 'key' && !cell.opened){
      cell.opened = true;
      w.hasKey = true;
      logMsg('Found a rusted key. Something nearby must be locked...');
      render(); return;
    }
    if(cell.role === 'vault'){
      if(cell.opened){ render(); return; }
      if(!w.hasKey){ logMsg('A sealed vault. It looks like it needs a key.'); render(); return; }
      cell.opened = true;
      questEvent('chest', 1);
      const bits = 40 + w.biomeIndex*15;
      state.bits += bits;
      state.inventory.trapSphere += 2;
      logMsg(`The key fits! The vault opens: +◈${bits} Bits and 2 Trap Spheres!`);
      render(); return;
    }
    if(cell.role === 'anomaly' && !cell.opened){
      cell.opened = true;
      startAnomalyEncounter(w.biomeIndex, w.seed, nx, ny);
      return;
    }
    if(cell.role === 'gate'){
      state.screen='town'; logMsg('Returned to Neon Haven.'); render(); return;
    }
    if(cell.role === 'boss'){
      startBossEncounter(w.biomeIndex);
      return;
    }
    if(cell.role === 'cache' && !cell.opened){
      cell.opened = true;
      claimDailyCache(w);
      render(); return;
    }
    if(cell.role === 'hazard' && biome.hazard){
      const mult = biome.hazard.typeMult[getForm(p).type];
      const m = (mult === undefined) ? 1 : mult;
      if(m === 0){ logMsg(`${getForm(p).name} strides through the ${biome.tiles.hazard.name} untouched — Fire types are immune.`); }
      else {
        const dmg = Math.max(1, Math.round(p.maxHp * biome.hazard.dmgPct * m));
        const dealt = Math.min(dmg, Math.max(0, p.hp - 1)); // vents never faint you
        p.hp -= dealt;
        logMsg(`A ${biome.tiles.hazard.name} scorches ${getForm(p).name} for ${dealt} damage${m<1?' (resisted)':(m>1?' (vulnerable!)':'')}. HP ${p.hp}/${p.maxHp}.`);
      }
      render(); return;
    }
    if(p.hunger <= 0){
      logMsg(`${getForm(p).name} is starving and too weak to explore further!`);
      state.screen='town'; render(); return;
    }
    if(cell.role === 'open' && Math.random() < encounterChance(p)){
      if(state.wanted.length && Math.random() < 0.15){
        startWantedEncounter(state.wanted[Math.floor(Math.random()*state.wanted.length)]);
      } else {
        startEncounter();
      }
      return;
    }
    render();
  }

  function startEncounter(){
    const w = state.wild;
    const biome = BIOMES[w.biomeIndex];
    const pool = encounterPool(biome);
    const lineId = pool[Math.floor(Math.random()*pool.length)];
    const p = getActive();
    const lvl = Math.max(1, p.level + biomeLevelOffset(biome, w.biomeIndex) + Math.floor(Math.random()*3) - 1);
    const enemy = newMonster(lineId, 1, lvl);
    const enemyName = getForm(enemy).name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playTransition(`A wild<br>${enemyName}<br>appeared!`, 'var(--crimson)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`A wild ${enemyName} appeared!`);
      render();
    });
  }

  function startWantedEncounter(entry){
    const enemy = newMonster(entry.speciesId, entry.gen, entry.level, entry.ivs);
    enemy.stage = Math.min(entry.stage, EVOLUTION_LINES[entry.speciesId].length);
    enemy.marked = !!entry.marked; // preserve the original individual's marked status
    recalcStats(enemy, true);
    updateMoveUnlocks(enemy);
    enemy.isWanted = true;
    enemy.wantedEntryId = entry.id;
    enemy.nickname = entry.name;
    const enemyName = entry.name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playTransition(`🎯 It's back!<br>${enemyName}<br>the one that got away!`, 'var(--amber)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`${enemyName} reappears — this could be your chance!`);
      render();
    });
  }

  function startAnomalyEncounter(biomeIndex, mapSeed, x, y){
    const biome = BIOMES[biomeIndex];
    const rng = anomalySeedRng(mapSeed, x, y);
    const pool = anomalyPool(biome);
    const lineId = pool[Math.floor(rng()*pool.length)];
    const ivs = {
      hp:  IV_MIN + rng()*(IV_MAX-IV_MIN),
      str: IV_MIN + rng()*(IV_MAX-IV_MIN),
      def: IV_MIN + rng()*(IV_MAX-IV_MIN),
      spd: IV_MIN + rng()*(IV_MAX-IV_MIN),
    };
    const marked = rng() < MARKED_CHANCE;
    const p = getActive();
    const lvl = Math.max(1, p.level + biomeLevelOffset(biome, biomeIndex) + 2 + Math.floor(Math.random()*3)); // difficulty, not identity — stays unseeded
    const enemy = newMonster(lineId, 1, lvl, ivs);
    enemy.marked = marked;
    enemy.maxHp = Math.round(enemy.maxHp*1.25); enemy.hp = enemy.maxHp;
    enemy.str = Math.round(enemy.str*1.2);
    enemy.def = Math.round(enemy.def*1.2);
    enemy.spd = Math.round(enemy.spd*1.2);
    enemy.isAnomaly = true;
    const enemyName = getForm(enemy).name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playTransition(`⚠ Anomaly detected!<br>A charged ${enemyName}<br>flickers into view!`, 'var(--violet)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`A charged ${enemyName} flickers into view — this one looks tougher, but worth it! This exact spot on this seed will always hold this encounter.`);
      render();
    });
  }

  // Levels for wild spawns are relative to your active partner. Older biomes use idx*2;
  // newer ones set levelOffset explicitly. Late bosses also scale off the partner.
  function biomeLevelOffset(biome, idx){ return biome.levelOffset != null ? biome.levelOffset : idx*2; }
  function createBoss(biome){
    let bossLvl = biome.bossLevel;
    if(biome.bossLevelOffset != null){ const ap = getActive(); if(ap) bossLvl = Math.max(bossLvl, ap.level + biome.bossLevelOffset); }
    const boss = newMonster(biome.bossSpecies, 2, bossLvl);
    boss.stage = Math.min(2, EVOLUTION_LINES[biome.bossSpecies].length);
    recalcStats(boss, true);
    boss.maxHp = Math.round(boss.maxHp * biome.bossMult);
    boss.str   = Math.round(boss.str   * biome.bossMult);
    boss.def   = Math.round(boss.def   * biome.bossMult);
    boss.spd   = Math.round(boss.spd   * biome.bossMult);
    boss.hp = boss.maxHp;
    updateMoveUnlocks(boss);
    boss.isBoss = true;
    boss.bossTitle = biome.bossTitle;
    boss.marked = false; // bosses are already unique — no marked variant
    return boss;
  }

  function startBossEncounter(biomeIndex){
    const biome = BIOMES[biomeIndex];
    const boss = createBoss(biome);
    dexMarkSeen(boss.speciesId, boss.stage);
    playTransition(`⚠<br>${boss.bossTitle}<br>rises to block your path!`, 'var(--crimson)', ()=>{
      state.battle = { enemy: boss, over:false, isBoss:true, biomeIndex, bossVictory:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`⚠ ${boss.bossTitle} rises to block your path!`);
      render();
    }, 850);
  }

  /* ---------------------------------------------------------
     BATTLE
  --------------------------------------------------------- */
  function renderBattle(screenEl, controlsEl){
    const b = state.battle;
    const p = getActive();
    const psp = getForm(p);
    const esp = getForm(b.enemy);
    const bar = (val,max,color) => `<div class="barwrap"><div class="barfill" style="width:${100*val/max}%;background:${color}"></div></div>`;
    const catchChance = estimateCatchChance(b.enemy);
    if(!Array.isArray(b.log)) b.log = state.log.slice(0,1);
    const battleLines = b.log;

    screenEl.innerHTML = `
      ${screenTitle(b.isBoss ? '⚠ BOSS ENCOUNTER' : (b.enemy.isWanted ? '🎯 WANTED ENCOUNTER' : (b.enemy.isAnomaly ? '⚠ ANOMALY ENCOUNTER' : '⚔ ENCOUNTER')), b.enemy.isWanted ? 'var(--amber)' : (b.enemy.isAnomaly && !b.isBoss ? 'var(--violet)' : 'var(--crimson)'))}
      ${b.isBoss ? `<div class="card" style="border-color:var(--crimson); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--crimson);">${b.enemy.bossTitle}</div>` : ''}
      ${(!b.isBoss && b.enemy.isWanted) ? `<div class="card" style="border-color:var(--amber); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--amber);">The one that got away — easier to bring in this time.</div>` : ''}
      ${(!b.isBoss && !b.enemy.isWanted && b.enemy.isAnomaly) ? `<div class="card" style="border-color:var(--violet); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--violet);">A charged, unstable reading — tougher, but worth chasing.</div>` : ''}
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <div class="card" style="flex:1; text-align:center;">
          ${spriteImgHtml(b.enemy, b.isBoss?60:48)}
          <div style="color:${esp.color}; margin-top:4px;">${esp.name} <span class="badge">Lv${b.enemy.level}</span>${b.enemy.marked?' <span class="badge" style="color:#fff44d;border-color:#fff44d;">✦</span>':''}</div>
          <div style="font-size:9.5px; color:var(--ink-dim); margin-top:4px;">HP ${b.enemy.hp}/${b.enemy.maxHp}</div>
          ${bar(b.enemy.hp,b.enemy.maxHp,'var(--crimson)')}
        </div>
        <div class="card" style="flex:1; text-align:center;">
          ${spriteImgHtml(p, 48)}
          <div style="color:${psp.color}; margin-top:4px;">${p.nickname||psp.name} <span class="badge">Lv${p.level}</span>${p.marked?' <span class="badge" style="color:#fff44d;border-color:#fff44d;">✦</span>':''}</div>
          <div style="font-size:9.5px; color:var(--ink-dim); margin-top:4px;">HP ${p.hp}/${p.maxHp}</div>
          ${bar(p.hp,p.maxHp,'var(--phosphor)')}
        </div>
      </div>
      <div id="battle-log" style="margin-top:10px; font-size:10.5px; line-height:1.4; color:var(--ink-dim); height:${b.isBoss?100:130}px; overflow-y:auto; background:rgba(255,255,255,.03); border-radius:6px; padding:5px 8px;">${battleLines.map((l,i)=>`<div style="${i===battleLines.length-1?'color:var(--ink);':'opacity:.75;'}">${i===battleLines.length-1?'▸ ':'· '}${l}</div>`).join('')}</div>
      ${(!b.over && b.enemy.marked && !b.enemy.isWanted) ? `<div style="font-size:10px;color:#fff44d;margin-top:2px;">✦ This one is Marked — extremely rare!</div>` : ''}
      ${(!b.over && !b.isBoss) ? `<div style="font-size:10px;color:var(--amber);margin-top:6px;">Est. catch chance if thrown now: ${(catchChance*100).toFixed(0)}% (Trap Spheres: ${state.inventory.trapSphere})</div>` : ''}
      ${(!b.over && b.isBoss) ? `<div style="font-size:10px;color:var(--crimson);margin-top:6px;">This foe cannot be captured — it must be defeated.</div>` : ''}

    const blog = screenEl.querySelector('#battle-log');
    if(blog) blog.scrollTop = blog.scrollHeight;

    if(b.over){
      if(b.offerWanted){
        controlsEl.innerHTML = `
          <div style="font-size:10.5px; color:var(--ink-dim); text-align:center; margin-bottom:8px;">It got away! Add ${getForm(b.enemy).name} (Lv${b.enemy.level}, Potential ${potentialStars(b.enemy.ivs)}) to your Wanted Board? You'll have a real edge catching this exact one if it turns up again.</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="btn btn-amber" id="wanted-yes">📋 Add to Wanted</button>
            <button class="btn" id="wanted-no">Let it go</button>
          </div>`;
        const finishEscape = () => {
          b.offerWanted = false;
          const wasBossVictory = b.bossVictory;
          state.battle = null;
          state.screen = wasBossVictory ? 'town' : (b.source === 'mine' ? (state.mine ? 'mine' : 'town') : (state.wild ? 'wild' : 'town'));
          if(wasBossVictory) state.wild = null;
          render();
        };
        controlsEl.querySelector('#wanted-yes').addEventListener('click', ()=>{ addToWanted(b.enemy); finishEscape(); });
        controlsEl.querySelector('#wanted-no').addEventListener('click', finishEscape);
        return;
      }
      controlsEl.innerHTML = `<button class="btn btn-primary" id="continue" style="width:100%;">Continue</button>`;
      controlsEl.querySelector('#continue').addEventListener('click', ()=>{
        const wasBossVictory = b.bossVictory;
        state.battle = null;
        state.screen = wasBossVictory ? 'town' : (b.source === 'mine' ? (state.mine ? 'mine' : 'town') : (state.wild ? 'wild' : 'town'));
        if(wasBossVictory) state.wild = null;
        render();
      });
      return;
    }

    const moveBtns = getBattleMoves(p).map(mid => {
      const mv = MOVES[mid];
      const mult = mv.type ? typeMultiplier(mv.type, esp.type) : 1;
      const hint = mult>1 ? '<span style="color:var(--phosphor);">▲</span>' : (mult<1 ? '<span style="color:var(--crimson);">▼</span>' : '');
      return `<button class="btn btn-crimson" data-move="${mid}" title="${mv.desc}">⚔ ${mv.name}${mv.type?` <span style="font-size:8px;opacity:.7;">[${mv.type}]</span>`:''} ${hint}</button>`;
    }).join('');

    controlsEl.innerHTML = `
      <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">MOVES</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        ${moveBtns}
      </div>
      <div style="border-top:1px solid var(--glass-border); margin:10px 0 8px; padding-top:8px;">
        <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">ACTIONS</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${b.isBoss ? '' : `<button class="btn btn-cyan" id="act-catch" ${state.inventory.trapSphere<=0?'disabled':''}>◈ Throw Trap Sphere</button>`}
          <button class="btn btn-amber" id="act-medicine" ${(state.inventory.medicine<=0 || p.hp>=p.maxHp)?'disabled':''}>🩹 Use Medicine (x${state.inventory.medicine})</button>
          ${['nanoPatch','overloadChip','firewallChip'].filter(id => (state.inventory[id]||0) > 0).map(id => `<button class="btn btn-violet" data-item="${id}" ${(id==='nanoPatch' && p.hp>=p.maxHp)?'disabled':''}>${SUPPLY_ITEMS[id].icon} ${SUPPLY_ITEMS[id].name} (x${state.inventory[id]})</button>`).join('')}

        </div>
      </div>`;
    controlsEl.querySelectorAll('[data-move]').forEach(btn=>{
      btn.addEventListener('click', ()=>battleAction('move', btn.getAttribute('data-move')));
    });
    const catchBtn = controlsEl.querySelector('#act-catch');
    if(catchBtn) catchBtn.addEventListener('click', ()=>battleAction('catch'));
    controlsEl.querySelectorAll('[data-item]').forEach(btn => btn.addEventListener('click', ()=>battleAction('item', btn.getAttribute('data-item'))));
    const medBtn = controlsEl.querySelector('#act-medicine');
    if(medBtn) medBtn.addEventListener('click', ()=>battleAction('medicine'));
    controlsEl.querySelector('#act-flee').addEventListener('click', ()=>battleAction('flee'));

  function estimateCatchChance(enemy){
    const hpFrac = enemy.hp / enemy.maxHp;
    let chance = 0.05 + Math.pow(1 - hpFrac, 2) * 0.9;
    if(enemy.isAnomaly) chance += 0.15;
    if(enemy.isWanted) chance += 0.20;
    const ap = getActive();
    if(ap && hasModule(ap,'trapAssist')) chance *= 1.25;
    return Math.max(0.05, Math.min(0.95, chance));
  }

  function markBattleOver(b){
    b.over = true;
    if(b.catchAttempted && !b.enemy.isWanted && !b.isBoss){
      b.offerWanted = true;
    }
  }

  function battleAction(action, moveId){
    const b = state.battle;
    const p = getActive();
    if(b.over) return;

    if(action === 'flee'){
      if(Math.random() < fleeChance(p, b.enemy)){ logMsg('You escaped safely.'); markBattleOver(b); }
      else { logMsg('Could not escape!'); enemyTurn(); }
      render(); return;
    }

    if(action === 'move'){
      const mv = MOVES[moveId];
      if(!mv){ console.error('Unknown move id:', moveId); render(); return; }
      const mult = typeMultiplier(mv.type, getForm(b.enemy).type);
      const dmg = Math.max(1, Math.round(p.str * mv.power * mult * (1 + Math.random()*0.25) - b.enemy.def*0.5));
      b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
      logMsg(`${mv.name} hit for ${dmg} damage.${mult>1 ? ' Super effective!' : (mult<1 ? ' Not very effective...' : '')}`);
    }
    else if(action === 'medicine'){
      if(state.inventory.medicine <= 0){ logMsg('No Medicine left — visit the shop.'); render(); return; }
      if(p.hp >= p.maxHp){ logMsg(`${getForm(p).name} is already at full HP.`); render(); return; }
      state.inventory.medicine--;
      p.hp = p.maxHp;
      logMsg(`Used Medicine — ${getForm(p).name}'s HP fully restored.`);
    }
    else if(action === 'item'){
      const id = moveId, inv = state.inventory;
      if((inv[id]||0) <= 0){ logMsg('You are out of that item.'); render(); return; }
      if(id === 'nanoPatch'){
        if(p.hp >= p.maxHp){ logMsg(`${getForm(p).name} is already at full HP.`); render(); return; }
        inv.nanoPatch--;
        const heal = Math.max(1, Math.round(p.maxHp * 0.30));
        p.hp = Math.min(p.maxHp, p.hp + heal);
        logMsg(`Nano Patch restored ${heal} HP.`);
      } else if(id === 'overloadChip'){
        inv.overloadChip--;
        const dmg = Math.max(1, Math.round(p.str * 2.2 * (1 + Math.random()*0.25) - b.enemy.def*0.5));
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        logMsg(`Overload Chip discharged for ${dmg} damage!`);
      } else if(id === 'firewallChip'){
        inv.firewallChip--;
        b.shield = true;
        logMsg('A Firewall flares up around your partner.');
      } else { render(); return; }
    }
    else if(action === 'catch'){
      if(b.isBoss){ logMsg('This foe cannot be captured — you must defeat it to pass.'); render(); return; }
      state.inventory.trapSphere--;
      b.catchAttempted = true;
      const chance = estimateCatchChance(b.enemy);
      if(Math.random() < chance){
        const caught = { ...b.enemy };
        caught.uid = 'm' + Math.random().toString(36).slice(2,10);
        caught.hp = caught.maxHp; caught.hunger=100; caught.energy=100;
        delete caught.isAnomaly;
        const wasWanted = caught.isWanted;
        const wantedId = caught.wantedEntryId;
        delete caught.isWanted; delete caught.wantedEntryId;
        state.storage.push(caught);
        dexMarkCaught(caught);
        questEvent('catch', 1, { type: getForm(caught).type });
        if(wasWanted) state.wanted = state.wanted.filter(w=>w.id!==wantedId);
        const bits = bitsBoost(Math.round((10 + b.enemy.level*4) * (b.enemy.isAnomaly ? 1.8 : 1)));
        state.bits += bits;
        logMsg((b.enemy.marked ? '✦ MARKED! ' : '') + (wasWanted ? `You finally caught ${getForm(b.enemy).name} — the one that got away! +${bits} Bits.` : `Captured ${getForm(b.enemy).name}! +${bits} Bits. Added to Storage Box.`));
        gainXp(p, Math.round((6 + b.enemy.level*3) * (b.enemy.isAnomaly ? 1.5 : 1)));
        b.over = true; render(); return;
      } else {
        logMsg('The Trap Sphere shattered — capture failed!');
      }
    }

    if(b.enemy.hp <= 0){
      if(b.isBoss){
        const bits = bitsBoost(150 + b.biomeIndex*80);
        state.bits += bits;
        gainXp(p, 80 + b.enemy.level*8);
        state.bossDefeated[b.biomeIndex] = true;
        questEvent('win', 1, { type: getForm(b.enemy).type });
        const nextIdx = b.biomeIndex + 1;
        let unlockMsg = '';
        if(nextIdx < BIOMES.length && state.unlockedBiomeIndex < nextIdx){
          state.unlockedBiomeIndex = nextIdx;
          unlockMsg = ` The path to ${BIOMES[nextIdx].name} has opened!`;
        }
        logMsg(`${b.enemy.bossTitle} was defeated! +◈${bits} Bits.${unlockMsg}`);
        b.over = true; b.bossVictory = true; render(); return;
      }
      const bits = bitsBoost(Math.round((8 + b.enemy.level*3) * (b.enemy.isAnomaly ? 1.8 : 1)));
      state.bits += bits;
      logMsg(`${getForm(b.enemy).name} was defeated! +${bits} Bits.`);
      questEvent('win', 1, { type: getForm(b.enemy).type });
      gainXp(p, Math.round((12 + b.enemy.level*6) * (b.enemy.isAnomaly ? 1.5 : 1)));
      markBattleOver(b); render(); return;
    }
    enemyTurn();
    render();
  }

  // SPD's combat role: a faster partner is more likely to slip an incoming
  // counterattack entirely, and more likely to successfully flee. Kept modest
  // (3%-35%) so it's a real edge rather than a coinflip that overrides HP/DEF.
  function dodgeChance(defenderSpd, attackerSpd){
    const ratio = defenderSpd / Math.max(1, attackerSpd);
    return Math.max(0.03, Math.min(0.35, 0.12 * ratio));
  }
  function fleeChance(p, enemy){
    const ratio = p.spd / Math.max(1, enemy.spd);
    return Math.max(0.2, Math.min(0.9, 0.5 + (ratio-1)*0.25));
  }

  function enemyTurn(){
    const b = state.battle;
    const p = getActive();
    if(b.over) return;
    if(b.shield){ b.shield = false; logMsg('The Firewall absorbed the enemy\'s attack!'); return; }
    if(Math.random() < dodgeChance(p.spd, b.enemy.spd)){
      logMsg(`${getForm(p).name} dodged the incoming strike!`);
      return;
    }
    const mult = typeMultiplier(getForm(b.enemy).type, getForm(p).type);
    let dmg = Math.max(1, Math.round(b.enemy.str * mult * (1+Math.random()*0.3) - p.def*0.5));
    if(p.hp - dmg <= 0 && hasModule(p,'lastStand')){
      dmg = Math.max(0, p.hp - 1);
      consumeModule(p);
      logMsg(`${getForm(p).name}'s Safety Buffer absorbed the killing blow!`);
    }
    p.hp = Math.max(0, p.hp - dmg);
    logMsg(`${getForm(b.enemy).name} struck back for ${dmg} damage.${mult>1 ? ' Super effective!' : (mult<1 ? ' Not very effective...' : '')}`);
    if(p.hp <= 0){
      logMsg(`${getForm(p).name} fainted! You retreat to Neon Haven.`);
      p.hp = Math.max(1, Math.round(p.maxHp*0.2));
      state.screen = 'town'; state.wild = null;
      if(b.source === 'mine') state.mine = null;
      markBattleOver(b);
    }
  }

      controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;

  const TUTORIAL_STEPS = [
    { t:'Welcome to Neon Haven', b:'You wake up in a town at the edge of a wild digital grid, with one partner monster beside you. Explore, catch monsters, grow stronger, and beat each biome\'s boss to open the next.' },
    { t:'The town menu', b:'The buttons below the screen are your town. <b>Wilderness Gate</b> is where you head out. <b>Shop</b>, <b>Storage</b>, <b>Inventory</b>, <b>Jobs</b> and the rest unlock or grow as you progress — a 🔒 tells you how to open it. The <b>📜 Log</b> at the top shows what just happened, on any screen.' },
    { t:'Exploring', b:'Pick a biome, then use the arrow pad to walk the map. Each step costs Energy and Hunger and earns a little XP. Fog hides the map until you get close. Look for <b>▪</b> chests, <b>✦</b> shrines and the <b>⛩</b> gate back home. Tap <b>❓ Legend</b> for all the symbols.' },
    { t:'Battles', b:'Wild monsters can appear as you walk. Pick a move — <b>▲</b> means strong against that enemy, <b>▼</b> weak. Use <b>Medicine</b> to heal, or <b>Flee</b> if it\'s going badly. A running log of the fight appears under the monsters.' },
    { t:'Catching monsters', b:'Wear an enemy down, then throw a <b>Trap Sphere</b>. The lower its HP, the better your odds — the battle screen shows the chance. You start with 5 spheres; buy more in the Shop. Bosses can\'t be caught.' },
    { t:'Looking after your partner', b:'Watch the <b>Hunger</b> and <b>Energy</b> bars. Feed with Prime Meat from the Inventory, or use <b>Rest Partner</b> in town. If Hunger reaches 0 you can\'t keep exploring.' },
    { t:'Your first steps', b:'Claim your <b>Daily</b> reward, then head out through the Wilderness Gate. Anytime you\'re unsure, open <b>❓ Help</b> in the town menu — it explains every system by topic, and you can replay this tutorial there.' },
  ];
  function showTutorial(step){
    step = Math.max(0, Math.min(TUTORIAL_STEPS.length-1, step));
    const s = TUTORIAL_STEPS[step];
    const last = step === TUTORIAL_STEPS.length-1;
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="pixel-font glow" style="font-size:10px; color:var(--phosphor);">${s.t}</div>
        <span class="badge">${step+1}/${TUTORIAL_STEPS.length}</span>
      </div>
      <div style="font-size:11px; color:var(--ink); line-height:1.55; margin-bottom:14px; max-height:50vh; overflow-y:auto;">${s.b}</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button class="btn" id="tut-back" ${step===0?'disabled':''}>← Back</button>
        <button class="btn btn-primary" id="tut-next">${last?'Start playing':'Next →'}</button>
      </div>
      ${last?'':'<button class="btn" id="tut-skip" style="width:100%; margin-top:8px; font-size:10.5px;">Skip tutorial</button>'}`;
    overlay.style.display = 'flex';
    const finish = () => { closeModal(); if(state && !state.tutorialDone){ state.tutorialDone = true; save(); } render(); };
    document.getElementById('tut-next').addEventListener('click', ()=>{ last ? finish() : showTutorial(step+1); });
    document.getElementById('tut-back').addEventListener('click', ()=>showTutorial(step-1));
    const skip = document.getElementById('tut-skip');
    if(skip) skip.addEventListener('click', finish);
  }


  let dexFilter = { status:'all', type:'all' }; // transient UI state, not persisted
  function renderDex(screenEl, controlsEl){
    const dex = state.dex || {};
    const totalLines = lineIds.length;
    const caughtLines = lineIds.filter(id => dexCaughtAny(dex[id])).length;
    const pct = totalLines ? Math.round(caughtLines/totalLines*100) : 0;
    const statusOf = id => dexCaughtAny(dex[id]) ? 'caught' : (dexSeenAny(dex[id]) ? 'seen' : 'unknown');

    const cardFor = (lineId) => {
      const line = EVOLUTION_LINES[lineId];
      const entry = dex[lineId];
      const stageBlock = (stage) => {
        const form = line[stage-1];
        const seen = !!(entry && entry.seenStage && entry.seenStage[stage]);
        const caught = !!(entry && entry.caughtStage && entry.caughtStage[stage]);
        if(!seen){
          return `<div style="flex:1; text-align:center; opacity:.4;">
            <div style="width:40px;height:40px;margin:0 auto; border:1px dashed var(--ink-dim); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-dim);">?</div>
            <div style="font-size:8.5px; color:var(--ink-dim); margin-top:3px;">Undiscovered</div>
          </div>`;
        }
        const sprite = (caught && entry.best && entry.best.stage === stage)
          ? spriteImgHtml({speciesId:lineId, stage, ivs:entry.best.ivs, cosmetic:entry.best.cosmetic, uid:entry.best.uid}, 40)
          : `<span style="display:inline-block; filter:grayscale(1) brightness(.55);">${spriteImgHtml({speciesId:lineId, stage, ivs:null, cosmetic:null, uid:lineId+'_dex_'+stage}, 40)}</span>`;
        return `<div style="flex:1; text-align:center;">
          ${sprite}
          <div style="font-size:9px; color:${caught?form.color:'var(--ink-dim)'}; margin-top:3px;">${caught ? form.name : '???'}</div>
          ${caught ? `<div style="font-size:8px; color:var(--amber);">${potentialStars(entry.best && entry.best.stage===stage ? entry.best.ivs : null)}</div>` : `<div style="font-size:8px; color:var(--ink-dim);">seen, not caught</div>`}
        </div>`;
      };
      const known = statusOf(lineId) !== 'unknown';
      const blocks = line.map((_,i)=>stageBlock(i+1)).join(`<div style="align-self:center; color:var(--ink-dim); font-size:11px;">→</div>`);
      return `<div class="card" style="${known?'':'opacity:.55;'}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:10.5px; color:${known?'var(--ink)':'var(--ink-dim)'};">${known ? line[0].name + ' Line' : '??????? Line'}</span>
          <span class="badge">${entry ? entry.catches : 0} caught</span>
          ${entry && entry.markedCaught ? '<span class="badge" style="color:#fff44d;border-color:#fff44d;">✦ Marked found</span>' : ''}
        </div>
        <div style="display:flex; gap:8px;">${blocks}</div>
      </div>`;
    };

    // Filters: status chips + type select. A type filter hides never-seen lines
    // so it can't be used to spoil what's undiscovered.
    const visible = lineIds.filter(id => {
      const st = statusOf(id);
      if(dexFilter.status === 'caught' && st !== 'caught') return false;
      if(dexFilter.status === 'missing' && st === 'caught') return false;
      if(dexFilter.type !== 'all' && (st === 'unknown' || EVOLUTION_LINES[id][0].type !== dexFilter.type)) return false;
      return true;
    });
    const chip = (id, label) => `<button class="btn ${dexFilter.status===id?'btn-cyan':''}" style="padding:4px 9px; font-size:9.5px;" data-dex-status="${id}">${label}</button>`;

    screenEl.innerHTML = `
      ${screenTitle('📖 MONSTER DEX', 'var(--violet)')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">${caughtLines}/${totalLines} lines caught (${pct}%) · encounter a species in the wild to log it, catch or hatch one to reveal it fully.</div>
      <div class="card" style="margin-bottom:10px; border-color:var(--amber);">
        <div style="font-size:10.5px; color:var(--amber); margin-bottom:6px;">🏆 Milestones</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${DEX_MILESTONES.map(ms => {
            const claimed = (state.dexMilestonesClaimed||[]).includes(ms.id);
            const ready = !claimed && ms.check(state.dex||{});
            return `<div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.03); border:1px solid ${ready?'var(--amber)':'var(--glass-border)'}; border-radius:6px; padding:5px 7px;">
              <div style="flex:1;">
                <div style="font-size:9.5px; color:${claimed?'var(--phosphor)':(ready?'var(--amber)':'var(--ink-dim)')};">${claimed?'✓ ':''}${ms.name}</div>
                <div style="font-size:8.5px; color:var(--ink-dim);">${ms.desc} — ${rewardText(ms.reward)}</div>
              </div>
              ${ready ? `<button class="btn btn-amber" style="padding:4px 8px; font-size:9px;" data-claim-ms="${ms.id}">Claim</button>` : (claimed ? '' : '<span style="font-size:8.5px; color:var(--ink-dim);">locked</span>')}
            </div>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:8px;">
        ${chip('all','All')}${chip('caught','Caught')}${chip('missing','Missing')}
        <select data-dex-type style="flex:1; min-width:90px; font-size:9.5px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:4px;">
          <option value="all">All types</option>
          ${Object.keys(TYPE_CHART).map(t=>`<option value="${t}" ${dexFilter.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:9px; color:var(--ink-dim); margin-bottom:6px;">Showing ${visible.length} of ${totalLines}</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${visible.length ? visible.map(cardFor).join('') : '<div class="card" style="font-size:10px; color:var(--ink-dim);">Nothing matches this filter yet.</div>'}
      </div>
    `;
    screenEl.querySelectorAll('[data-claim-ms]').forEach(btn=>{
      btn.addEventListener('click', ()=>claimDexMilestone(btn.getAttribute('data-claim-ms')));
    });
    screenEl.querySelectorAll('[data-dex-status]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ dexFilter.status = btn.getAttribute('data-dex-status'); render(); });
    });
    const typeSel = screenEl.querySelector('[data-dex-type]');
    if(typeSel) typeSel.addEventListener('change', ()=>{ dexFilter.type = typeSel.value; render(); });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

     STORAGE BOX

  function renderStorage(screenEl, controlsEl){
    screenEl.innerHTML = `
      ${screenTitle('📦 STORAGE BOX')}
      ${sortBarHtml()}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${sortedMonsters().map(m => monsterCard(m, {showSell:true})).join('')}
      </div>
    `;

    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });

    state.storage.forEach(m=>{
      const setBtn = screenEl.querySelector(`[data-set="${m.uid}"]`);
      if(setBtn) setBtn.addEventListener('click', ()=>{ state.activeId = m.uid; logMsg(`${getForm(m).name} is now your active partner.`); render(); });
    });
    screenEl.querySelectorAll('[data-sell]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sellConfirmUid = btn.getAttribute('data-sell'); render(); });
    });
    screenEl.querySelectorAll('[data-sell-confirm]').forEach(btn=>{
      btn.addEventListener('click', ()=>sellMonster(btn.getAttribute('data-sell-confirm')));
    });
    screenEl.querySelectorAll('[data-sell-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sellConfirmUid = null; render(); });
    });
    screenEl.querySelectorAll('[data-equip-cos]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const uid = btn.getAttribute('data-equip-uid');
        const cid = btn.getAttribute('data-equip-cos');
        const mon = state.storage.find(x=>x.uid===uid);
        if(!mon) return;
        mon.cosmetic = (cid === 'none') ? null : cid;
        const cos = COSMETICS.find(c=>c.id===cid);
        logMsg(cid==='none' ? `${getForm(mon).name} removed their accessory.` : `${getForm(mon).name} is now wearing ${cos.name}.`);
        render();
      });
    });
    screenEl.querySelectorAll('[data-mod-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ if(sel.value){ equipModule(sel.getAttribute('data-mod-select'), sel.value); render(); } });
    });
    screenEl.querySelectorAll('[data-mod-unequip]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ unequipModule(btn.getAttribute('data-mod-unequip')); render(); });
    });
    screenEl.querySelectorAll('[data-gear-slot]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const [uid, slotStr] = sel.getAttribute('data-gear-slot').split(':');
        const slot = parseInt(slotStr, 10);
        const gearId = sel.value || null;
        const mon = state.storage.find(x=>x.uid===uid);
        if(!mon) return;
        if(gearId) logMsg(`${getForm(mon).name} equipped ${GEAR_ITEMS[gearId].name}.`);
        else logMsg(`${getForm(mon).name} unequipped a gear slot.`);
        equipGear(uid, slot, gearId); // equipGear renders internally, so log first
      });
    });
  }

  function monsterCard(m, opts){
    opts = opts || {};
    const sp = getForm(m);
    const isActive = m.uid === state.activeId;
    const line = EVOLUTION_LINES[m.speciesId];
    const nextReq = m.stage < line.length ? line[m.stage].levelReq : null;
    const canSell = opts.showSell && !isActive && state.storage.length > 1;
    const confirming = opts.showSell && sellConfirmUid === m.uid;
    let sellBlockReason = '';
    if(opts.showSell && !canSell){
      if(isActive) sellBlockReason = ' (active partner)';
      else if(state.storage.length<=1) sellBlockReason = ' (last partner)';
    }
    const equippedId = m.cosmetic || 'none';
    return `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
          <div style="display:flex; align-items:center; gap:6px; color:${sp.color}">
            ${spriteImgHtml(m, 36)}
            <div>${m.nickname||sp.name} <span class="badge">Gen ${m.gen} · Lv${m.level}</span> ${isActive?'<span class="badge" style="color:var(--phosphor);border-color:var(--phosphor)">ACTIVE</span>':''} ${m.marked?'<span class="badge" style="color:#fff44d;border-color:#fff44d;">✦ MARKED</span>':''}</div>
          </div>
          ${!isActive ? `<button class="btn" style="padding:5px 8px; font-size:10px; flex-shrink:0;" data-set="${m.uid}">Set Active</button>` : ''}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:6px;">
          HP ${m.hp}/${m.maxHp} · STR ${m.str} · DEF ${m.def} · SPD ${m.spd} · Type: ${sp.type}
        </div>
        <div style="font-size:9.5px; color:var(--amber); margin-top:2px;">
          Potential: ${potentialStars(m.ivs)} <span style="color:var(--ink-dim);">· Standout: ${(ivBestStat(m.ivs)||'hp').toUpperCase()}</span>
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          Crests used: ${m.crestCount||0}/3${(m.jobCooldown||0)>0 ? ` · Job cooldown: ${m.jobCooldown} ticks` : ''}${(m.trainCooldown||0)>0 ? ` · Training cooldown: ${m.trainCooldown} ticks` : ''}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          XP ${m.xp}/${xpToNext(m.level)} ${nextReq ? `· Evolves at Lv${nextReq}` : '· Final form'}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          Moves: ${m.movesKnown.map(id=>MOVES[id].name).join(', ')}
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">ACCESSORY</div>
          <div style="display:flex; flex-wrap:wrap; gap:4px;">
            ${(m.ownedCosmetics||['none']).map(cid=>{
              const cos = COSMETICS.find(c=>c.id===cid);
              if(!cos) return '';
              const equipped = equippedId === cid;
              return `<button class="btn ${equipped?'btn-cyan':''}" style="padding:4px 7px; font-size:9px;" data-equip-uid="${m.uid}" data-equip-cos="${cid}">${cos.name}</button>`;
            }).join('')}
          </div>
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">GEAR (${m.gearSlots.filter(Boolean).length}/${GEAR_SLOT_COUNT})</div>
          <div style="display:flex; flex-direction:column; gap:4px;">
            ${Array.from({length:GEAR_SLOT_COUNT}).map((_,slot)=>{
              const equippedGearId = (m.gearSlots||[])[slot] || '';
              const ownedGearIds = Object.keys(state.inventory.gear||{}).filter(gid => (state.inventory.gear[gid]||0) > 0);
              const availableForThisSlot = ownedGearIds.filter(gid => gid === equippedGearId || (!m.gearSlots.includes(gid) && gearSpare(gid) > 0));
              return `<select data-gear-slot="${m.uid}:${slot}" style="width:100%; font-size:9px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:3px;">
                <option value="">Slot ${slot+1}: empty</option>
                ${availableForThisSlot.map(gid => {
                  const g = GEAR_ITEMS[gid];
                  if(!g) return '';
                  return `<option value="${gid}" ${equippedGearId===gid?'selected':''}>${g.icon} ${g.name}${g.statBonus?'':' (move)'}</option>`;

          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">MODULE</div>

            const bag = invModules();
            const held = def ? `<div style="font-size:9.5px; color:${def.color}; margin-bottom:4px;">${def.icon} ${def.name}${mod.ticksLeft!=null?` — ${mod.ticksLeft} ticks left`:(def.oneUse?' — 1 use':'')} <button class="btn" style="padding:2px 7px; font-size:8.5px; margin-left:4px;" data-mod-unequip="${m.uid}">Unequip</button></div>` : '';

          })()}
        </div>
        ${opts.showSell ? `
        <div style="margin-top:8px;">
          ${confirming ? `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              <button class="btn btn-crimson" style="padding:6px; font-size:10px;" data-sell-confirm="${m.uid}">Confirm — Sell for ◈${sellPrice(m)}</button>
              <button class="btn" style="padding:6px; font-size:10px;" data-sell-cancel="${m.uid}">Cancel</button>
            </div>
          ` : `
            <button class="btn ${canSell?'btn-crimson':''}" style="padding:6px; font-size:10px; width:100%;" data-sell="${m.uid}" ${canSell?'':'disabled'}>💰 Sell for ◈${sellPrice(m)}${sellBlockReason}</button>
          `}
        </div>` : ''}
      </div>`;
  }
