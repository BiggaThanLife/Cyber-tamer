  /* ---------------------------------------------------------
     WILDERNESS
  --------------------------------------------------------- */
  function renderWild(screenEl, controlsEl){
    const w = state.wild;
    const biome = layerBiomeDef(BIOMES[w.biomeIndex], w.layer||1);
    applyFog(w, biome);
    const cell = 26;
    // Camera-centered viewport: a fixed-size window always centered on the
    // player, rather than rendering the full map grid (which could be up to
    // 15x15 tiles — wider than a mobile screen, forcing a second horizontal
    // scrollbar alongside the page's own vertical one). Tiles outside the
    // map's bounds just render as empty space beyond the edge of the world.
    const VIEW_RADIUS = 4;
    const viewSize = VIEW_RADIUS*2 + 1;
    let grid = `<div style="display:grid; grid-template-columns:repeat(${viewSize},${cell}px); grid-template-rows:repeat(${viewSize},${cell}px); gap:1px; justify-content:center; margin:4px auto;">`;
    for(let vy=0; vy<viewSize; vy++){
      for(let vx=0; vx<viewSize; vx++){
        const x = w.px - VIEW_RADIUS + vx;
        const y = w.py - VIEW_RADIUS + vy;
        const inBounds = x>=0 && y>=0 && x<w.size && y<w.size;
        if(!inBounds){
          grid += `<div class="tile" style="background:#000;"></div>`;
          continue;
        }
        const c = w.grid[y][x];
        // Port Scanner: an un-opened Locked Node blips through the fog like a beacon, once owned
        // — nothing else about that tile's surroundings is revealed, just its own position.
        const visible = w.fog[y][x] || (c.role==='locked' && !c.opened && hasTool('portScanner'));
        let bg = '#04120b', glyph='', col='#0a2818';
        if(visible){
          if(c.role==='open'){ bg=biome.tiles.open.bg; glyph='·'; col=biome.tiles.open.col; }
          else if(c.role==='blockA'){ bg=biome.tiles.blockA.bg; glyph=biome.tiles.blockA.glyph; col=biome.tiles.blockA.col; }
          else if(c.role==='blockB'){ bg=biome.tiles.blockB.bg; glyph=biome.tiles.blockB.glyph; col=biome.tiles.blockB.col; }
          else if(c.role==='chest'){ bg='#1c1206'; glyph= c.opened?'▫':'▪'; col='#ffb347'; }
          else if(c.role==='gate'){ bg='#1a0c2a'; glyph='⛩'; col='#a06bff'; }
          else if(c.role==='boss'){ bg='#2a0a12'; glyph='☠'; col='#ff4d5e'; }
          else if(c.role==='shrine'){ bg='#2a220a'; glyph= c.opened?'✧':'✦'; col='#ffd93d'; }
          else if(c.role==='key'){ bg='#0a2a22'; glyph= c.opened?'⚬':'⚷'; col='#3ad6d1'; }
          else if(c.role==='vault'){ bg= c.opened?'#123722':'#2a0a12'; glyph= c.opened?'▢':'▣'; col= c.opened?'#4be37a':'#ff4d5e'; }
          else if(c.role==='anomaly'){ bg='#1a0c2a'; glyph= c.opened?'·':'✕'; col='#ff4d9e'; }
          else if(c.role==='hazard'){ const ht = biome.tiles.hazard || {bg:'#3a1005',glyph:'♨',col:'#ff9a3d'}; bg=ht.bg; glyph=ht.glyph; col=ht.col; }
          else if(c.role==='cache'){ bg='#0a2418'; glyph= c.opened?'·':'✪'; col='#7dffb0'; }
          else if(c.role==='locked'){ bg= c.opened?'#0a2418':'#1a1424'; glyph= c.opened?'·':'🧩'; col= c.opened?'#4be37a':'#c093ff'; }
          else if(c.role==='restricted'){ bg= c.opened?biome.tiles.open.bg:'#241010'; glyph= c.opened?'·':'⛔'; col= c.opened?biome.tiles.open.col:'#ff6b4a'; }
          else if(c.role==='barrier'){ const bt = TYPE_BARRIER_GLYPHS[c.reqType] || {glyph:'?',col:'#fff'}; bg= c.opened?biome.tiles.open.bg:'#181818'; glyph= c.opened?'·':bt.glyph; col= c.opened?biome.tiles.open.col:bt.col; }
          else if(c.role==='surge'){ bg='#241a05'; glyph='⚡'; col='#ffe14d'; }
        }
        const isPlayer = (vx===VIEW_RADIUS && vy===VIEW_RADIUS);
        grid += `<div class="tile"${isPlayer ? ' id="pl-tile"' : ''} style="background:${bg};color:${col};">${isPlayer ? '<span style="color:var(--phosphor);text-shadow:0 0 6px var(--phosphor);">◉</span>' : glyph}</div>`;
      }
    }
    grid += '</div>';
    const seedStr = String(w.seed);
    const isFav = state.savedSeeds.some(s => s.seed === w.seed && s.biomeIndex === w.biomeIndex);
    screenEl.innerHTML = `
      ${screenTitle(`${biome.name.toUpperCase()}${w.layer===2?' — LAYER 2':''} — FOG SECTOR`, biome.accentColor)}
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; font-size:9.5px; color:var(--ink-dim);">
        <span>Steps ${w.steps} · Ticks ${state.ticks||0}${!(w.layer===2?state.layer2Defeated:state.bossDefeated)[w.biomeIndex] ? ' · ☠' : ''}</span>
        <button class="btn" id="legend-toggle" style="padding:2px 6px; font-size:9px;">${wildLegendOpen?'▲ Hide':'❓ Legend'}</button>
      </div>
      ${w.layer===2 ? `<div style="font-size:9px; color:var(--crimson); margin-bottom:4px;">🌀 Layer 2 — remixed spawns, denser hazards, and a stronger boss.</div>` : ''}
      ${biome.mechanic ? `<div style="font-size:9px; color:${biome.accentColor}; margin-bottom:4px;">${biome.mechanic.split('.')[0]}.</div>` : ''}
      ${(biome.bossSignal || hasTool('packetTracer')) ? `<div style="font-size:10px; color:var(--violet); margin-bottom:4px;">${bossSignalText(w, biome)}</div>` : ''}
      ${w.daily && state.daily && !state.daily.sector.claimed ? `<div style="font-size:9.5px; color:#7dffb0; margin-bottom:4px;">✪ Daily Sector — find the cache for today's bonus.</div>` : ''}
      ${wildLegendOpen ? `<div style="font-size:9px; color:var(--ink-dim); margin-bottom:6px; background:rgba(255,255,255,.03); border-radius:6px; padding:4px 6px;">⛩ gate exits · ✦ shrine · ⚷ key / ▣ vault · ✕ anomaly · ☠ boss lurks nearby · ♨ heat vent · ✪ daily cache · 🧩 locked node (needs a Decrypter) · ⛔ restricted zone (needs a Firewall Breaker) · ⚡ power surge (Layer 2 only) · 🔥💧🪨🔋🍃🕳🔩👾 field barrier (needs a matching-type active partner)</div>` : ''}
      ${grid}
      <div style="display:flex; align-items:center; justify-content:center; gap:6px; margin-top:6px; font-size:9px; color:var(--ink-dim);">
        <span>Seed <span class="pixel-font" style="color:var(--phosphor);">${seedStr}</span></span>
        <button class="btn" id="copy-seed" style="padding:2px 6px; font-size:8.5px;">⧉</button>
        <button class="btn ${isFav?'btn-amber':''}" id="fav-seed" style="padding:2px 6px; font-size:8.5px;">${isFav?'★':'☆'}</button>
      </div>
      <div style="font-size:9.5px; color:var(--ink-dim); margin-top:6px; text-align:center;">${state.log[0] || ''}</div>
    `;
    const legendBtn = screenEl.querySelector('#legend-toggle');
    if(legendBtn) legendBtn.addEventListener('click', (ev)=>{ ev.stopPropagation(); wildLegendOpen = !wildLegendOpen; render(); });
    controlsEl.innerHTML = `
      <div class="wild-controls">
        <div class="dpad-grid dpad-sm">
          <div></div><button class="btn dpad-btn" id="mv-up">▲</button><div></div>
          <button class="btn dpad-btn" id="mv-left">◀</button>
          <div></div>
          <button class="btn dpad-btn" id="mv-right">▶</button>
          <div></div><button class="btn dpad-btn" id="mv-down">▼</button><div></div>
        </div>
        <button class="btn btn-crimson wild-exit" id="mv-exit">EXIT</button>
      </div>`;
    controlsEl.querySelector('#mv-up').addEventListener('click', ()=>moveWild(0,-1));
    controlsEl.querySelector('#mv-down').addEventListener('click', ()=>moveWild(0,1));
    controlsEl.querySelector('#mv-left').addEventListener('click', ()=>moveWild(-1,0));
    controlsEl.querySelector('#mv-right').addEventListener('click', ()=>moveWild(1,0));
    controlsEl.querySelector('#mv-exit').addEventListener('click', ()=>{ state.screen='town'; logMsg('Returned to Neon Haven.'); render(); });
    screenEl.querySelector('#copy-seed').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const seedStr = String(w.seed);
      const done = () => { logMsg('Seed copied to clipboard.'); render(); };
      const manualCopyFallback = () => showPromptModal('Copy this seed:', seedStr, ()=>{});
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(seedStr).then(done).catch(manualCopyFallback);
      } else {
        manualCopyFallback();
      }
    });
    screenEl.querySelector('#fav-seed').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      toggleFavoriteSeed(w.seed, w.biomeIndex);
    });
  }

  // Shared by anything that "spends time" in the world — wilderness steps
  // and mine digs/moves alike — so cooldowns and crop growth advance
  // consistently regardless of which activity you're doing.
  function advanceTick(){
    advanceTickCore();
    tickModules();
    if(state.farm && state.farm.boostTicks > 0) state.farm.boostTicks--;
  }
  function advanceTickCore(){
    state.ticks = (state.ticks||0) + 1;
    state.storage.forEach(mon => {
      if(mon.jobCooldown > 0) mon.jobCooldown--;
      if(mon.trainCooldown > 0) mon.trainCooldown--;
      if(mon.playCooldown > 0) mon.playCooldown--;
    });
    if(state.farm){
      state.farm.pods.forEach(pod => {
        if(pod.state === 'growing'){
          pod.growTicks++;
          if((state.farm.boostTicks||0) > 0) pod.growTicks++; // Pod Overclock: double speed
          if(state.origin === 'witness' && Math.random() < WITNESS_FARM_BONUS_CHANCE) pod.growTicks++; // The Witness: pods grow slightly faster
          const crop = CROPS[pod.cropId];
          if(crop && pod.growTicks >= crop.growTicks){
            pod.state = 'ready';
            pod.readyAtTick = state.ticks;
          }
        }
        // Ready pods no longer wither (v25.6) — a ripe crop waits indefinitely for you to get
        // back to it, so a long exploring trip never costs you a harvest. `witherTicks` on CROPS
        // and the 'withered' pod state are kept for old saves that already have a withered pod.
      });
    }
  }

  function moveWild(dx,dy){
    const w = state.wild;
    const biome = layerBiomeDef(BIOMES[w.biomeIndex], w.layer||1);
    const nx = w.px+dx, ny = w.py+dy;
    if(nx<0||ny<0||nx>=w.size||ny>=w.size) return;
    const cell = w.grid[ny][nx];
    if(!isPassableRole(cell.role)){
      const tileInfo = cell.role==='blockA' ? biome.tiles.blockA : biome.tiles.blockB;
      logMsg(`A ${tileInfo.name} blocks the way.`);
      fx({k:'bump'});
      render(); return;
    }
    if(cell.role === 'restricted' && !cell.opened){
      if(!hasTool('firewallBreaker')){
        logMsg('⛔ A Restricted Zone blocks the way — requires a Firewall Breaker to force through.');
        fx({k:'bump'});
        render(); return;
      }
      // Opens for good on the spot, then movement continues into the newly-cleared tile below.
      cell.opened = true;
      fx({k:'mapLoot'});
      const bits = 25 + w.biomeIndex*12;
      state.bits += bits;
      state.inventory.basicCapture++;
      logMsg(`🔨 Forced through the Restricted Zone: +◈${bits} Bits and 1 Basic Capture.exe. The path is clear for good.`);
    }
    if(cell.role === 'barrier' && !cell.opened){
      const req = cell.reqType;
      const activePartner = getActive();
      const activePartnerType = getForm(activePartner).type;
      if(activePartnerType !== req){
        const bt = TYPE_BARRIER_GLYPHS[req];
        logMsg(`${bt ? bt.glyph : '⚠'} A ${req} Field Barrier blocks the way — your active partner needs to be ${req} type to cross.`);
        fx({k:'bump'});
        render(); return;
      }
      cell.opened = true;
      fx({k:'mapLoot'});
      const bits = 25 + w.biomeIndex*12;
      state.bits += bits;
      state.inventory.basicCapture++;
      logMsg(`${TYPE_BARRIER_GLYPHS[req].glyph} ${getForm(activePartner).name} clears the ${req} Field Barrier: +◈${bits} Bits and 1 Basic Capture.exe. The path is clear for good.`);
    }

    w.px = nx; w.py = ny; w.steps++;
    applyFog(w, biome);
    questEvent('step', 1);

    advanceTick();

    const p = getActive();
    const adaptiveMult = (personalityDef(p) && personalityDef(p).hungerEnergyMult) || 1;
    p.hunger = Math.max(0, p.hunger - (hasModule(p,'nutrientCell') ? 1 : 2) * adaptiveMult);
    p.energy = Math.max(0, p.energy - 1 * adaptiveMult);
    gainXp(p, 1);

    if(cell.role === 'chest' && !cell.opened){
      cell.opened = true;
      fx({k:'mapLoot'});
      questEvent('chest', 1);
      const roll = Math.random();
      if(roll < 0.5){ const bits = scavengerBitsBoost(10+w.biomeIndex*8+Math.floor(Math.random()*30)); state.bits += bits; logMsg(`Found a chest with ◈${bits} Bits!`); }
      else { state.inventory.basicCapture++; logMsg('Found a chest with a Basic Capture.exe run!'); }
      render(); return;
    }
    if(cell.role === 'shrine' && !cell.opened){
      cell.opened = true;
      fx({k:'mapLoot'});
      const bits = 20 + w.biomeIndex*10;
      state.bits += bits;
      gainXp(p, 8);
      logMsg(`A quiet shrine hums with old code. You feel steadier. +◈${bits} Bits and a flicker of insight.`);
      render(); return;
    }
    if(cell.role === 'key' && !cell.opened){
      cell.opened = true;
      fx({k:'mapLoot'});
      w.hasKey = true;
      logMsg('Found a rusted key. Something nearby must be locked...');
      render(); return;
    }
    if(cell.role === 'vault'){
      if(cell.opened){ render(); return; }
      if(!w.hasKey){ logMsg('A sealed vault. It looks like it needs a key.'); render(); return; }
      cell.opened = true;
      fx({k:'mapLoot'});
      questEvent('chest', 1);
      const bits = 40 + w.biomeIndex*15;
      state.bits += bits;
      state.inventory.basicCapture += 2;
      logMsg(`The key fits! The vault opens: +◈${bits} Bits and 2 Basic Capture.exe runs!`);
      render(); return;
    }
    if(cell.role === 'anomaly' && !cell.opened){
      cell.opened = true;
      startAnomalyEncounter(w.biomeIndex, w.seed, nx, ny, w.layer||1);
      return;
    }
    if(cell.role === 'gate'){
      state.screen='town'; logMsg('Returned to Neon Haven.'); render(); return;
    }
    if(cell.role === 'boss'){
      startBossEncounter(w.biomeIndex, w.layer||1);
      return;
    }
    if(cell.role === 'cache' && !cell.opened){
      cell.opened = true;
      fx({k:'mapLoot'});
      claimDailyCache(w);
      render(); return;
    }
    if(cell.role === 'locked' && !cell.opened){
      if(!hasTool('decrypter')){
        logMsg('🧩 Locked data node — requires a Decrypter to access. Pick one up in the Shop and come back.');
        render(); return;
      }
      state.breach = generateBreachBoard(w.biomeIndex, nx, ny);
      breachSelected = null;
      state.screen = 'breach';
      render(); return;
    }
    if(cell.role === 'hazard' && biome.hazard){
      fx({k:'hazard'});
      const mult = biome.hazard.typeMult[getForm(p).type];
      const m = (mult === undefined) ? 1 : mult;
      if(m === 0){ logMsg(`${getForm(p).name} strides through the ${biome.tiles.hazard.name} untouched — Fire types are immune.`); }
      else {
        const dmg = Math.max(1, Math.round(p.maxHp * biome.hazard.dmgPct * m));
        const dealt = Math.min(dmg, Math.max(0, p.hp - 1)); // vents never faint you
        p.hp -= dealt;
        logMsg(`A ${biome.tiles.hazard.name} scorches ${getForm(p).name} for ${dealt} damage${m<1?' (resisted)':(m>1?' (vulnerable!)':'')}. HP ${p.hp}/${p.maxHp}.`);
      }
      render(); return;
    }
    if(cell.role === 'surge'){
      fx({k:'hazard'});
      const dmg = Math.max(1, Math.round(p.maxHp * 0.09));
      const dealt = Math.min(dmg, Math.max(0, p.hp - 1)); // surges never faint you
      p.hp -= dealt;
      logMsg(`⚡ A power surge arcs through the grid, hitting ${getForm(p).name} for ${dealt} damage. HP ${p.hp}/${p.maxHp}.`);
      render(); return;
    }
    if(p.hunger <= 0){
      const pname = getForm(p).name;
      logMsg(`${pname} is starving and too weak to explore further! You head back to Neon Haven.`);
      state.screen='town'; render();
      showAlertModal(`<span style="color:var(--crimson);">⚠ Out of Hunger</span><br><br>${pname} was too weak to keep exploring and you're back in Neon Haven. Feed them a Databite (or another food item) from the Inventory before heading out again.`);
      return;
    }
    if(cell.role === 'open' && Math.random() < encounterChance(p)){
      if(state.wanted.length && Math.random() < 0.15){
        startWantedEncounter(state.wanted[Math.floor(Math.random()*state.wanted.length)]);
      } else {
        startEncounter();
      }
      return;
    }
    render();
  }

  function startEncounter(){
    const w = state.wild;
    const biome = layerBiomeDef(BIOMES[w.biomeIndex], w.layer||1);
    const pool = encounterPool(biome, w.layer||1);
    const lineId = pool[Math.floor(Math.random()*pool.length)];
    const p = getActive();
    const lvl = Math.max(1, p.level + biomeLevelOffset(biome, w.biomeIndex) + Math.floor(Math.random()*3) - 1);
    const enemy = newMonster(lineId, 1, lvl);
    const enemyName = getForm(enemy).name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playScanTransition(`A wild<br>${enemyName}<br>appeared!`, 'var(--crimson)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`A wild ${enemyName} appeared!`);
      render();
    });
  }

  function startWantedEncounter(entry){
    const enemy = newMonster(entry.speciesId, entry.gen, entry.level, entry.ivs);
    enemy.stage = Math.min(entry.stage, EVOLUTION_LINES[entry.speciesId].length);
    enemy.marked = !!entry.marked; // preserve the original individual's marked status
    if(entry.personality && PERSONALITIES[entry.personality]) enemy.personality = entry.personality;
    recalcStats(enemy, true);
    updateMoveUnlocks(enemy);
    enemy.isWanted = true;
    enemy.wantedEntryId = entry.id;
    enemy.nickname = entry.name;
    const enemyName = entry.name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playScanTransition(`🎯 It's back!<br>${enemyName}<br>the one that got away!`, 'var(--amber)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`${enemyName} reappears — this could be your chance!`);
      render();
    });
  }

  function startAnomalyEncounter(biomeIndex, mapSeed, x, y, layer){
    const biome = layerBiomeDef(BIOMES[biomeIndex], layer||1);
    const rng = anomalySeedRng(mapSeed, x, y, layer||1);
    const pool = anomalyPool(biome);
    const lineId = pool[Math.floor(rng()*pool.length)];
    const ivs = {
      hp:  IV_MIN + rng()*(IV_MAX-IV_MIN),
      str: IV_MIN + rng()*(IV_MAX-IV_MIN),
      def: IV_MIN + rng()*(IV_MAX-IV_MIN),
      spd: IV_MIN + rng()*(IV_MAX-IV_MIN),
    };
    const marked = rng() < MARKED_CHANCE;
    const personality = rollPersonality(rng); // appended after marked — never reorders the existing draws
    const p = getActive();
    const lvl = Math.max(1, p.level + biomeLevelOffset(biome, biomeIndex) + 2 + Math.floor(Math.random()*3)); // difficulty, not identity — stays unseeded
    const enemy = newMonster(lineId, 1, lvl, ivs);
    enemy.marked = marked;
    enemy.personality = personality;
    recalcStats(enemy, true); // personality was rolled after newMonster's own internal roll — recompute before the anomaly buffs below
    enemy.maxHp = Math.round(enemy.maxHp*1.25); enemy.hp = enemy.maxHp;
    enemy.str = Math.round(enemy.str*1.2);
    enemy.def = Math.round(enemy.def*1.2);
    enemy.spd = Math.round(enemy.spd*1.2);
    enemy.isAnomaly = true;
    const enemyName = getForm(enemy).name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playScanTransition(`⚠ Anomaly detected!<br>A charged ${enemyName}<br>flickers into view!`, 'var(--violet)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`A charged ${enemyName} flickers into view — this one looks tougher, but worth it! This exact spot on this seed will always hold this encounter.`);
      render();
    });
  }

  // Levels for wild spawns are relative to your active partner. Older biomes use idx*2;
  // newer ones set levelOffset explicitly. Late bosses also scale off the partner.
  function biomeLevelOffset(biome, idx){ return biome.levelOffset != null ? biome.levelOffset : idx*2; }
  function createBoss(biome){
    let bossLvl = biome.bossLevel;
    if(biome.bossLevelOffset != null){ const ap = getActive(); if(ap) bossLvl = Math.max(bossLvl, ap.level + biome.bossLevelOffset); }
    const boss = newMonster(biome.bossSpecies, 2, bossLvl);
    boss.stage = Math.min(2, EVOLUTION_LINES[biome.bossSpecies].length);
    recalcStats(boss, true);
    boss.maxHp = Math.round(boss.maxHp * biome.bossMult);
    boss.str   = Math.round(boss.str   * biome.bossMult);
    boss.def   = Math.round(boss.def   * biome.bossMult);
    boss.spd   = Math.round(boss.spd   * biome.bossMult);
    boss.hp = boss.maxHp;
    updateMoveUnlocks(boss);
    boss.isBoss = true;
    boss.bossTitle = biome.bossTitle;
    boss.marked = false; // bosses are already unique — no marked variant
    return boss;
  }

  function startBossEncounter(biomeIndex, layer){
    const biome = layerBiomeDef(BIOMES[biomeIndex], layer||1);
    const boss = createBoss(biome);
    dexMarkSeen(boss.speciesId, boss.stage);
    playTransition(`⚠<br>${boss.bossTitle}<br>rises to block your path!`, 'var(--crimson)', ()=>{
      state.battle = { enemy: boss, over:false, isBoss:true, biomeIndex, layer: layer||1, bossVictory:false, catchAttempted:false, source:'wild' };
      state.screen = 'battle';
      logMsg(`⚠ ${boss.bossTitle} rises to block your path!`);
      render();
    }, 850);
  }

  /* ---------------------------------------------------------
     BATTLE
  --------------------------------------------------------- */
  function renderBattle(screenEl, controlsEl){
    const b = state.battle;
    const p = getActive();
    const psp = getForm(p);
    const esp = getForm(b.enemy);
    const sameBattle = battleHpMemo.b === b;
    const hpFrom = (motionOn() && sameBattle) ? { e: battleHpMemo.e, p: battleHpMemo.p } : { e: b.enemy.hp, p: p.hp };
    const bar = (val,max,color,from) => `<div class="barwrap"><div class="barfill hpslide" data-to="${100*val/max}" style="width:${100*Math.min(from,max)/max}%;background:${color}"></div></div>`;
    battleHpMemo = { b, e: b.enemy.hp, p: p.hp };
    if(!Array.isArray(b.log)) b.log = state.log.slice(0,1);
    const battleLines = b.log;

    screenEl.innerHTML = `
      ${screenTitle(b.isBoss ? '⚠ BOSS ENCOUNTER' : (b.enemy.isWanted ? '🎯 WANTED ENCOUNTER' : (b.enemy.isAnomaly ? '⚠ ANOMALY ENCOUNTER' : '⚔ ENCOUNTER')), b.enemy.isWanted ? 'var(--amber)' : (b.enemy.isAnomaly && !b.isBoss ? 'var(--violet)' : 'var(--crimson)'))}
      ${b.isBoss ? `<div class="card" style="border-color:var(--crimson); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--crimson);">${b.enemy.bossTitle}</div>` : ''}
      ${(!b.isBoss && b.enemy.isWanted) ? `<div class="card" style="border-color:var(--amber); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--amber);">The one that got away — easier to bring in this time.</div>` : ''}
      ${(!b.isBoss && !b.enemy.isWanted && b.enemy.isAnomaly) ? `<div class="card" style="border-color:var(--violet); margin-bottom:8px; text-align:center; font-size:10.5px; color:var(--violet);">A charged, unstable reading — tougher, but worth chasing.</div>` : ''}
      <div style="display:flex; justify-content:space-between; gap:10px;">
        <div class="card" id="bt-enemy" style="flex:1; text-align:center;">
          ${spriteImgHtml(b.enemy, b.isBoss?60:48, 'mon-bob')}
          <div style="color:${esp.color}; margin-top:4px;">${esp.name} <span class="badge">Lv${b.enemy.level}</span>${b.enemy.marked?' <span class="badge" style="color:#fff44d;border-color:#fff44d;">✦</span>':''}</div>
          <div style="font-size:9.5px; color:var(--ink-dim); margin-top:4px;">HP ${b.enemy.hp}/${b.enemy.maxHp}</div>
          ${bar(b.enemy.hp,b.enemy.maxHp,'var(--crimson)',hpFrom.e)}
        </div>
        <div class="card" id="bt-player" style="flex:1; text-align:center;">
          ${spriteImgHtml(p, 48, 'mon-bob')}
          <div style="color:${psp.color}; margin-top:4px;">${p.nickname||psp.name} <span class="badge">Lv${p.level}</span>${p.marked?' <span class="badge" style="color:#fff44d;border-color:#fff44d;">✦</span>':''}</div>
          <div style="font-size:9.5px; color:var(--ink-dim); margin-top:4px;">HP ${p.hp}/${p.maxHp}</div>
          ${bar(p.hp,p.maxHp,'var(--phosphor)',hpFrom.p)}
        </div>
      </div>
      <div id="battle-log" style="margin-top:10px; font-size:10.5px; line-height:1.4; color:var(--ink-dim); height:${b.isBoss?100:130}px; overflow-y:auto; background:rgba(255,255,255,.03); border-radius:6px; padding:5px 8px;">${battleLines.map((l,i)=>`<div style="${i===battleLines.length-1?'color:var(--ink);':'opacity:.75;'}">${i===battleLines.length-1?'▸ ':'· '}${l}</div>`).join('')}</div>
      ${(!b.over && b.enemy.marked && !b.enemy.isWanted) ? `<div style="font-size:10px;color:#fff44d;margin-top:2px;">✦ This one is Marked — extremely rare!</div>` : ''}
      ${(!b.over && !b.isBoss) ? `<div style="font-size:9.5px;color:var(--amber);margin-top:6px;">Acquisition odds rise as ${escapeHtml(getForm(b.enemy).name)}'s HP drops.</div>` : ''}
      ${(!b.over && b.isBoss) ? `<div style="font-size:10px;color:var(--crimson);margin-top:6px;">This foe cannot be captured — it must be defeated.</div>` : ''}
    `;

    const blog = screenEl.querySelector('#battle-log');
    if(blog) blog.scrollTop = blog.scrollHeight;
    setTimeout(() => {
      screenEl.querySelectorAll('.barfill[data-to]').forEach(el => { el.style.width = el.getAttribute('data-to') + '%'; });
    }, 40);

    if(b.over){
      if(b.offerWanted){
        controlsEl.innerHTML = `
          <div style="font-size:10.5px; color:var(--ink-dim); text-align:center; margin-bottom:8px;">It got away! Add ${getForm(b.enemy).name} (Lv${b.enemy.level}, Potential ${potentialStars(b.enemy.ivs)}) to your Wanted Board? You'll have a real edge catching this exact one if it turns up again.</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <button class="btn btn-amber" id="wanted-yes">📋 Add to Wanted</button>
            <button class="btn" id="wanted-no">Let it go</button>
          </div>`;
        const finishEscape = () => {
          b.offerWanted = false;
          const wasBossVictory = b.bossVictory;
          state.firstBattleDone = true;
          state.battle = null;
          state.screen = wasBossVictory ? 'town' : (b.source === 'mine' ? (state.mine ? 'mine' : 'town') : (state.wild ? 'wild' : 'town'));
          if(wasBossVictory) state.wild = null;
          render();
        };
        controlsEl.querySelector('#wanted-yes').addEventListener('click', ()=>{ addToWanted(b.enemy); finishEscape(); });
        controlsEl.querySelector('#wanted-no').addEventListener('click', finishEscape);
        return;
      }
      controlsEl.innerHTML = `<button class="btn btn-primary" id="continue" style="width:100%;">Continue</button>`;
      controlsEl.querySelector('#continue').addEventListener('click', ()=>{
        const wasBossVictory = b.bossVictory;
        state.firstBattleDone = true;
        state.battle = null;
        state.screen = wasBossVictory ? 'town' : (b.source === 'mine' ? (state.mine ? 'mine' : 'town') : (state.wild ? 'wild' : 'town'));
        if(wasBossVictory) state.wild = null;
        render();
      });
      return;
    }

    const moveBtns = getBattleMoves(p).map(mid => {
      const mv = MOVES[mid];
      const mult = mv.type ? typeMultiplier(mv.type, esp.type) : 1;
      const hint = mult>1 ? '<span style="color:var(--phosphor);">▲</span>' : (mult<1 ? '<span style="color:var(--crimson);">▼</span>' : '');
      return `<button class="btn btn-crimson" data-move="${mid}" title="${mv.desc}">⚔ ${mv.name}${mv.type?` <span style="font-size:8px;opacity:.7;">[${mv.type}]</span>`:''} ${hint}</button>`;
    }).join('');

    controlsEl.innerHTML = `
      <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">MOVES</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        ${moveBtns}
      </div>
      <div style="border-top:1px solid var(--glass-border); margin:10px 0 8px; padding-top:8px;">
        <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">ACTIONS</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${b.isBoss ? '' : captureButtonsHtml(b.enemy)}
          <button class="btn btn-amber" id="act-medicine" ${(state.inventory.medicine<=0 || p.hp>=p.maxHp)?'disabled':''}>🩹 Use Medicine (x${state.inventory.medicine})</button>
          ${['nanoPatch','overloadChip','firewallChip'].filter(id => (state.inventory[id]||0) > 0).map(id => `<button class="btn btn-violet" data-item="${id}" ${(id==='nanoPatch' && p.hp>=p.maxHp)?'disabled':''}>${SUPPLY_ITEMS[id].icon} ${SUPPLY_ITEMS[id].name} (x${state.inventory[id]})</button>`).join('')}
          <button class="btn" id="act-flee">🏃 Flee</button>
        </div>
      </div>`;
    controlsEl.querySelectorAll('[data-move]').forEach(btn=>{
      btn.addEventListener('click', ()=>battleAction('move', btn.getAttribute('data-move')));
    });
    controlsEl.querySelectorAll('[data-capture]').forEach(btn=>{
      btn.addEventListener('click', ()=>attemptCapture(btn.getAttribute('data-capture')));
    });
    controlsEl.querySelectorAll('[data-item]').forEach(btn => btn.addEventListener('click', ()=>battleAction('item', btn.getAttribute('data-item'))));
    const medBtn = controlsEl.querySelector('#act-medicine');
    if(medBtn) medBtn.addEventListener('click', ()=>battleAction('medicine'));
    controlsEl.querySelector('#act-flee').addEventListener('click', ()=>battleAction('flee'));
  }

  function estimateCatchChance(enemy, programId){
    const hpFrac = enemy.hp / enemy.maxHp;
    let chance = 0.05 + Math.pow(1 - hpFrac, 2) * 0.9;
    const program = programId && CAPTURE_PROGRAMS[programId];
    if(program) chance *= program.mult;
    if(enemy.isAnomaly) chance += 0.15;
    if(enemy.isWanted) chance += 0.20;
    if(enemy.isWanted && state.origin === 'keeper') chance += KEEPER_WANTED_CATCH_BONUS; // The Keeper: re-encounters are a little easier
    const ap = getActive();
    if(ap && hasModule(ap,'trapAssist')) chance *= 1.25;
    return Math.max(0.05, Math.min(0.95, chance));
  }

  function captureButtonsHtml(enemy){
    const owned = CAPTURE_PROGRAM_IDS.filter(id => (state.inventory[id]||0) > 0);
    if(!owned.length){
      return `<div style="font-size:9.5px; color:var(--ink-dim); text-align:center; padding:4px 0;">No capture programs installed — visit the Shop.</div>`;
    }
    return owned.map(id => {
      const program = CAPTURE_PROGRAMS[id];
      const chance = Math.round(estimateCatchChance(enemy, id) * 100);
      return `<button class="btn btn-cyan" data-capture="${id}">${program.icon} ${program.name} — ${chance}% <span style="opacity:.7;">(x${state.inventory[id]})</span></button>`;
    }).join('');
  }

  // Runs a capture program on the current wild encounter. The outcome is decided up front so the
  // CAPTURE.EXE overlay can animate toward the real result rather than a random-looking number;
  // game state (inventory, storage, Bits, XP) is only applied once the overlay finishes.
  function attemptCapture(programId){
    const b = state.battle;
    if(!b || b.over) return;
    if(b.isBoss){ logMsg('This foe cannot be captured — it must be defeated.'); render(); return; }
    const program = CAPTURE_PROGRAMS[programId];
    const owned = (state.inventory[programId]||0);
    if(!program || owned <= 0){ logMsg('That capture program is not installed.'); render(); return; }
    const enemy = b.enemy;
    const enemyName = getForm(enemy).name;
    const chance = estimateCatchChance(enemy, programId);
    const success = Math.random() < chance;
    state.inventory[programId] = owned - 1;
    b.catchAttempted = true;
    const finish = () => resolveCapture(b, enemy, program, success);
    if(motionOn()) playCapture(program.name, enemyName, success, finish);
    else finish();
    render();
  }
  function resolveCapture(b, enemy, program, success){
    if(state.battle !== b || b.over) return;
    if(success){
      const caught = { ...enemy };
      caught.uid = 'm' + Math.random().toString(36).slice(2,10);
      caught.hp = caught.maxHp; caught.hunger=100; caught.energy=100;
      delete caught.isAnomaly;
      const wasWanted = caught.isWanted;
      const wantedId = caught.wantedEntryId;
      delete caught.isWanted; delete caught.wantedEntryId;
      state.storage.push(caught);
      dexMarkCaught(caught);
      questEvent('catch', 1, { type: getForm(caught).type });
      if(wasWanted) state.wanted = state.wanted.filter(w=>w.id!==wantedId);
      const bits = bitsBoost(Math.round((10 + enemy.level*4) * (enemy.isAnomaly ? 1.8 : 1)));
      state.bits += bits;
      fx({k:'caught'});
      logMsg((enemy.marked ? '✦ MARKED! ' : '') + (wasWanted ? `${program.name} re-linked ${getForm(enemy).name} — the one that got away! +${bits} Bits.` : `${program.name} complete — ${getForm(enemy).name} added to your Network Registry! +${bits} Bits.`));
      gainXp(getActive(), Math.round((6 + enemy.level*3) * (enemy.isAnomaly ? 1.5 : 1)));
      fireAuditorStage(1); // "After first capture (Outskirts)" — a no-op after the first real capture
      b.over = true; render(); return;
    }
    fx({k:'escape'});
    logMsg(`${program.name} failed — the connection was severed.`);
    enemyTurn();
    render();
  }

  function markBattleOver(b){
    b.over = true;
    if(b.catchAttempted && !b.enemy.isWanted && !b.isBoss){
      b.offerWanted = true;
    }
  }

  function battleAction(action, moveId){
    const b = state.battle;
    const p = getActive();
    if(b.over) return;

    if(action === 'flee'){
      if(Math.random() < fleeChance(p, b.enemy)){ logMsg('You escaped safely.'); markBattleOver(b); }
      else { logMsg('Could not escape!'); enemyTurn(); }
      render(); return;
    }

    if(action === 'move'){
      const mv = MOVES[moveId];
      if(!mv){ console.error('Unknown move id:', moveId); render(); return; }
      const mult = typeMultiplier(mv.type, getForm(b.enemy).type);
      // Resonance Matrix-style gear: bonus damage when the move's type matches the partner's own
      // type (typeless universal moves have no `mv.type`, so they never qualify).
      const stabMult = (mv.type && mv.type === getForm(p).type) ? (1 + gearStabBonus(p)) : 1;
      const dmg = Math.max(1, Math.round(p.str * mv.power * mult * stabMult * (1 + Math.random()*0.25) - b.enemy.def*0.5));
      b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
      fx({k:'hit', on:'enemy', dmg, mult});
      logMsg(`${mv.name} hit for ${dmg} damage.${mult>1 ? ' Super effective!' : (mult<1 ? ' Not very effective...' : '')}`);
    }
    else if(action === 'medicine'){
      if(state.inventory.medicine <= 0){ logMsg('No Medicine left — visit the shop.'); render(); return; }
      if(p.hp >= p.maxHp){ logMsg(`${getForm(p).name} is already at full HP.`); render(); return; }
      state.inventory.medicine--;
      fx({k:'heal', amt:p.maxHp - p.hp});
      p.hp = p.maxHp;
      logMsg(`Used Medicine — ${getForm(p).name}'s HP fully restored.`);
    }
    else if(action === 'item'){
      const id = moveId, inv = state.inventory;
      if((inv[id]||0) <= 0){ logMsg('You are out of that item.'); render(); return; }
      if(id === 'nanoPatch'){
        if(p.hp >= p.maxHp){ logMsg(`${getForm(p).name} is already at full HP.`); render(); return; }
        inv.nanoPatch--;
        const heal = Math.max(1, Math.round(p.maxHp * 0.30));
        fx({k:'heal', amt:Math.min(heal, p.maxHp - p.hp)});
        p.hp = Math.min(p.maxHp, p.hp + heal);
        logMsg(`Nano Patch restored ${heal} HP.`);
      } else if(id === 'overloadChip'){
        inv.overloadChip--;
        const dmg = Math.max(1, Math.round(p.str * 2.2 * (1 + Math.random()*0.25) - b.enemy.def*0.5));
        b.enemy.hp = Math.max(0, b.enemy.hp - dmg);
        fx({k:'hit', on:'enemy', dmg, mult:1, big:true});
        logMsg(`Overload Chip discharged for ${dmg} damage!`);
      } else if(id === 'firewallChip'){
        inv.firewallChip--;
        b.shield = true;
        fx({k:'shield'});
        logMsg('A Firewall flares up around your partner.');
      } else { render(); return; }
    }

    if(b.enemy.hp <= 0){
      if(b.isBoss){
        const isL2 = b.layer === 2;
        const bits = bitsBoost((isL2 ? 260 : 150) + b.biomeIndex*80);
        state.bits += bits;
        gainXp(p, (isL2 ? 140 : 80) + b.enemy.level*8);
        questEvent('win', 1, { type: getForm(b.enemy).type });
        raiseTrace(15, false); // boss defeats are never reduced by Insider's Clean Logs
        let unlockMsg = '';
        if(isL2){
          state.layer2Defeated[b.biomeIndex] = true;
        } else {
          state.bossDefeated[b.biomeIndex] = true;
          checkBiomeUnlocks(); // may itself log a separate "path has opened" line if this was the last condition
          const nextIdx = b.biomeIndex + 1;
          if(nextIdx < BIOMES.length && state.unlockedBiomeIndex <= b.biomeIndex){
            const st = biomeUnlockStatus(b.biomeIndex);
            const remaining = [];
            if(!st.recycle){ const left = RECYCLE_QUOTA - st.recycled; remaining.push(`Recycle ${left} more ${st.type}-type monster${left===1?'':'s'}`); }
            if(!st.key) remaining.push('find the Network Access Key in a Data Breach here');
            if(remaining.length) unlockMsg = ` To open the path to ${BIOMES[nextIdx].name}: ${remaining.join(', and ')}.`;
          }
        }
        fx({k:'faint'});
        logMsg(`${b.enemy.bossTitle} was defeated! +◈${bits} Bits.${unlockMsg}`);
        b.over = true; b.bossVictory = true; render(); return;
      }
      const bits = bitsBoost(Math.round((8 + b.enemy.level*3) * (b.enemy.isAnomaly ? 1.8 : 1)));
      state.bits += bits;
      fx({k:'faint'});
      logMsg(`${getForm(b.enemy).name} was defeated! +${bits} Bits.`);
      questEvent('win', 1, { type: getForm(b.enemy).type });
      gainXp(p, Math.round((12 + b.enemy.level*6) * (b.enemy.isAnomaly ? 1.5 : 1)));
      markBattleOver(b); render(); return;
    }
    enemyTurn();
    render();
  }

  // SPD's combat role: a faster partner is more likely to slip an incoming
  // counterattack entirely, and more likely to successfully flee. Kept modest
  // (3%-35%) so it's a real edge rather than a coinflip that overrides HP/DEF.
  function dodgeChance(defenderSpd, attackerSpd, defenderMon){
    const ratio = defenderSpd / Math.max(1, attackerSpd);
    let bonus = (defenderMon && personalityDef(defenderMon) && personalityDef(defenderMon).dodgeBonus) || 0;
    if(defenderMon) bonus += gearDodgeBonus(defenderMon);
    return Math.max(0.03, Math.min(0.35, 0.12 * ratio + bonus));
  }
  function fleeChance(p, enemy){
    const ratio = p.spd / Math.max(1, enemy.spd);
    const bonus = ((personalityDef(p) && personalityDef(p).fleeBonus) || 0) + gearFleeBonus(p);
    return Math.max(0.2, Math.min(0.9, 0.5 + (ratio-1)*0.25 + bonus));
  }

  function enemyTurn(){
    const b = state.battle;
    const p = getActive();
    if(b.over) return;
    if(b.shield){ b.shield = false; fx({k:'shield'}); logMsg('The Firewall absorbed the enemy\'s attack!'); return; }
    if(Math.random() < dodgeChance(p.spd, b.enemy.spd, p)){
      fx({k:'dodge'});
      logMsg(`${getForm(p).name} dodged the incoming strike!`);
      return;
    }
    const mult = typeMultiplier(getForm(b.enemy).type, getForm(p).type);
    // Type Ward gear reduces damage taken from a matching-type hit; Last Bastion-style gear spikes
    // effective DEF while HP is below its threshold — both computed fresh here (never stored on
    // p.def itself) since they depend on the attack/HP state at this exact moment.
    const resistMult = gearResistMult(p, getForm(b.enemy).type);
    const effectiveDef = p.def * gearHpThresholdDefMult(p);
    let dmg = Math.max(1, Math.round(b.enemy.str * mult * resistMult * (1+Math.random()*0.3) - effectiveDef*0.5));
    if(p.hp - dmg <= 0 && hasModule(p,'lastStand')){
      dmg = Math.max(0, p.hp - 1);
      consumeModule(p);
      logMsg(`${getForm(p).name}'s Safety Buffer absorbed the killing blow!`);
    }
    p.hp = Math.max(0, p.hp - dmg);
    fx({k:'hit', on:'player', dmg, mult});
    logMsg(`${getForm(b.enemy).name} struck back for ${dmg} damage.${mult>1 ? ' Super effective!' : (mult<1 ? ' Not very effective...' : '')}`);
    if(p.hp <= 0){
      // Faint penalty: lose a slice of progress toward the next level. This only ever touches
      // m.xp (which is already just progress within the CURRENT level — gainXpCore subtracts
      // xpToNext on every level-up), so it can reduce how close you are to leveling but can
      // never drop a level you've already earned.
      const xpLost = Math.round(p.xp * 0.1);
      p.xp = Math.max(0, p.xp - xpLost);
      logMsg(`${getForm(p).name} fainted! You retreat to Neon Haven.${xpLost > 0 ? ` Lost ${xpLost} XP.` : ''}`);
      p.hp = Math.max(1, Math.round(p.maxHp*0.2));
      state.screen = 'town'; state.wild = null;
      if(b.source === 'mine') state.mine = null;
      markBattleOver(b);
      state.firstBattleDone = true;
    }
  }

  /* ---------------------------------------------------------
     STORY LAYER — Cyber Tamer story bible. Content lives in data tables like this one, not
     hard-coded in logic; the story layer only ever READS existing mechanical state (bossDefeated,
     recycleCounts, biomeKeyFound) and never shadows it with duplicate flags. It must never alter
     combat/economy/progression math except the three explicit PvE perks below.
     --------------------------------------------------------- */
  const ORIGINS = {
    witness:   { id:'witness',   name:'The Witness',   story:'Watched a data center drain their hometown.',
      seesProblemsAs:'Someone did this, and can be held accountable.',
      perkText:'Server Farm pods grow slightly faster.',
      bootLine:'You know what a dry well sounds like.' },
    insider:   { id:'insider',   name:'The Insider',   story:'Ex data center technician who quit.',
      seesProblemsAs:'Systems with weak points.',
      perkText:'Clean Logs — Trace gains from things you trigger are reduced about 15%.',
      bootLine:'You know exactly what you\'re looking at.' },
    scavenger: { id:'scavenger', name:'The Scavenger', story:'Stripped abandoned sites to survive.',
      seesProblemsAs:'Things to use, sell, or survive.',
      perkText:'A small Bits bonus from chests and Job Board payouts.',
      bootLine:'One more site. One more score.' },
    keeper:    { id:'keeper',    name:'The Keeper',    story:'Preserved dying servers and data.',
      seesProblemsAs:'Something is being lost, and someone must remember.',
      perkText:'Wanted Board re-encounters have slightly better capture odds.',
      bootLine:'Somebody has to remember this place.' },
  };
  const ORIGIN_IDS = Object.keys(ORIGINS);
  // Perk magnitudes — deliberately modest ("slightly"/"a small bonus" per the story bible).
  const WITNESS_FARM_BONUS_CHANCE = 0.20; // ~20% chance of an extra grow-tick per tick, ≈20% faster on average
  const KEEPER_WANTED_CATCH_BONUS = 0.05; // +5 percentage points on top of the existing +20% Wanted bonus
  const INSIDER_TRACE_MULT = 0.85;        // Clean Logs: ~15% less Trace from player-triggered sources (wired when Trace exists)

  /* ---------------------------------------------------------
     TRACE + AUDITOR NOTICES — Phase 2. One global 0-100 value (state.trace) with a floor
     (state.trace_floor) that only ever rises, per the bible's "OPEN" numeric weights: boss
     defeat +15 (not reduced by Insider — the bible's reduced-source list is Data Breaches,
     recycling and Layer 2 entries only, never boss defeats), Data Breach solved +5, Layer 2
     entry +8, recycling +2. No decay, no fail state at 100 — "story flavor only" per the bible,
     so trace is a number the player can see (System menu) and Auditor notices react to, nothing
     more. auditor_stage (0-5) and trace_floor both advance together off the SAME event —
     checkBiomeUnlocks() flipping unlockedBiomeIndex — since "leaving biome i" and "entering
     biome i+1" are the same transition; entering the final biome (Ghost Server) still raises
     the floor but fires no notice ("Quiet: Auditor notices stop" per the bible). Stage 1 is the
     one exception, firing after the player's first-ever capture rather than a biome transition.
  --------------------------------------------------------- */
  const AUDITOR_REF = 'Ref. 7741-A';
  const BIOME_TRACE_FLOORS = [5, 15, 25, 40, 55]; // index i = floor set when biome i is cleared (entering biome i+1)
  function auditorNoticeText(stage){
    switch(stage){
      case 1: return `An access event of unknown origin has been recorded. Standard verification procedures have been initiated. No action required at this time. ${AUDITOR_REF}`;
      case 2: return `An unregistered connection has been observed. No action required at this time. ${AUDITOR_REF}`;
      case 3: return `The connection persists. A review has been opened. ${AUDITOR_REF}`;
      case 4: return `Activity has been attributed to a single origin. Remediation is scheduled. ${AUDITOR_REF}`;
      case 5: return `${state.handle || 'Unknown'}. Your port has been located. This notice is a courtesy. ${AUDITOR_REF}`;
      default: return null;
    }
  }
  function raiseTrace(amount, playerTriggered){
    if(!state) return;
    let amt = amount;
    if(playerTriggered && state.origin === 'insider') amt = amt * INSIDER_TRACE_MULT;
    amt = Math.round(amt);
    if(amt <= 0) return;
    const floor = state.trace_floor || 0;
    state.trace = Math.min(100, Math.max(state.trace || 0, floor) + amt);
  }
  // Called only from checkBiomeUnlocks() when biome i is fully cleared. Silent (no notice) for
  // the Ghost Server transition (i+1 === BIOMES.length-1) per "Quiet: Auditor notices stop".
  function advanceTraceForBiomeClear(i){
    const floor = BIOME_TRACE_FLOORS[i];
    if(floor === undefined) return;
    if(floor > (state.trace_floor || 0)){
      state.trace_floor = floor;
      state.trace = Math.max(state.trace || 0, floor);
    }
    const nextBiomeIdx = i + 1;
    const isGhostServer = nextBiomeIdx === BIOMES.length - 1;
    if(isGhostServer) return; // notices stop; floor still rises, nothing shown
    fireAuditorStage(Math.min(5, i + 2));
  }
  function fireAuditorStage(stage){
    if(stage <= (state.auditor_stage || 0)) return;
    state.auditor_stage = stage;
    const text = auditorNoticeText(stage);
    if(!text) return;
    logMsg(`📡 Auditor notice: ${text}`);
    if(stage === 1) logMsg('Patch: "Automated. Every abandoned site pings home once in a while."');
    showAlertModal(`<div class="pixel-font glow" style="font-size:9.5px; color:var(--crimson); margin-bottom:8px;">⚠ AUDITOR NOTICE</div>${text}`);
  }

  // Reusable origin-card picker — used by the (future) intro's Scene 5 AND by "Not quite" below,

  // Transient, not persisted — guards against popping more than once per session even if the

  /* ---------------------------------------------------------
     STORY INTRO — Phase 1b: the 5-scene cold open, screen id 'storyIntro'.
     introStep/introHandle/introAfterFn are transient (not saved) — a page refresh mid-intro
     just restarts it from scene 0, which is fine since nothing it sets (handle/origin) is
     read anywhere until finishStoryIntro() marks state.storyIntroDone. startStoryIntro(afterFn)
     is the only entry point; afterFn runs once the player reaches the end (normally showTutorial(0)
     for a first-time player, or nothing extra for a reset-flow replay who already saw the tutorial).
     --------------------------------------------------------- */
  const HANDLE_SUGGESTIONS = ['NullRoute','Kilobit','Cindergrid','Faultline','Grayhat_7','StaticEcho','Backchannel','LowLatency','Deadcell','Offgrid'];
  let introStep = 0;
  let introHandle = '';
  let introAfterFn = null;

  function startStoryIntro(afterFn){
    introStep = 0;
    introHandle = state.handle || '';
    introAfterFn = afterFn || (()=>{});
    state.screen = 'storyIntro';
    render();
  }

  function finishStoryIntro(){
    state.storyIntroDone = true;
    save();
    const after = introAfterFn;
    introAfterFn = null;
    state.screen = 'town';
    render();
    if(after) after();
  }

  function renderStoryIntro(screenEl, controlsEl){
    switch(introStep){
      case 0: renderIntroHandle(screenEl, controlsEl); break;
      case 1: renderIntroOrigin(screenEl, controlsEl); break;
      case 2: renderIntroBootLine(screenEl, controlsEl); break;
      case 3: renderIntroJackIn(screenEl, controlsEl); break;
      case 4: renderIntroStarter(screenEl, controlsEl); break;
      default: renderIntroHandle(screenEl, controlsEl);
    }
  }

  function renderIntroHandle(screenEl, controlsEl){
    screenEl.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:10px; padding:6px 2px;">
        <div class="pixel-font glow" style="font-size:10px; color:var(--phosphor);">SIGNAL DETECTED</div>
        <div style="font-size:11px; color:var(--ink); line-height:1.6;">
          The connection holds. Something on the other end is listening, and it wants a name before it says anything else.
        </div>
        <input id="intro-handle-input" type="text" maxlength="16" placeholder="Enter a handle" value="${(introHandle||'').replace(/"/g,'&quot;')}"
          style="background:var(--bg); border:1px solid var(--ink-dim); color:var(--phosphor); font-family:inherit; font-size:12px; padding:8px; border-radius:4px; outline:none;">
      </div>`;
    controlsEl.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn" id="intro-randomize">🎲 Suggest a Handle</button>
      <button class="btn btn-primary" id="intro-continue">Continue</button>
    </div>`;
    const input = screenEl.querySelector('#intro-handle-input');
    input.addEventListener('input', ()=>{ introHandle = input.value; });
    controlsEl.querySelector('#intro-randomize').addEventListener('click', ()=>{
      let pick = HANDLE_SUGGESTIONS[Math.floor(Math.random()*HANDLE_SUGGESTIONS.length)];
      if(HANDLE_SUGGESTIONS.length > 1){
        while(pick === introHandle) pick = HANDLE_SUGGESTIONS[Math.floor(Math.random()*HANDLE_SUGGESTIONS.length)];
      }
      introHandle = pick;
      input.value = pick;
    });
    controlsEl.querySelector('#intro-continue').addEventListener('click', ()=>{
      const val = (input.value || '').trim();
      if(!val) return;
      introHandle = val;
      state.handle = val;
      introStep = 1;
      render();
    });
  }

  function renderIntroOrigin(screenEl, controlsEl){

          ${ORIGIN_IDS.map(id => { const o = ORIGINS[id]; return `

              <div style="font-size:9px; color:var(--ink-dim); margin-top:2px;">${o.story}</div>

  function renderIntroStarter(screenEl, controlsEl){

  const TUTORIAL_STEPS = [
    { t:'Welcome to Neon Haven', b:'Patch is quiet for now, but the town is yours to work with. Explore, catch monsters, grow stronger, and beat each biome\'s boss to open the next.' },
    { t:'The town menu', b:'The buttons below the screen are your town. <b>Wilderness Gate</b> is where you head out. <b>Shop</b>, <b>Storage</b>, <b>Inventory</b>, <b>Jobs</b> and the rest unlock or grow as you progress — a 🔒 tells you how to open it. The <b>📜 Log</b> at the top shows what just happened, on any screen.' },
    { t:'Exploring', b:'Pick a biome, then use the arrow pad to walk the map. Each step costs Energy and Hunger and earns a little XP. Fog hides the map until you get close. Look for <b>▪</b> chests, <b>✦</b> shrines and the <b>⛩</b> gate back home. Tap <b>❓ Legend</b> for all the symbols.' },

    { t:'Looking after your partner', b:'Watch the <b>Hunger</b> and <b>Energy</b> bars. Feed with a Databite from the Inventory, or use <b>Rest Partner</b> in town. If Hunger reaches 0 you can\'t keep exploring.' },
    { t:'Your first steps', b:'Claim your <b>Daily</b> reward, then head out through the Wilderness Gate. Anytime you\'re unsure, open <b>❓ Help</b> in the town menu — it explains every system by topic, and you can replay this tutorial there.' },
  ];
  function showTutorial(step){
    step = Math.max(0, Math.min(TUTORIAL_STEPS.length-1, step));
    const s = TUTORIAL_STEPS[step];
    const last = step === TUTORIAL_STEPS.length-1;
    const overlay = document.getElementById('modal-overlay');
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">

    document.getElementById('tut-next').addEventListener('click', ()=>{ last ? finish() : showTutorial(step+1); });
    document.getElementById('tut-back').addEventListener('click', ()=>showTutorial(step-1));

  let dexFilter = { status:'all', type:'all' }; // transient UI state, not persisted
  function renderDex(screenEl, controlsEl){
    const dex = state.dex || {};
    const totalLines = lineIds.length;
    const caughtLines = lineIds.filter(id => dexCaughtAny(dex[id])).length;
    const pct = totalLines ? Math.round(caughtLines/totalLines*100) : 0;
    const statusOf = id => dexCaughtAny(dex[id]) ? 'caught' : (dexSeenAny(dex[id]) ? 'seen' : 'unknown');

    const cardFor = (lineId) => {
      const line = EVOLUTION_LINES[lineId];
      const entry = dex[lineId];
      const stageBlock = (stage) => {
        const form = line[stage-1];
        const seen = !!(entry && entry.seenStage && entry.seenStage[stage]);
        const caught = !!(entry && entry.caughtStage && entry.caughtStage[stage]);
        if(!seen){
          return `<div style="flex:1; text-align:center; opacity:.4;">
            <div style="width:40px;height:40px;margin:0 auto; border:1px dashed var(--ink-dim); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-dim);">?</div>
            <div style="font-size:8.5px; color:var(--ink-dim); margin-top:3px;">Undiscovered</div>
          </div>`;
        }
        const sprite = (caught && entry.best && entry.best.stage === stage)
          ? spriteImgHtml({speciesId:lineId, stage, ivs:entry.best.ivs, cosmetic:entry.best.cosmetic, uid:entry.best.uid}, 40)
          : `<span style="display:inline-block; filter:grayscale(1) brightness(.55);">${spriteImgHtml({speciesId:lineId, stage, ivs:null, cosmetic:null, uid:lineId+'_dex_'+stage}, 40)}</span>`;
        return `<div style="flex:1; text-align:center;">
          ${sprite}
          <div style="font-size:9px; color:${caught?form.color:'var(--ink-dim)'}; margin-top:3px;">${caught ? form.name : '???'}</div>
          ${caught ? `<div style="font-size:8px; color:var(--amber);">${potentialStars(entry.best && entry.best.stage===stage ? entry.best.ivs : null)}</div>` : `<div style="font-size:8px; color:var(--ink-dim);">seen, not caught</div>`}
        </div>`;
      };
      const known = statusOf(lineId) !== 'unknown';
      const blocks = line.map((_,i)=>stageBlock(i+1)).join(`<div style="align-self:center; color:var(--ink-dim); font-size:11px;">→</div>`);
      return `<div class="card" style="${known?'':'opacity:.55;'}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:10.5px; color:${known?'var(--ink)':'var(--ink-dim)'};">${known ? line[0].name + ' Line' : '??????? Line'}</span>
          <span class="badge">${entry ? entry.catches : 0} caught</span>
          ${entry && entry.markedCaught ? '<span class="badge" style="color:#fff44d;border-color:#fff44d;">✦ Marked found</span>' : ''}
        </div>
        <div style="display:flex; gap:8px;">${blocks}</div>
      </div>`;
    };

    // Filters: status chips + type select. A type filter hides never-seen lines
    // so it can't be used to spoil what's undiscovered.
    const visible = lineIds.filter(id => {
      const st = statusOf(id);
      if(dexFilter.status === 'caught' && st !== 'caught') return false;
      if(dexFilter.status === 'missing' && st === 'caught') return false;
      if(dexFilter.type !== 'all' && (st === 'unknown' || EVOLUTION_LINES[id][0].type !== dexFilter.type)) return false;
      return true;
    });
    const chip = (id, label) => `<button class="btn ${dexFilter.status===id?'btn-cyan':''}" style="padding:4px 9px; font-size:9.5px;" data-dex-status="${id}">${label}</button>`;

    screenEl.innerHTML = `
      ${screenTitle('📖 MONSTER DEX', 'var(--violet)')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">${caughtLines}/${totalLines} lines caught (${pct}%) · encounter a species in the wild to log it, catch or hatch one to reveal it fully.</div>
      <div class="card" style="margin-bottom:10px; border-color:var(--amber);">
        <div style="font-size:10.5px; color:var(--amber); margin-bottom:6px;">🏆 Milestones</div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${DEX_MILESTONES.map(ms => {
            const claimed = (state.dexMilestonesClaimed||[]).includes(ms.id);
            const ready = !claimed && ms.check(state.dex||{});
            return `<div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.03); border:1px solid ${ready?'var(--amber)':'var(--glass-border)'}; border-radius:6px; padding:5px 7px;">
              <div style="flex:1;">
                <div style="font-size:9.5px; color:${claimed?'var(--phosphor)':(ready?'var(--amber)':'var(--ink-dim)')};">${claimed?'✓ ':''}${ms.name}</div>
                <div style="font-size:8.5px; color:var(--ink-dim);">${ms.desc} — ${rewardText(ms.reward)}</div>
              </div>
              ${ready ? `<button class="btn btn-amber" style="padding:4px 8px; font-size:9px;" data-claim-ms="${ms.id}">Claim</button>` : (claimed ? '' : '<span style="font-size:8.5px; color:var(--ink-dim);">locked</span>')}
            </div>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:8px;">
        ${chip('all','All')}${chip('caught','Caught')}${chip('missing','Missing')}
        <select data-dex-type style="flex:1; min-width:90px; font-size:9.5px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:4px;">
          <option value="all">All types</option>
          ${Object.keys(TYPE_CHART).map(t=>`<option value="${t}" ${dexFilter.type===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:9px; color:var(--ink-dim); margin-bottom:6px;">Showing ${visible.length} of ${totalLines}</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${visible.length ? visible.map(cardFor).join('') : '<div class="card" style="font-size:10px; color:var(--ink-dim);">Nothing matches this filter yet.</div>'}
      </div>
    `;
    screenEl.querySelectorAll('[data-claim-ms]').forEach(btn=>{
      btn.addEventListener('click', ()=>claimDexMilestone(btn.getAttribute('data-claim-ms')));
    });
    screenEl.querySelectorAll('[data-dex-status]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ dexFilter.status = btn.getAttribute('data-dex-status'); render(); });
    });
    const typeSel = screenEl.querySelector('[data-dex-type]');
    if(typeSel) typeSel.addEventListener('change', ()=>{ dexFilter.type = typeSel.value; render(); });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  /* ---------------------------------------------------------
     NETWORK REGISTRY
  --------------------------------------------------------- */
  function renderStorage(screenEl, controlsEl){
    screenEl.innerHTML = `
      ${screenTitle('📦 NETWORK REGISTRY')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:6px;">${state.storage.length} monster${state.storage.length===1?'':'s'} in your network.</div>
      ${sortBarHtml()}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${sortedMonsters().map(m => monsterCard(m, {showSell:true})).join('')}
      </div>
    `;

    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });

    state.storage.forEach(m=>{
      const setBtn = screenEl.querySelector(`[data-set="${m.uid}"]`);
      if(setBtn) setBtn.addEventListener('click', ()=>{ state.activeId = m.uid; logMsg(`${getForm(m).name} is now your active partner.`); render(); });
    });
    screenEl.querySelectorAll('[data-inspect]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ inspectUid = btn.getAttribute('data-inspect'); state.screen='inspect'; render(); });
    });
    screenEl.querySelectorAll('[data-lock]').forEach(btn=>{
      btn.addEventListener('click', ()=>toggleLock(btn.getAttribute('data-lock')));
    });
    screenEl.querySelectorAll('[data-sell]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sellConfirmUid = btn.getAttribute('data-sell'); render(); });
    });
    screenEl.querySelectorAll('[data-sell-confirm]').forEach(btn=>{
      btn.addEventListener('click', ()=>sellMonster(btn.getAttribute('data-sell-confirm')));
    });
    screenEl.querySelectorAll('[data-sell-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sellConfirmUid = null; render(); });
    });
    screenEl.querySelectorAll('[data-recycle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ recycleConfirmUid = btn.getAttribute('data-recycle'); render(); });
    });
    screenEl.querySelectorAll('[data-recycle-confirm]').forEach(btn=>{
      btn.addEventListener('click', ()=>recycleMonster(btn.getAttribute('data-recycle-confirm')));
    });
    screenEl.querySelectorAll('[data-recycle-cancel]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ recycleConfirmUid = null; render(); });
    });
    screenEl.querySelectorAll('[data-equip-cos]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const uid = btn.getAttribute('data-equip-uid');
        const cid = btn.getAttribute('data-equip-cos');
        const mon = state.storage.find(x=>x.uid===uid);
        if(!mon) return;
        mon.cosmetic = (cid === 'none') ? null : cid;
        const cos = COSMETICS.find(c=>c.id===cid);
        logMsg(cid==='none' ? `${getForm(mon).name} removed their accessory.` : `${getForm(mon).name} is now wearing ${cos.name}.`);
        render();
      });
    });
    screenEl.querySelectorAll('[data-mod-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ if(sel.value){ equipModule(sel.getAttribute('data-mod-select'), sel.value); render(); } });
    });
    screenEl.querySelectorAll('[data-mod-unequip]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ unequipModule(btn.getAttribute('data-mod-unequip')); render(); });
    });
    screenEl.querySelectorAll('[data-gear-slot]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const [uid, slotStr] = sel.getAttribute('data-gear-slot').split(':');
        const slot = parseInt(slotStr, 10);
        const gearId = sel.value || null;
        const mon = state.storage.find(x=>x.uid===uid);
        if(!mon) return;
        if(gearId) logMsg(`${getForm(mon).name} equipped ${GEAR_ITEMS[gearId].name}.`);
        else logMsg(`${getForm(mon).name} unequipped a gear slot.`);
        equipGear(uid, slot, gearId); // equipGear renders internally, so log first
      });
    });
  }


  /* ---------------------------------------------------------
     INSPECT — a single monster's full profile: exact IVs (not just the
     Potential star summary), moves with power/type, and everything held.
     Reached only from Storage; falls back to Town if the monster is gone
     (e.g. sold from another tab/import) rather than rendering on nothing.
  --------------------------------------------------------- */
  let inspectUid = null;
  const IV_STAT_LABELS = { hp:'HP', str:'STR', def:'DEF', spd:'SPD' };
  function ivPct(v){ return Math.round(((v - IV_MIN) / (IV_MAX - IV_MIN)) * 100); }
  function renderInspect(screenEl, controlsEl){
    const m = state.storage.find(x => x.uid === inspectUid);
    if(!m){ state.screen = 'storage'; render(); return; }
    const sp = getForm(m);
    const isActive = m.uid === state.activeId;
    const line = EVOLUTION_LINES[m.speciesId];
    const nextReq = m.stage < line.length ? line[m.stage].levelReq : null;
    const ivRows = ['hp','str','def','spd'].map(k => {
      const pct = ivPct(m.ivs[k]);
      return `<div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <span style="width:32px; font-size:9.5px; color:var(--ink-dim);">${IV_STAT_LABELS[k]}</span>
        <div class="barwrap" style="flex:1;"><div class="barfill" style="width:${pct}%; background:${pct>=80?'var(--amber)':(pct>=50?'var(--phosphor)':'var(--ink-dim)')};"></div></div>
        <span style="width:34px; text-align:right; font-size:9px; color:var(--ink-dim);">${pct}%</span>
      </div>`;
    }).join('');
    const dexEntry = state.dex && state.dex[m.speciesId];
    screenEl.innerHTML = `
      ${screenTitle('🔍 INSPECT', sp.color)}
      <div class="card" style="text-align:center; margin-bottom:8px; position:relative;">
        <button data-lock="${m.uid}" title="${m.locked?'Unlock':'Lock (protects from selling)'}" style="all:unset; cursor:pointer; position:absolute; top:8px; right:10px; font-size:18px;">${m.locked?'🔒':'🔓'}</button>
        ${spriteImgHtml(m, 72)}
        <div style="color:${sp.color}; margin-top:6px; font-size:13px;">${m.nickname||sp.name} <span class="badge">Gen ${m.gen} · Lv${m.level}</span></div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">${sp.type} type · Stage ${m.stage}/${line.length} · ${evolveHintText(m, nextReq)}${isActive?' · <span style="color:var(--phosphor);">Active partner</span>':''}${m.marked?' · <span style="color:#fff44d;">✦ Marked</span>':''}${m.locked?' · <span style="color:var(--crimson);">🔒 Locked</span>':''}</div>
      </div>
      <div class="card" style="margin-bottom:8px;">
        <div style="color:var(--phosphor); margin-bottom:6px;">Stats</div>
        <div style="font-size:10px; color:var(--ink-dim); line-height:1.6;">HP ${m.hp}/${m.maxHp} · STR ${m.str} · DEF ${m.def} · SPD ${m.spd}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:4px;">XP ${m.xp}/${xpToNext(m.level)} · Crests used ${m.crestCount||0}/3</div>
      </div>
      ${personalityDef(m) ? `<div class="card" style="margin-bottom:8px;">
        <div style="color:var(--phosphor); margin-bottom:4px;">Personality — ${personalityDef(m).name}</div>
        <div style="font-size:9.5px; color:var(--ink-dim);">${personalityDef(m).desc}</div>
        <div style="font-size:9px; color:var(--ink-dim); margin-top:4px;">${personalityEffectText(m)}</div>
      </div>` : ''}
      <div class="card" style="margin-bottom:8px;">
        <div style="color:var(--amber); margin-bottom:6px;">Individual Values <span style="font-size:9px; color:var(--ink-dim); font-weight:normal;">— ${potentialStars(m.ivs)} overall, standout ${(ivBestStat(m.ivs)||'hp').toUpperCase()}</span></div>
        ${ivRows}
      </div>
      <div class="card" style="margin-bottom:8px;">
        <div style="color:var(--crimson); margin-bottom:6px;">Moves</div>
        <div style="font-size:10px; color:var(--ink-dim); line-height:1.7;">
          ${m.movesKnown.map(id => { const mv = MOVES[id]; return `${mv.name}${mv.type?` <span style="opacity:.7;">[${mv.type}]</span>`:''} — ${mv.power}× power`; }).join('<br>')}
        </div>
      </div>
      <div class="card" style="margin-bottom:8px;">
        <div style="color:var(--cyan); margin-bottom:6px;">Held</div>
        <div style="font-size:10px; color:var(--ink-dim); line-height:1.7;">
          Accessory: ${m.cosmetic ? COSMETICS.find(c=>c.id===m.cosmetic).name : 'None'}<br>
          Gear: ${(m.gearSlots||[]).filter(Boolean).map(g=>GEAR_ITEMS[g].name).join(', ') || 'None equipped'}<br>
          Module: ${m.module && MODULES[m.module.id] ? `${MODULES[m.module.id].name}${m.module.ticksLeft!=null?` (${m.module.ticksLeft} ticks left)`:''}` : 'None equipped'}
        </div>
      </div>
      ${dexEntry ? `<div class="card"><div style="color:var(--violet); margin-bottom:4px;">Dex record</div><div style="font-size:9.5px; color:var(--ink-dim);">${dexEntry.catches} caught of this line · first on ${dexEntry.firstCaughtAt ? new Date(dexEntry.firstCaughtAt).toLocaleDateString() : 'unknown'}</div></div>` : ''}
    `;
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Storage</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='storage'; render(); });
    screenEl.querySelectorAll('[data-lock]').forEach(btn=>{
      btn.addEventListener('click', ()=>toggleLock(btn.getAttribute('data-lock')));
    });
  }

  function monsterCard(m, opts){
    opts = opts || {};
    const sp = getForm(m);
    const isActive = m.uid === state.activeId;
    const line = EVOLUTION_LINES[m.speciesId];
    const nextReq = m.stage < line.length ? line[m.stage].levelReq : null;
    const canSell = opts.showSell && !isActive && state.storage.length > 1 && !m.locked;
    const confirming = opts.showSell && sellConfirmUid === m.uid;
    let sellBlockReason = '';
    if(opts.showSell && !canSell){
      if(isActive) sellBlockReason = ' (active partner)';
      else if(state.storage.length<=1) sellBlockReason = ' (last partner)';
      else if(m.locked) sellBlockReason = ' (locked)';
    }
    // Recycle Entity shares Sell's eligibility rules exactly (same three block reasons), so it
    // reuses canSell/sellBlockReason rather than duplicating that logic.
    const recycleConfirming = opts.showSell && recycleConfirmUid === m.uid;
    const equippedId = m.cosmetic || 'none';
    return `
      <div class="card">
        <div style="display:flex; align-items:center; gap:6px; color:${sp.color}; min-width:0;">
          ${spriteImgHtml(m, 36)}
          <div style="min-width:0; flex:1;">${m.nickname||sp.name} <span class="badge">Gen ${m.gen} · Lv${m.level}</span> ${isActive?'<span class="badge" style="color:var(--phosphor);border-color:var(--phosphor)">ACTIVE</span>':''} ${m.marked?'<span class="badge" style="color:#fff44d;border-color:#fff44d;">✦ MARKED</span>':''}</div>
          <button data-lock="${m.uid}" title="${m.locked?'Unlock':'Lock (protects from selling)'}" style="all:unset; cursor:pointer; flex-shrink:0; display:flex; align-items:center; gap:3px; font-size:16px; padding:2px 4px; color:var(--ink-dim);">${m.locked?'🔒':'🔓'}<span style="font-size:8.5px; letter-spacing:.5px;">${m.locked?'LOCKED':'UNLOCKED'}</span></button>
        </div>
        <div style="display:grid; grid-template-columns:${isActive?'1fr':'1fr 1fr'}; gap:6px; margin-top:6px;">
          <button class="btn btn-cyan" style="padding:5px 8px; font-size:10px;" data-inspect="${m.uid}">🔍 Inspect</button>
          ${!isActive ? `<button class="btn" style="padding:5px 8px; font-size:10px;" data-set="${m.uid}">Set Active</button>` : ''}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:6px;">
          HP ${m.hp}/${m.maxHp} · STR ${m.str} · DEF ${m.def} · SPD ${m.spd} · Type: ${sp.type}
        </div>
        <div style="font-size:9.5px; color:var(--amber); margin-top:2px;">
          Potential: ${potentialStars(m.ivs)} <span style="color:var(--ink-dim);">· Standout: ${(ivBestStat(m.ivs)||'hp').toUpperCase()}</span>
        </div>
        ${personalityDef(m) ? `<div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">Personality: <span style="color:var(--phosphor);">${personalityDef(m).name}</span></div>` : ''}
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          Crests used: ${m.crestCount||0}/3${(m.jobCooldown||0)>0 ? ` · Job cooldown: ${m.jobCooldown} ticks` : ''}${(m.trainCooldown||0)>0 ? ` · Training cooldown: ${m.trainCooldown} ticks` : ''}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          XP ${m.xp}/${xpToNext(m.level)} · ${evolveHintText(m, nextReq)}
        </div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:2px;">
          Moves: ${m.movesKnown.map(id=>MOVES[id].name).join(', ')}
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">ACCESSORY</div>
          <div style="display:flex; flex-wrap:wrap; gap:4px;">
            ${(m.ownedCosmetics||['none']).map(cid=>{
              const cos = COSMETICS.find(c=>c.id===cid);
              if(!cos) return '';
              const equipped = equippedId === cid;
              return `<button class="btn ${equipped?'btn-cyan':''}" style="padding:4px 7px; font-size:9px;" data-equip-uid="${m.uid}" data-equip-cos="${cid}">${cos.name}</button>`;
            }).join('')}
          </div>
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">GEAR (${m.gearSlots.filter(Boolean).length}/${GEAR_SLOT_COUNT})</div>
          <div style="display:flex; flex-direction:column; gap:4px;">
            ${Array.from({length:GEAR_SLOT_COUNT}).map((_,slot)=>{
              const equippedGearId = (m.gearSlots||[])[slot] || '';
              const ownedGearIds = Object.keys(state.inventory.gear||{}).filter(gid => (state.inventory.gear[gid]||0) > 0);
              const availableForThisSlot = ownedGearIds.filter(gid => gid === equippedGearId || (!m.gearSlots.includes(gid) && gearSpare(gid) > 0));
              return `<select data-gear-slot="${m.uid}:${slot}" style="width:100%; font-size:9px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:3px;">
                <option value="">Slot ${slot+1}: empty</option>
                ${availableForThisSlot.map(gid => {
                  const g = GEAR_ITEMS[gid];
                  if(!g) return '';
                  return `<option value="${gid}" ${equippedGearId===gid?'selected':''}>${g.icon} ${g.name}${g.statBonus?'':' (move)'}</option>`;
                }).join('')}
              </select>`;
            }).join('')}
          </div>
        </div>
        <div style="margin-top:8px;">
          <div style="font-size:9px; color:var(--ink-dim); letter-spacing:1px; margin-bottom:4px;">MODULE</div>
          ${(()=>{
            const mod = m.module, def = mod && MODULES[mod.id];
            const bag = invModules();
            const held = def ? `<div style="font-size:9.5px; color:${def.color}; margin-bottom:4px;">${def.icon} ${def.name}${mod.ticksLeft!=null?` — ${mod.ticksLeft} ticks left`:(def.oneUse?' — 1 use':'')} <button class="btn" style="padding:2px 7px; font-size:8.5px; margin-left:4px;" data-mod-unequip="${m.uid}">Unequip</button></div>` : '';
            const opts = bag.map(x => `<option value="${x.uid}">${MODULES[x.id].icon} ${MODULES[x.id].name}${x.ticksLeft!=null?' ('+x.ticksLeft+' ticks)':''}</option>`).join('');
            return held + (bag.length ? `<select data-mod-select="${m.uid}" style="width:100%; font-size:9px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:3px;"><option value="">${def?'Swap module...':'Equip a module...'}</option>${opts}</select>` : (def ? '' : '<div style="font-size:9px; color:var(--ink-dim);">No modules in your bag — see the Shop.</div>'));
          })()}
        </div>
        ${opts.showSell ? `
        <div style="margin-top:8px;">
          ${confirming ? `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              <button class="btn btn-crimson" style="padding:6px; font-size:10px;" data-sell-confirm="${m.uid}">Confirm — Sell for ◈${sellPrice(m)}</button>
              <button class="btn" style="padding:6px; font-size:10px;" data-sell-cancel="${m.uid}">Cancel</button>
            </div>
          ` : `
            <button class="btn ${canSell?'btn-crimson':''}" style="padding:6px; font-size:10px; width:100%;" data-sell="${m.uid}" ${canSell?'':'disabled'}>💰 Sell for ◈${sellPrice(m)}${sellBlockReason}</button>
          `}
        </div>
        <div style="margin-top:6px;">
          ${recycleConfirming ? `
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              <button class="btn btn-cyan" style="padding:6px; font-size:10px;" data-recycle-confirm="${m.uid}">Confirm — Recycle (no Bits)</button>
              <button class="btn" style="padding:6px; font-size:10px;" data-recycle-cancel="${m.uid}">Cancel</button>
            </div>
          ` : `
            <button class="btn ${canSell?'btn-cyan':''}" style="padding:6px; font-size:10px; width:100%;" data-recycle="${m.uid}" ${canSell?'':'disabled'}>♻ Recycle Entity${sellBlockReason}</button>
          `}
          ${(()=>{ const dest = recycleDestinationText(sp.type); return dest ? `<div style="font-size:8.5px; color:var(--ink-dim); margin-top:3px;">${dest}</div>` : ''; })()}
        </div>` : ''}
      </div>`;
  }

  /* ---------------------------------------------------------
     WANTED BOARD
  --------------------------------------------------------- */
  function renderWanted(screenEl, controlsEl){

      ${screenTitle('📋 WANTED BOARD', 'var(--amber)')}

      ${state.wanted.length ? state.wanted.map(w=>{

            <div style="display:flex; align-items:center; gap:6px; color:${form.color}">

              <span>${w.name} <span class="badge">Gen ${w.gen} · Lv${w.level}</span>${w.marked?' <span class="badge" style="color:#fff44d;border-color:#fff44d;">✦</span>':''}</span>

        </div>`;
      }).join('') : `<div class="card" style="font-size:10px; color:var(--ink-dim);">No wanted monsters yet. Fail a capture out in the wild and you'll get the option to track it here.</div>`}
      <div style="font-size:9px; color:var(--ink-dim); margin-top:6px;">${state.wanted.length}/${WANTED_CAP} tracked</div>

    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
