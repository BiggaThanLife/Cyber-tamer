        </div>`;
      }).join('') : `<div class="card" style="font-size:10px; color:var(--ink-dim);">No wanted monsters yet. Fail a capture out in the wild and you'll get the option to track it here.</div>`}
      <div style="font-size:9px; color:var(--ink-dim); margin-top:6px;">${state.wanted.length}/${WANTED_CAP} tracked</div>
    `;
    screenEl.querySelectorAll('[data-release]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.wanted = state.wanted.filter(w=>w.id!==btn.getAttribute('data-release'));
        render();
      });
    });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  /* ---------------------------------------------------------
     JOB BOARD
  --------------------------------------------------------- */
  function renderJobs(screenEl, controlsEl){
    screenEl.innerHTML = `
      ${screenTitle('💼 JOB BOARD', 'var(--amber)')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">Send a partner on a job for an instant, stat-influenced payout. Each attempt costs Energy and Hunger, and leaves them needing to recover — explore the wilderness to bring their cooldown down (cooldowns don't pass while you're just standing around town).</div>
      ${sortBarHtml()}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${sortedMonsters().map(m=>{
          const sp = getForm(m);
          const cooling = (m.jobCooldown||0) > 0;
          const tooTired = m.energy < JOB_MIN_ENERGY;
          const blocked = cooling || tooTired;
          return `<div class="card">
            <div style="display:flex; align-items:center; gap:6px; color:${sp.color}; margin-bottom:6px;">
              ${spriteImgHtml(m,30)} <span>${m.nickname||sp.name} <span class="badge">Lv${m.level}</span>
              ${cooling?`<span class="badge" style="color:var(--amber);border-color:var(--amber)">COOLDOWN ${m.jobCooldown}</span>`:''}
              ${(!cooling && tooTired)?'<span class="badge" style="color:var(--crimson);border-color:var(--crimson)">TIRED</span>':''}</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              ${JOBS.map(job=>{
                const statVal = jobStatValue(m, job);
                return `<button class="btn" style="padding:5px 6px; font-size:9.5px; text-align:left;" data-attempt-uid="${m.uid}" data-attempt-job="${job.id}" ${blocked?'disabled':''}>${job.icon} ${job.name}<br><span style="color:${job.color}">${job.stat.toUpperCase()} ${statVal}</span></button>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
    screenEl.querySelectorAll('[data-attempt-uid]').forEach(btn=>{
      btn.addEventListener('click', ()=>attemptJob(btn.getAttribute('data-attempt-uid'), btn.getAttribute('data-attempt-job')));
    });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  /* ---------------------------------------------------------
     TRAINING GROUND
     Same anti-spam shape as the Job Board (cooldown that only decays while
     exploring), plus a hard per-stat lifetime cap so a single partner can't
     be pumped indefinitely. Complements Evolution Crests rather than
     duplicating them: Crests are broad and passive, Training is narrow,
     skill-based, and lets you specialize a build further than Crests alone.
  --------------------------------------------------------- */
  const TRAIN_STAT_META = {
    str: {name:'Strength', icon:'💪', color:'var(--crimson)'},
    def: {name:'Defense',  icon:'🛡',  color:'var(--cyan)'},
    spd: {name:'Speed',    icon:'⚡', color:'var(--amber)'},
  };
  function renderTraining(screenEl, controlsEl){
    if(!isTrainingUnlocked()){ state.screen='town'; render(); return; }
    screenEl.innerHTML = `
      ${screenTitle('🏋 TRAINING GROUND', 'var(--crimson)')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">Focus a partner's training on one stat. Each attempt costs Energy and Hunger and leaves them needing to recover — explore the wilderness to bring their cooldown down. Each stat can only be trained up to +${TRAIN_CAP_PER_STAT} this way per partner.</div>
      ${sortBarHtml()}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${sortedMonsters().map(m=>{
          const sp = getForm(m);
          const cooling = (m.trainCooldown||0) > 0;
          const tooTired = m.energy < TRAIN_MIN_ENERGY;
          const blocked = cooling || tooTired;
          return `<div class="card">
            <div style="display:flex; align-items:center; gap:6px; color:${sp.color}; margin-bottom:6px;">
              ${spriteImgHtml(m,30)} <span>${m.nickname||sp.name} <span class="badge">Lv${m.level}</span>
              ${cooling?`<span class="badge" style="color:var(--amber);border-color:var(--amber)">COOLDOWN ${m.trainCooldown}</span>`:''}
              ${(!cooling && tooTired)?'<span class="badge" style="color:var(--crimson);border-color:var(--crimson)">TIRED</span>':''}</span>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;">
              ${TRAIN_STATS.map(stat=>{
                const meta = TRAIN_STAT_META[stat];
                const cur = (m.trainBonus && m.trainBonus[stat]) || 0;
                const maxed = cur >= TRAIN_CAP_PER_STAT;
                return `<button class="btn" style="padding:5px 4px; font-size:9.5px; text-align:left;" data-train-uid="${m.uid}" data-train-stat="${stat}" ${(blocked||maxed)?'disabled':''}>${meta.icon} ${meta.name}<br><span style="color:${meta.color}">+${cur}/${TRAIN_CAP_PER_STAT}${maxed?' MAX':''}</span></button>`;
              }).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
    screenEl.querySelectorAll('[data-train-uid]').forEach(btn=>{
      btn.addEventListener('click', ()=>attemptTraining(btn.getAttribute('data-train-uid'), btn.getAttribute('data-train-stat')));
    });
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  function attemptTraining(uid, stat){
    const m = state.storage.find(x => x.uid === uid);
    if(!m || !TRAIN_STATS.includes(stat)) return;
    if((m.trainCooldown||0) > 0){ logMsg(`${getForm(m).name} is still recovering from training — explore a bit more first.`); render(); return; }
    if(m.energy < TRAIN_MIN_ENERGY){ logMsg(`${getForm(m).name} is too tired to train — rest or feed them first.`); render(); return; }
    if((m.trainBonus[stat]||0) >= TRAIN_CAP_PER_STAT){ logMsg(`${getForm(m).name}'s ${TRAIN_STAT_META[stat].name} training is already maxed out.`); render(); return; }
    state.trainAttempt = { uid, stat };
    state.screen = 'trainAttempt';
    render();
  }

  function renderTrainAttempt(screenEl, controlsEl){
    const att = state.trainAttempt;
    if(!att){ state.screen='training'; render(); return; }
    const m = state.storage.find(x => x.uid === att.uid);
    const meta = TRAIN_STAT_META[att.stat];
    if(!m || !meta){ state.trainAttempt = null; state.screen = 'training'; render(); return; }
    const sp = getForm(m);

    mountTimingGame(screenEl, controlsEl, {
      title: `${meta.icon} ${meta.name.toUpperCase()} TRAINING`,
      accent: meta.color,
      headerHtml: `<div style="text-align:center; margin-bottom:10px;">${spriteImgHtml(m,56)}<div style="color:${sp.color}; margin-top:4px;">${m.nickname||sp.name} is training</div></div>`,
      hint: `Tap when the marker is in the zone for the best gain.`,
      greatHalf: 8, goodHalf: 22,
      tapLabel: 'Train!',
      backLabel: '← Back to Ground',
      onBack: ()=>{ state.trainAttempt = null; state.screen = 'training'; render(); },
      onTap: (pct)=>{
        const dist = Math.abs(pct - 50);
        let tier;
        if(dist <= 8) tier='GREAT';
        else if(dist <= 22) tier='GOOD';
        else tier='MISS';
        const gain = TRAIN_GAIN_BY_TIER[tier];
        const before = m.trainBonus[att.stat]||0;
        const after = Math.min(TRAIN_CAP_PER_STAT, before + gain);
        const actualGain = after - before;
        m.trainBonus[att.stat] = after;
        recalcStats(m, false);
        m.energy = Math.max(0, m.energy - TRAIN_ENERGY_COST);
        m.hunger = Math.max(0, m.hunger - TRAIN_HUNGER_COST);
        m.trainCooldown = TRAIN_COOLDOWN_BY_TIER[tier];
        questEvent('train', 1);
        const tierMsg = tier==='GREAT' ? 'Excellent form!' : (tier==='GOOD' ? 'Solid effort.' : 'Lost focus.');
        const gainMsg = actualGain>0 ? `+${actualGain} ${meta.name}` : 'no gain — already maxed';
        logMsg(`${tierMsg} ${getForm(m).name}'s training: ${gainMsg} — ${m.trainCooldown} ticks to recover.`);
        state.trainAttempt = null;
        state.screen = 'training';
        render();
      }
    });
  }

  /* ---------------------------------------------------------
     SERVER FARM
     A Stardew-flavored plant/tend/harvest loop, digitally reskinned: till a
     Grow-Pod, plant a Data Seed, Charge it (power in place of water) to
     start growth, then wait out the crop's growTicks of exploration before
     harvesting. Growth advances on the same tick clock as Job/Training
     cooldowns — only while exploring — so it rewards playing, not idling.
     A ready crop left unharvested past witherTicks goes to waste, so there's
     still a reason to check back rather than plant-and-forget forever.
  --------------------------------------------------------- */
  function renderFarm(screenEl, controlsEl){
    const seeds = state.inventory.seeds;
    const tier = FARM_TIERS[state.farm.tierIndex||0];
    const nextTier = FARM_TIERS[(state.farm.tierIndex||0)+1];
    screenEl.innerHTML = `
      ${screenTitle('🌾 SERVER FARM', 'var(--phosphor)')}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">Plant a Data Seed, Charge the pod to start growth, then explore — pods only grow while you're out in the wilderness. Left too long after ripening, a crop withers.</div>
      <div class="card" style="margin-bottom:10px; border-color:var(--violet);">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div style="color:var(--violet);">🏠 ${tier.name} <span class="badge">${state.farm.pods.length} pods</span></div>
        </div>
        ${nextTier ? `
          <div style="font-size:9px; color:var(--ink-dim); margin-top:4px;">Next: ${nextTier.name} — ${nextTier.podCount} pods. ${nextTier.desc}</div>
          <button class="btn btn-violet" style="width:100%; margin-top:6px; padding:6px; font-size:10px;" id="upgrade-farm" ${state.bits<nextTier.cost?'disabled':''}>Upgrade — ◈${nextTier.cost}</button>
        ` : `<div style="font-size:9px; color:var(--phosphor); margin-top:4px;">Max tier reached — the full operation.</div>`}
      </div>
      ${farmAutomationHtml()}
      <div style="font-size:10.5px; color:var(--amber); margin-bottom:6px;">🌱 Data Seeds</div>
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:12px;">
        ${Object.values(CROPS).filter(crop => !crop.mineOnly).map(crop => `
          <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <div style="color:${crop.color}">${crop.icon} ${crop.name} <span class="badge">◈${crop.seedPrice}</span> <span class="badge">Owned: ${seeds[crop.id]||0}</span></div>
              <div style="font-size:9px; color:var(--ink-dim);">${crop.desc} — ${crop.growTicks} ticks to grow</div>
            </div>
            <button class="btn btn-amber" style="padding:5px 9px; font-size:10px; flex-shrink:0;" data-buy-seed="${crop.id}" ${state.bits<crop.seedPrice?'disabled':''}>Buy</button>
          </div>`).join('')}
        ${Object.values(CROPS).some(c=>c.mineOnly && (seeds[c.id]||0)>0) ? `
          <div style="font-size:9px; color:var(--ink-dim); margin-top:2px;">Found in the mines: ${Object.values(CROPS).filter(c=>c.mineOnly).map(c=>`${c.icon} ${c.name} (${seeds[c.id]||0})`).join(', ')}</div>
        ` : ''}
      </div>
      <div style="font-size:10.5px; color:var(--amber); margin-bottom:6px;">Grow-Pods</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        ${state.farm.pods.map((pod, i) => farmPodCardHtml(pod, i)).join('')}
      </div>
    `;
    const upgradeBtn = screenEl.querySelector('#upgrade-farm');
    if(upgradeBtn) upgradeBtn.addEventListener('click', upgradeFarm);
    screenEl.querySelectorAll('[data-buy-seed]').forEach(btn=>{
      btn.addEventListener('click', ()=>buySeed(btn.getAttribute('data-buy-seed')));
    });
    wireFarmPodButtons(screenEl);
    wireFarmAutomation(screenEl);
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

  function farmPodCardHtml(pod, i){
    if(pod.state === 'empty'){
      return `<div class="card" style="text-align:center;">
        <div style="font-size:20px; opacity:.35;">▫</div>
        <div style="font-size:9px; color:var(--ink-dim); margin:4px 0;">Empty Pod</div>
        <select data-plant-select="${i}" style="width:100%; font-size:9px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:3px;">
          <option value="">Plant...</option>
          ${Object.values(CROPS).filter(c => (state.inventory.seeds[c.id]||0)>0).map(c => `<option value="${c.id}">${c.icon} ${c.name} (${state.inventory.seeds[c.id]})</option>`).join('')}
        </select>
      </div>`;
    }
    const crop = CROPS[pod.cropId];
    if(!crop) return `<div class="card"></div>`;
    if(pod.state === 'planted'){
      return `<div class="card" style="text-align:center;">
        <div style="font-size:20px;">${crop.icon}</div>
        <div style="font-size:9px; color:${crop.color}; margin:4px 0;">${crop.name} — unpowered</div>
        <button class="btn btn-cyan" style="width:100%; padding:5px; font-size:9.5px;" data-charge="${i}">⚡ Charge</button>
      </div>`;
    }
    if(pod.state === 'growing'){
      const pct = Math.min(100, Math.round(100*pod.growTicks/crop.growTicks));
      return `<div class="card" style="text-align:center;">
        <div style="font-size:20px;">${crop.icon}</div>
        <div style="font-size:9px; color:${crop.color}; margin:4px 0;">${crop.name} — growing</div>
        <div class="barwrap"><div class="barfill" style="width:${pct}%; background:${crop.color};"></div></div>
        <div style="font-size:8px; color:var(--ink-dim); margin-top:3px;">${pod.growTicks}/${crop.growTicks} ticks</div>
      </div>`;
    }
    if(pod.state === 'ready'){
      return `<div class="card" style="text-align:center; border-color:var(--phosphor);">
        <div style="font-size:22px;">${crop.icon}</div>
        <div style="font-size:9px; color:var(--phosphor); margin:4px 0;">${crop.name} — ready!</div>
        <button class="btn btn-primary" style="width:100%; padding:5px; font-size:9.5px;" data-harvest="${i}">🌾 Harvest</button>
      </div>`;
    }
    // withered
    return `<div class="card" style="text-align:center; opacity:.6;">
      <div style="font-size:20px;">🥀</div>
      <div style="font-size:9px; color:var(--crimson); margin:4px 0;">${crop.name} — withered</div>
      <button class="btn" style="width:100%; padding:5px; font-size:9.5px;" data-clear="${i}">Clear Pod</button>
    </div>`;
  }

  function wireFarmPodButtons(screenEl){
    screenEl.querySelectorAll('[data-plant-select]').forEach(sel=>{
      sel.addEventListener('change', ()=>{
        const i = parseInt(sel.getAttribute('data-plant-select'),10);
        if(sel.value) plantSeed(i, sel.value);
      });
    });
    screenEl.querySelectorAll('[data-charge]').forEach(btn=>{
      btn.addEventListener('click', ()=>chargePod(parseInt(btn.getAttribute('data-charge'),10)));
    });
    screenEl.querySelectorAll('[data-harvest]').forEach(btn=>{
      btn.addEventListener('click', ()=>harvestPod(parseInt(btn.getAttribute('data-harvest'),10)));
    });
    screenEl.querySelectorAll('[data-clear]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = parseInt(btn.getAttribute('data-clear'),10);
        state.farm.pods[i] = {cropId:null, state:'empty', growTicks:0, chargedAtTick:0, readyAtTick:0};
        render();
      });
    });
  }

  function upgradeFarm(){
    const nextIndex = (state.farm.tierIndex||0) + 1;
    const nextTier = FARM_TIERS[nextIndex];
    if(!nextTier || state.bits < nextTier.cost) return;
    state.bits -= nextTier.cost;
    state.farm.tierIndex = nextIndex;
    while(state.farm.pods.length < nextTier.podCount){
      state.farm.pods.push({cropId:null, state:'empty', growTicks:0, chargedAtTick:0, readyAtTick:0});
    }
    logMsg(`Upgraded to ${nextTier.name}! ${nextTier.podCount} Grow-Pods now available.`);
    render();
  }

  function buySeed(cropId){
    const crop = CROPS[cropId];
    if(!crop || state.bits < crop.seedPrice) return;
    state.bits -= crop.seedPrice;
    state.inventory.seeds[cropId] = (state.inventory.seeds[cropId]||0) + 1;
    logMsg(`Bought a ${crop.name} seed.`);
    render();
  }

  function plantSeed(podIndex, cropId){
    const pod = state.farm.pods[podIndex];
    const crop = CROPS[cropId];
    if(!pod || pod.state !== 'empty' || !crop) return;
    if((state.inventory.seeds[cropId]||0) <= 0) return;
    state.inventory.seeds[cropId]--;
    pod.cropId = cropId;
    pod.state = 'planted';
    pod.growTicks = 0;
    logMsg(`Planted a ${crop.name} seed. Charge the pod to start it growing.`);
    render();
  }

  function chargePod(podIndex){
    const pod = state.farm.pods[podIndex];
    if(!pod || pod.state !== 'planted') return;
    pod.state = 'growing';
    pod.chargedAtTick = state.ticks||0;
    logMsg(`Charged the pod — ${CROPS[pod.cropId].name} is growing.`);
    render();
  }

  // Shared by the manual Harvest button and the Auto-Harvester: collects one ripe pod and returns
  // {crop, bits, item, amount} (or null if the pod isn't ready).
  function collectPod(podIndex){
    const pod = state.farm.pods[podIndex];
    if(!pod || pod.state !== 'ready') return null;
    const crop = CROPS[pod.cropId];
    const out = { crop, bits:0, item:null, amount:0 };
    if(crop.yieldBits){ state.bits += crop.yieldBits; out.bits = crop.yieldBits; }
    else if(crop.yieldItem){ state.inventory[crop.yieldItem] = (state.inventory[crop.yieldItem]||0) + crop.yieldAmount; out.item = crop.yieldItem; out.amount = crop.yieldAmount; }
    state.farm.pods[podIndex] = {cropId:null, state:'empty', growTicks:0, chargedAtTick:0, readyAtTick:0};
    questEvent('harvest', 1);
    return out;
  }
  function harvestPod(podIndex){
    const r = collectPod(podIndex);
    if(!r) return;
    if(r.bits) logMsg(`Harvested ${r.crop.name} — +◈${r.bits} Bits!`);
    else logMsg(`Harvested ${r.crop.name} — +${r.amount} ${SHOP_ITEMS.find(s=>s.id===r.item)?.name || r.item}!`);
    render();
  }

  function farmCounts(){
    const c = { ready:0, withered:0, empty:0, growing:0 };
    state.farm.pods.forEach(p => { if(p.state==='ready') c.ready++; else if(p.state==='withered') c.withered++; else if(p.state==='empty') c.empty++; else c.growing++; });
    return c;
  }
  function harvestAll(){
    if(!farmAuto().harvester) return null;
    const sum = { harvested:0, cleared:0, bits:0, items:{} };
    state.farm.pods.forEach((pod, i) => {
      if(pod.state === 'ready'){
        const r = collectPod(i); if(!r) return;
        sum.harvested++; sum.bits += r.bits;
        if(r.item) sum.items[r.item] = (sum.items[r.item]||0) + r.amount;
      } else if(pod.state === 'withered'){
        state.farm.pods[i] = {cropId:null, state:'empty', growTicks:0, chargedAtTick:0, readyAtTick:0};
        sum.cleared++;
      }
    });
    return sum;
  }
  function plantAllPods(cropId){
    if(!farmAuto().drill) return null;
    const crop = CROPS[cropId];
    if(!crop) return null;
    let planted = 0;
    state.farm.pods.forEach(pod => {
      if(pod.state !== 'empty' || (state.inventory.seeds[cropId]||0) <= 0) return;
      state.inventory.seeds[cropId]--;
      pod.cropId = cropId; pod.state = 'growing'; pod.growTicks = 0; pod.chargedAtTick = state.ticks||0; pod.readyAtTick = 0;
      planted++;
    });
    return { planted, crop };
  }
  function autoRestock(cropId, wanted){
    const crop = CROPS[cropId];
    if(!crop || !crop.seedPrice) return 0;
    const have = state.inventory.seeds[cropId]||0;
    const need = Math.max(0, wanted - have);
    const afford = Math.min(need, Math.floor(state.bits / crop.seedPrice));
    state.bits -= afford * crop.seedPrice;
    state.inventory.seeds[cropId] = have + afford;
    return afford;
  }
  function runAutopilot(){
    const a = farmAuto();
    if(!a.autopilot) return null;
    const cropId = CROPS[a.seed] ? a.seed : 'bitshoot';
    const h = harvestAll();
    const empties = farmCounts().empty;
    const bought = autoRestock(cropId, empties);
    const pl = plantAllPods(cropId);
    return { harvested:h.harvested, cleared:h.cleared, bits:h.bits, items:h.items, bought, planted:pl.planted, spent: bought * (CROPS[cropId].seedPrice||0), crop:CROPS[cropId] };
  }
  function itemSummary(items){
    return Object.keys(items).map(id => `${items[id]} ${SHOP_ITEMS.find(x=>x.id===id)?.name || id}`).join(', ');
  }
  function buyAutomation(id){
    const def = FARM_AUTOMATION[id], a = farmAuto();
    if(!def || !farmAutoUnlocked() || a[id] || state.bits < def.price) return false;
    if((def.requires||[]).some(r => !a[r])) return false;
    state.bits -= def.price;
    a[id] = true;
    logMsg(`${def.icon} ${def.name} installed! Find its button on the Farm screen.`);
    return true;
  }

  function farmAutomationHtml(){
    const a = farmAuto(), unlocked = farmAutoUnlocked(), c = farmCounts();
    const boost = state.farm.boostTicks||0;
    const boostLine = `<div style="font-size:9.5px; color:${boost>0?'var(--phosphor)':'var(--ink-dim)'}; margin-bottom:6px;">🚀 Pod Overclock: ${boost>0 ? boost+' ticks of double growth left' : 'inactive'}${(state.inventory.podOverclock||0)>0 ? ` <button class="btn btn-cyan" style="padding:2px 8px; font-size:9px; margin-left:4px;" data-use-farm="podOverclock">Use (x${state.inventory.podOverclock})</button>` : ''}</div>`;
    if(!unlocked){
      return `<div class="card" style="margin-bottom:10px; border-color:var(--cyan);">
        <div style="color:var(--cyan); margin-bottom:4px;">🤖 Automation</div>
        ${boostLine}
        <div style="font-size:9.5px; color:var(--ink-dim);">Locked. Build out the farm to the <b>${FARM_TIERS[FARM_TIERS.length-1].name}</b> to unlock one-button machines: ${Object.values(FARM_AUTOMATION).map(d=>`${d.icon} ${d.name} (◈${d.price.toLocaleString()})`).join(', ')}.</div>
      </div>`;
    }
    const cropOpts = Object.values(CROPS).filter(cr => cr.seedPrice != null || (state.inventory.seeds[cr.id]||0) > 0)
      .map(cr => `<option value="${cr.id}" ${a.seed===cr.id?'selected':''}>${cr.icon} ${cr.name} (${state.inventory.seeds[cr.id]||0} owned${cr.seedPrice?`, ◈${cr.seedPrice}`:''})</option>`).join('');
    const machine = (id) => {
      const d = FARM_AUTOMATION[id];
      const reqMissing = (d.requires||[]).filter(r => !a[r]);
      if(a[id]) return `<div style="font-size:9.5px; color:var(--phosphor);">✓ ${d.icon} ${d.name} installed</div>`;
      return `<div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
        <div><div style="font-size:10px; color:var(--amber);">${d.icon} ${d.name} <span class="badge">◈${d.price.toLocaleString()}</span></div>
        <div style="font-size:9px; color:var(--ink-dim);">${d.desc}${reqMissing.length?` <span style="color:var(--crimson);">Requires: ${reqMissing.map(r=>FARM_AUTOMATION[r].name).join(' + ')}.</span>`:''}</div></div>
        <button class="btn btn-amber" style="padding:5px 9px; font-size:10px; flex-shrink:0;" data-buy-auto="${id}" ${(state.bits<d.price||reqMissing.length)?'disabled':''}>Install</button>
      </div>`;
    };
    const emptyAfter = c.empty + c.ready + c.withered;
    const cropSel = CROPS[a.seed] || CROPS.bitshoot;
    const estCost = cropSel.seedPrice ? Math.max(0, emptyAfter - (state.inventory.seeds[cropSel.id]||0)) * cropSel.seedPrice : 0;
    return `<div class="card" style="margin-bottom:10px; border-color:var(--cyan);">
      <div style="color:var(--cyan); margin-bottom:4px;">🤖 Automation</div>
      ${boostLine}
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${machine('harvester')}${machine('drill')}${machine('autopilot')}
      </div>
      ${(a.drill || a.autopilot) ? `<div style="margin-top:8px;"><div style="font-size:9px; color:var(--ink-dim); margin-bottom:3px;">Seed to plant</div>
        <select id="auto-seed" style="width:100%; font-size:9.5px; background:#0a1f14; color:var(--ink); border:1px solid var(--phosphor-dim); border-radius:5px; padding:4px;">${cropOpts}</select></div>` : ''}
      ${(a.harvester || a.drill || a.autopilot) ? `<div style="display:flex; flex-direction:column; gap:6px; margin-top:8px;">
        ${a.harvester ? `<button class="btn btn-primary" id="auto-harvest" style="padding:8px; font-size:10.5px;" ${(c.ready+c.withered)?'':'disabled'}>🚜 Harvest All — ${c.ready} ripe${c.withered?`, clear ${c.withered} withered`:''}</button>` : ''}
        ${a.drill ? `<button class="btn btn-primary" id="auto-plant" style="padding:8px; font-size:10.5px;" ${(c.empty && (state.inventory.seeds[cropSel.id]||0)>0)?'':'disabled'}>🛠 Plant All — ${c.empty} empty pod${c.empty===1?'':'s'} · ${state.inventory.seeds[cropSel.id]||0} ${cropSel.name} seeds</button>` : ''}
        ${a.autopilot ? `<button class="btn btn-amber" id="auto-cycle" style="padding:8px; font-size:10.5px;">🤖 Run Autopilot Cycle${estCost?` — restock ≈ ◈${estCost.toLocaleString()}`:''}</button>` : ''}
      </div>` : ''}
    </div>`;
  }
  function wireFarmAutomation(screenEl){
    screenEl.querySelectorAll('[data-buy-auto]').forEach(btn => btn.addEventListener('click', ()=>{

    const hb = screenEl.querySelector('#auto-harvest');
    if(hb) hb.addEventListener('click', ()=>{
      const r = harvestAll(); if(!r) return;

      render();
    });
    const pb = screenEl.querySelector('#auto-plant');
    if(pb) pb.addEventListener('click', ()=>{

    });

      render();
    });
  }


  /* ---------------------------------------------------------
     MINE SHAFT
  --------------------------------------------------------- */
  function isMiningUnlocked(){ return state.legacyUnlockAll || state.bossDefeated.filter(Boolean).length >= 2; }

  function generateMine(){
    const grid = [];
    for(let row=0; row<MINE_MAX_DEPTH; row++){
      const rowCells = [];
      for(let col=0; col<MINE_WIDTH; col++){
        // Deeper rock is tougher: 1 hit near the surface, up to 4 hits far down.
        const hitsRequired = Math.min(4, 1 + Math.floor(row/12));
        rowCells.push({ role: rollMineRole(Math.random), dug: row===0, hitsTaken: row===0 ? hitsRequired : 0, hitsRequired });
      }
      grid.push(rowCells);
    }
    const startCol = Math.floor(MINE_WIDTH/2);
    grid[0][startCol] = {role:'empty', dug:true, hitsTaken:1, hitsRequired:1};
    return { grid, px:startCol, py:0, maxDepthThisDive:0 };
  }

  function enterMineCell(x,y){
    state.mine.px = x; state.mine.py = y;
    state.mine.maxDepthThisDive = Math.max(state.mine.maxDepthThisDive, y);
    const prevRecord = state.mineDepthRecord||0;
    if(y > prevRecord){
      const prevMilestone = Math.floor(prevRecord/10);
      const newMilestone = Math.floor(y/10);
      if(newMilestone > prevMilestone && newMilestone > 0){
        const depthAtMilestone = newMilestone*10;
        const bonus = 50 + depthAtMilestone;
        state.bits += bonus;
        state.mine.pendingMilestone = depthAtMilestone;
        logMsg(`⚡ New depth record: ${depthAtMilestone}m! +◈${bonus} Bits.`);
      }
    }
    state.mineDepthRecord = Math.max(prevRecord, y);
  }

  function mineAction(dx,dy){
    const mine = state.mine;
    if(!mine) return;
    const nx = mine.px+dx, ny = mine.py+dy;
    if(nx<0 || nx>=MINE_WIDTH || ny<0 || ny>=mine.grid.length) return;
    const cell = mine.grid[ny][nx];
    const p = getActive();
    if(p.hunger <= 0){
      logMsg(`${getForm(p).name} is too exhausted to keep digging.`);
      render(); return;
    }
    if(cell.dug){
      enterMineCell(nx, ny);
      p.hunger = Math.max(0, p.hunger - 1);
      advanceTick();
      render();
      return;
    }
    // Every hit costs a tick and a bit of Hunger, whether or not it's the
    // one that breaks through — deeper rock takes more hits (up to 4), so
    // digging down is a real time/resource cost, not a single free tap.
    cell.hitsTaken = Math.min(cell.hitsRequired, (cell.hitsTaken||0) + (hasModule(p,'drillBit') ? 2 : 1));
    p.hunger = Math.max(0, p.hunger - 1);
    advanceTick();
    if(cell.hitsTaken < cell.hitsRequired){
      logMsg(`Chipping away... (${cell.hitsTaken}/${cell.hitsRequired})`);
      render();
      return;
    }
    cell.dug = true;
    questEvent('dig', 1);
    const depth = ny;
    switch(cell.role){
      case 'rock':
        if(Math.random() < 0.2){ const bits = 2+Math.floor(depth/3); state.bits += bits; logMsg(`Purged a dead sector — recovered a trace of ◈${bits} Bits.`); }
        else logMsg('Purged a dead sector.');
        enterMineCell(nx, ny);
        break;
      case 'ore': {
        const bits = 15 + depth*2 + Math.floor(Math.random()*10);
        state.bits += bits;
        logMsg(`Decrypted a data vein — +◈${bits} Bits!`);
        enterMineCell(nx, ny);
        break;
      }
      case 'treasure': {
        const bits = 40 + depth*3;
        state.bits += bits;
        logMsg(`Cracked an encrypted cache — +◈${bits} Bits!`);
        enterMineCell(nx, ny);
        break;
      }
      case 'seedCache':
        state.inventory.seeds.deepweed = (state.inventory.seeds.deepweed||0) + 1;
        logMsg('Found a Deepweed spore cache — this strain isn\'t sold anywhere.');
        enterMineCell(nx, ny);
        break;
      case 'gearDrop': {
        const gearIds = Object.keys(GEAR_ITEMS);
        const gearId = gearIds[Math.floor(Math.random()*gearIds.length)];
        const gear = GEAR_ITEMS[gearId];
        state.inventory.gear[gearId] = (state.inventory.gear[gearId]||0) + 1;
        if(!state.gearSeen) state.gearSeen = {};
        state.gearSeen[gearId] = true;
        enterMineCell(nx, ny);
        logMsg(`Salvaged a component: ${gear.icon} ${gear.name}!`);
        // Gear is the rarest find down here — worth a real moment, not just
        // a log line. Reuses the transition system for a celebratory flash.
        playTransition(`⚙ COMPONENT SALVAGED<br><span style="font-size:20px;">${gear.icon}</span><br>${gear.name}`, 'var(--violet)', ()=>{ render(); }, 900);
        return;
      }
      case 'monster':
        enterMineCell(nx, ny);
        startMineEncounter(depth);
        return; // startMineEncounter handles its own render via playTransition
    }
    render();
  }

  function startMineEncounter(depth){
    const p = getActive();
    const pool = minePool(); // roamers + 'mine' habitat species turn up underground
    const lineId = pool[Math.floor(Math.random()*pool.length)];
    const lvl = Math.max(1, Math.round(p.level*0.6 + depth*0.9 + Math.floor(Math.random()*3)));
    const enemy = newMonster(lineId, 1, lvl);
    // Depth adds a flat stat multiplier on top of level scaling — same
    // technique biome bosses and anomalies already use — so a deep rogue
    // process is meaningfully tougher per-level, not just numerically
    // higher-leveled. Caps at +60% around 60m so it stays winnable.
    const depthMult = 1 + Math.min(0.6, depth*0.01);
    enemy.maxHp = Math.round(enemy.maxHp*depthMult); enemy.hp = enemy.maxHp;
    enemy.str = Math.round(enemy.str*depthMult);
    enemy.def = Math.round(enemy.def*depthMult);
    enemy.spd = Math.round(enemy.spd*depthMult);
    enemy.isAmbush = true;
    const enemyName = getForm(enemy).name;
    dexMarkSeen(enemy.speciesId, enemy.stage);
    playTransition(`⚠ CORRUPTION DETECTED<br>A rogue process —<br>${enemyName} — boots up!`, 'var(--crimson)', ()=>{
      state.battle = { enemy, fled:false, over:false, isBoss:false, catchAttempted:false, source:'mine', ambush:true };
      state.screen = 'battle';
      logMsg(`A rogue ${enemyName} process ambushed you at depth ${depth}m!`);
      enemyTurn(); // ambush: the foe gets a free first strike before you can act
      render();
    });
  }

  // A directional hint toward the nearest undiscovered high-value tile
  // within a short radius — flavored as a signal scanner rather than true
  // x-ray vision, giving mining a "hot/cold" search feel.
  function scanNearbyPOI(mine, radius){
    let best = null, bestDist = Infinity;
    for(let dy=-radius; dy<=radius; dy++){
      for(let dx=-radius; dx<=radius; dx++){
        if(dx===0 && dy===0) continue;
        const x = mine.px+dx, y = mine.py+dy;
        if(x<0||x>=MINE_WIDTH||y<0||y>=mine.grid.length) continue;
        const c = mine.grid[y][x];
        if(c.dug) continue;
        if(c.role==='gearDrop' || c.role==='treasure'){
          const dist = Math.max(Math.abs(dx),Math.abs(dy));
          if(dist < bestDist){ bestDist = dist; best = {dx,dy,role:c.role}; }
        }
      }
    }
    return best;
  }
  function arrowFor(dx,dy){
    if(dx===0 && dy<0) return '↑'; if(dx===0 && dy>0) return '↓';
    if(dy===0 && dx<0) return '←'; if(dy===0 && dx>0) return '→';
    if(dx<0 && dy<0) return '↖'; if(dx>0 && dy<0) return '↗';
    if(dx<0 && dy>0) return '↙'; return '↘';
  }

  function renderMine(screenEl, controlsEl){
    if(!isMiningUnlocked()){ state.screen='town'; render(); return; }

    if(!state.mine){
      screenEl.innerHTML = `
        ${screenTitle('⛏ DATA MINE', 'var(--amber)')}
        <div class="card" style="margin-bottom:10px;">
          <div style="font-size:10.5px; color:var(--ink-dim); line-height:1.6;">
            Excavate a raw data column, sector by sector. Disconnecting any time pauses your dive exactly where you are — reconnect later and pick up right where you left off. Only fainting or abandoning the dive resets it. The deeper you dig, the tougher the rogue processes get — and the better the salvage.
          </div>
        </div>
        <div style="font-size:10.5px; color:var(--amber); margin-bottom:10px;">🏆 Deepest reach: ${state.mineDepthRecord||0}m</div>
        <button class="btn btn-primary" id="descend" style="width:100%; padding:10px;">⛏ Begin Excavation</button>
      `;
      controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
      controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
      screenEl.querySelector('#descend').addEventListener('click', ()=>{
        playTransition('Establishing<br>data connection...', 'var(--amber)', ()=>{
          state.mine = generateMine();
          render();
        });
      });
      return;
    }

    const mine = state.mine;
    const cell = 26;
    const VIEW_RADIUS = 4;
    const viewSize = VIEW_RADIUS*2+1;
    const ROLE_GLYPH = {
      rock: {bg:'#241a12', glyph:'▪', col:'#8a6a4a'},
      ore: {bg:'#241a12', glyph:'◆', col:'#ffb347'},
      treasure: {bg:'#1c1206', glyph:'¤', col:'#ffd93d'},
      seedCache: {bg:'#12241a', glyph:'❀', col:'#8bffa0'},
      gearDrop: {bg:'#1a1224', glyph:'⚙', col:'#a06bff'},
      monster: {bg:'#241212', glyph:'?', col:'#ff4d5e'},
      empty: {bg:'#04120b', glyph:'·', col:'#2a5a3e'},
    };
    let grid = `<div style="display:grid; grid-template-columns:repeat(${viewSize},${cell}px); grid-template-rows:repeat(${viewSize},${cell}px); gap:1px; justify-content:center; margin:4px auto;">`;
    for(let vy=0; vy<viewSize; vy++){
      for(let vx=0; vx<viewSize; vx++){
        const x = mine.px - VIEW_RADIUS + vx;
        const y = mine.py - VIEW_RADIUS + vy;
        const inBounds = x>=0 && x<MINE_WIDTH && y>=0 && y<mine.grid.length;
        let bg='#000', glyph='', col='#000';
        if(inBounds){
          const c = mine.grid[y][x];
          if(!c.dug){
            const progress = (c.hitsTaken||0) / (c.hitsRequired||1);
            if(progress > 0){ bg='#1a1410'; glyph='▒'; col='#8a7a5a'; } // cracked, in progress
            else { bg='#0a0a0a'; glyph='▓'; col='#3a3a3a'; }
          }
          else{ const info = ROLE_GLYPH[c.role] || ROLE_GLYPH.empty; bg=info.bg; glyph=info.glyph; col=info.col; }
        }
        const isPlayer = (vx===VIEW_RADIUS && vy===VIEW_RADIUS);
        grid += `<div class="tile" style="background:${bg};color:${col};">${isPlayer ? '<span style="color:var(--amber);text-shadow:0 0 6px var(--amber);">◉</span>' : glyph}</div>`;
      }
    }
    grid += '</div>';

    const poi = scanNearbyPOI(mine, 3);
    const radarLine = poi
      ? `📡 <span style="color:var(--violet);">Signal detected ${arrowFor(poi.dx,poi.dy)}</span> — ${poi.role==='gearDrop'?'component':'cache'} nearby`
      : `📡 <span style="color:var(--ink-dim);">No signal within range</span>`;

    const milestone = mine.pendingMilestone;
    mine.pendingMilestone = null;

    screenEl.innerHTML = `
      ${screenTitle('⛏ DATA MINE', 'var(--amber)')}
      ${milestone ? `<div class="card" style="margin-bottom:6px; border-color:var(--phosphor); text-align:center;">
        <div class="pixel-font glow" style="color:var(--phosphor); font-size:11px;">⚡ NEW DEPTH RECORD: ${milestone}m ⚡</div>
        <div style="font-size:9px; color:var(--ink-dim); margin-top:2px;">+◈${50 + milestone} Bits for the milestone</div>
      </div>` : ''}
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:2px; text-align:center;">Depth: ${mine.py}m · Best: ${state.mineDepthRecord||0}m · ▓ undug</div>
      <div style="font-size:9.5px; margin-bottom:4px; text-align:center;">${radarLine}</div>
      ${grid}
      <div style="font-size:10.5px; color:var(--ink-dim); margin-top:6px; text-align:center;">${state.log[0]||''}</div>
    `;

    const dirLabel = (dx,dy) => {
      const nx = mine.px+dx, ny = mine.py+dy;
      if(nx<0||nx>=MINE_WIDTH||ny<0||ny>=mine.grid.length) return {label:'—', disabled:true, hint:''};
      const c = mine.grid[ny][nx];
      if(c.dug) return {label:'Move', disabled:false, hint:''};
      const remaining = (c.hitsRequired||1) - (c.hitsTaken||0);
      return {label:'Dig', disabled:false, hint: c.hitsRequired>1 ? String(remaining) : ''};
    };
    const up = dirLabel(0,-1), down = dirLabel(0,1), left = dirLabel(-1,0), right = dirLabel(1,0);
    const btnLabel = (d) => d.label==='Dig' ? `⛏${d.hint?`<span style="font-size:8px;">${d.hint}</span>`:''}` : '▲';
    controlsEl.innerHTML = `
      <div class="wild-controls">
        <div class="dpad-grid dpad-sm">
          <div></div><button class="dpad-btn btn" id="mn-up" ${up.disabled?'disabled':''}>${up.label==='Dig'?btnLabel(up):'▲'}</button><div></div>
          <button class="dpad-btn btn" id="mn-left" ${left.disabled?'disabled':''}>${left.label==='Dig'?btnLabel(left):'◀'}</button>
          <div></div>
          <button class="dpad-btn btn" id="mn-right" ${right.disabled?'disabled':''}>${right.label==='Dig'?btnLabel(right):'▶'}</button>
          <div></div><button class="dpad-btn btn" id="mn-down" ${down.disabled?'disabled':''}>${down.label==='Dig'?btnLabel(down):'▼'}</button><div></div>
        </div>
        <div class="mine-side">
          <button class="btn btn-cyan" id="mn-disconnect" title="Disconnect — pauses, keeps your progress">🔌 Disconnect</button>
          <button class="btn btn-crimson" id="mn-abandon">🗑 Abandon</button>
        </div>
      </div>
    `;
    controlsEl.querySelector('#mn-up').addEventListener('click', ()=>mineAction(0,-1));
    controlsEl.querySelector('#mn-down').addEventListener('click', ()=>mineAction(0,1));
    controlsEl.querySelector('#mn-left').addEventListener('click', ()=>mineAction(-1,0));
    controlsEl.querySelector('#mn-right').addEventListener('click', ()=>mineAction(1,0));
    const disconnect = () => { state.screen = 'town'; logMsg('Disconnected — your dive is paused, not lost. Reconnect any time.'); render(); };
    controlsEl.querySelector('#mn-disconnect').addEventListener('click', disconnect);
        controlsEl.querySelector('#mn-abandon').addEventListener('click', ()=>{
      showConfirmModal('Abandon this dive? You\'ll lose this excavation and start fresh from the surface next time — but your deepest-reach record stays.', ()=>{
        state.mine = null; state.screen = 'town';
        logMsg('Dive abandoned.');
        render();
      });
    });
  }


  /* ---------------------------------------------------------
     SHARED TIMING MINIGAME ENGINE (used by Play and Job attempts)
  --------------------------------------------------------- */
  let tgGen = 0;
  // One clock for the whole session: Play uses it so re-entering the screen (every tap re-renders)
  // can never re-roll the marker's starting position.
  const TG_CLOCK = { speed: 220 + Math.random()*80, phase: Math.random()*Math.PI*2 };
  let tgMarkerEl = null;

  function trackGradient(greatHalf, goodHalf){
    const a = Math.max(0, 50-goodHalf), b = Math.max(0, 50-greatHalf), c = Math.min(100, 50+greatHalf), d = Math.min(100, 50+goodHalf);
    return `linear-gradient(90deg, #2a0a12 0%, #2a0a12 ${a}%, #3a2a10 ${a}%, #3a2a10 ${b}%, #123722 ${b}%, #123722 ${c}%, #3a2a10 ${c}%, #3a2a10 ${d}%, #2a0a12 ${d}%, #2a0a12 100%)`;
  }

  // cfg: {title, accent, headerHtml, hint, greatHalf, goodHalf, tapLabel, backLabel, onTap(pct), onBack}
  function mountTimingGame(screenEl, controlsEl, cfg){
    screenEl.innerHTML = `
      ${screenTitle(cfg.title, cfg.accent)}
      ${cfg.headerHtml || ''}
      <div style="font-size:10px; color:var(--ink-dim); text-align:center; margin-bottom:10px;">${cfg.hint}</div>
      <div style="position:relative; height:36px; border-radius:8px; overflow:hidden; border:1px solid var(--glass-border); margin-bottom:14px; background:${trackGradient(cfg.greatHalf, cfg.goodHalf)};">
        <div id="tg-marker" data-pct="50" style="position:absolute; top:-4px; left:50%; width:3px; height:44px; background:var(--phosphor); box-shadow:0 0 8px var(--phosphor); transform:translateX(-50%);"></div>
      </div>
      <div style="text-align:center; font-size:11px; color:var(--ink-dim); min-height:34px;">${state.log[0] || ''}</div>
    `;
    controlsEl.innerHTML = `
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <button class="btn btn-primary" id="tg-tap">👆 ${cfg.tapLabel || 'Catch!'}</button>
        <button class="btn" id="tg-back">${cfg.backLabel || '← Back'}</button>
      </div>`;
    controlsEl.querySelector('#tg-back').addEventListener('click', cfg.onBack);
    controlsEl.querySelector('#tg-tap').addEventListener('click', ()=>{
      const pct = parseFloat(tgMarkerEl ? tgMarkerEl.getAttribute('data-pct') : '50');
      cfg.onTap(pct);
    });

    tgGen++;
    const myGen = tgGen;
    tgMarkerEl = screenEl.querySelector('#tg-marker');
    const startTs = performance.now();
    const speed = cfg.continuous ? TG_CLOCK.speed : 220 + Math.random()*80;
    const phase = cfg.continuous ? TG_CLOCK.phase : Math.random()*Math.PI*2;
    function tick(ts){
      if(myGen !== tgGen) return;
      if(!tgMarkerEl || !document.body.contains(tgMarkerEl)) return;
      const elapsed = cfg.continuous ? ts : ts - startTs;
      const pct = 50 + 46*Math.sin(phase + elapsed/speed);
      tgMarkerEl.style.left = pct + '%';
      tgMarkerEl.setAttribute('data-pct', pct.toFixed(2));
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ---------------------------------------------------------
     PLAY MINIGAME
  --------------------------------------------------------- */
  // Play: every try costs Energy and Hunger (hit or miss), and a few tries in a row put the partner
  // on a break that only shortens while exploring (same idea as Jobs/Training). It pays Bits and XP
  // only; it never restores Hunger or Energy, so it can't be spammed as a free source of either.
  const PLAY_ENERGY_COST = 6;
  const PLAY_HUNGER_COST = 3;
  const PLAY_COOLDOWN_STEP = 8;   // ticks added per try
  const PLAY_COOLDOWN_MAX = 24;   // at this many ticks the partner needs a break (3 tries in a row)
  function renderPlay(screenEl, controlsEl){
    const p = getActive();
    const sp = getForm(p);
    const triesLeft = Math.max(0, Math.ceil((PLAY_COOLDOWN_MAX - (p.playCooldown||0)) / PLAY_COOLDOWN_STEP));
    mountTimingGame(screenEl, controlsEl, {
      title: '🎮 PLAYTIME',
      accent: 'var(--violet)',
      headerHtml: `<div style="text-align:center; margin-bottom:10px;">${spriteImgHtml(p,56)}<div style="color:${sp.color}; margin-top:4px;">${p.nickname||sp.name} wants to play!</div></div>`,
      hint: `Tap Catch when the marker is in the bright green zone. Every try costs ${PLAY_ENERGY_COST} Energy and ${PLAY_HUNGER_COST} Hunger, hit or miss. ${triesLeft > 0 ? `Tries before a break: ${triesLeft}.` : 'Needs a break — explore to recover.'}`,
      greatHalf: 8, goodHalf: 22,
      tapLabel: 'Catch!',
      backLabel: '← Back to Town',
      continuous: true,
      onBack: ()=>{ state.screen='town'; render(); },
      onTap: (pct)=>{
        if((p.playCooldown||0) >= PLAY_COOLDOWN_MAX){ logMsg(`${getForm(p).name} needs a break — explore a bit to recover before playing again.`); render(); return; }
        if(p.energy < PLAY_ENERGY_COST){ logMsg(`${getForm(p).name} is too tired to play — rest first.`); render(); return; }
        const dist = Math.abs(pct - 50);
        let tier, bits=0, xp=0;
        if(dist <= 8){ tier='GREAT'; bits=12; xp=6; }
        else if(dist <= 22){ tier='GOOD'; bits=5; xp=2; }
        else { tier='MISS'; }
        p.energy = Math.max(0, p.energy - PLAY_ENERGY_COST);
        p.hunger = Math.max(0, p.hunger - PLAY_HUNGER_COST);
        p.playCooldown = (p.playCooldown||0) + PLAY_COOLDOWN_STEP;
        state.bits += bits;
        if(xp) gainXp(p, xp);
        const tierMsg = tier==='GREAT' ? 'Perfect catch!' : (tier==='GOOD' ? 'Nice catch!' : 'Missed it!');
        logMsg(`${tierMsg} ${getForm(p).name} played.${bits?` +◈${bits} Bits`:' No reward.'} -${PLAY_ENERGY_COST} Energy, -${PLAY_HUNGER_COST} Hunger.`);
        render();
      }
    });
  }

  /* ---------------------------------------------------------
     JOB ATTEMPT (stat-influenced timing check)
  --------------------------------------------------------- */
  function renderJobAttempt(screenEl, controlsEl){
    const att = state.jobAttempt;
    if(!att){ state.screen='jobs'; render(); return; }
    const m = state.storage.find(x => x.uid === att.uid);
    const job = JOBS.find(j => j.id === att.jobId);
    if(!m || !job){ state.jobAttempt = null; state.screen = 'jobs'; render(); return; }
    const sp = getForm(m);
    const statVal = jobStatValue(m, job);
    const greatHalf = Math.min(20, 6 + statVal*0.35);
    const goodHalf = greatHalf + 14;

    mountTimingGame(screenEl, controlsEl, {
      title: `${job.icon} ${job.name.toUpperCase()}`,
      accent: job.color,
      headerHtml: `<div style="text-align:center; margin-bottom:10px;">${spriteImgHtml(m,56)}<div style="color:${sp.color}; margin-top:4px;">${m.nickname||sp.name} is on the job</div></div>`,
      hint: `Tap when the marker is in the zone. Higher ${job.stat.toUpperCase()} widens the green zone.`,
      greatHalf, goodHalf,
      tapLabel: 'Work!',
      backLabel: '← Back to Board',
      onBack: ()=>{ state.jobAttempt = null; state.screen = 'jobs'; render(); },
      onTap: (pct)=>{
        const dist = Math.abs(pct - 50);
        let tier, bits=0, xp=0;
        if(dist <= greatHalf){ tier='GREAT'; bits = Math.round(10 + statVal*1.5); xp = Math.round(4 + statVal*0.3); }
        else if(dist <= goodHalf){ tier='GOOD'; bits = Math.round(5 + statVal*0.7); xp = 2; }
        else { tier='MISS'; bits = 0; xp = 0; }
        m.energy = Math.max(0, m.energy - JOB_ENERGY_COST);
        m.hunger = Math.max(0, m.hunger - JOB_HUNGER_COST);
        m.jobCooldown = JOB_COOLDOWN_BY_TIER[tier];
        questEvent('job', 1);
        state.bits += bits;
        if(xp) gainXp(m, xp);
        const tierMsg = tier==='GREAT' ? 'Excellent work!' : (tier==='GOOD' ? 'Solid effort.' : 'Fumbled the attempt.');
        logMsg(`${tierMsg} ${getForm(m).name} earned ◈${bits} Bits at ${job.name} — ${m.jobCooldown} ticks to recover.`);
        state.jobAttempt = null;
        state.screen = 'jobs';
        render();
      }
    });
  }

  function inheritIvs(a, b){
    const clamp = v => Math.max(IV_MIN, Math.min(IV_MAX, v));
    const mix = (k) => clamp(((a.ivs?a.ivs[k]:1) + (b.ivs?b.ivs[k]:1))/2 + (Math.random()*0.06 - 0.03));
    return { hp: mix('hp'), str: mix('str'), def: mix('def'), spd: mix('spd') };
  }
  function doBreed(){
    const br = state.breeding;
    const a = state.storage.find(m=>m.uid===br.a);
    const b = state.storage.find(m=>m.uid===br.b);
    if(!a||!b||state.bits<50) return;
    state.bits -= 50;
    const childSpecies = Math.random()<0.5 ? a.speciesId : b.speciesId;
    const gen = Math.max(a.gen,b.gen)+1;
    const child = newMonster(childSpecies, gen, 1, inheritIvs(a,b));
    state.storage.push(child);
    dexMarkCaught(child);
    logMsg(`A hybrid egg hatched: ${getForm(child).name} (Gen ${gen}, Potential ${potentialStars(child.ivs)})!`);
    state.breeding = {a:null,b:null};
    state.screen = 'storage';
    render();
  }

  --------------------------------------------------------- */
  let shopTab = 'supplies';
  function shopItemDef(id){
    const base = SHOP_ITEMS.find(i => i.id === id);
    if(base) return { id, name:base.name, price:base.price, desc:base.desc, icon:'' };
    const sup = SUPPLY_ITEMS[id];
    return sup ? { id, name:sup.name, price:sup.price, desc:sup.desc, icon:sup.icon, drive:sup.drive, cap:sup.cap } : null;
  }
  function buyShopItem(id){
    const def = shopItemDef(id);
    if(!def || state.bits < def.price) return;
    if(id === 'evoCrest'){
      const p = getActive();
      if((p.crestCount||0) >= EVO_CREST_CAP){ logMsg(`${getForm(p).name} has already hit the ${EVO_CREST_CAP}-crest limit.`); render(); return; }
      state.bits -= def.price;
      if(!p.crestBonus) p.crestBonus = {hp:0,str:0,def:0,spd:0};
      p.crestBonus.hp += 4; p.crestBonus.str += 2; p.crestBonus.def += 2; p.crestBonus.spd += 1;
      p.crestCount = (p.crestCount||0) + 1;
      recalcStats(p, true);
      logMsg(`Used an Evolution Crest (${p.crestCount}/${EVO_CREST_CAP}) — ${getForm(p).name}'s stats hardened permanently!`);
    } else {
      state.bits -= def.price;
      state.inventory[id] = (state.inventory[id]||0) + 1;
      logMsg(`Purchased ${def.name}.`);
    }
    render();
  }
  function buyModule(id){
    const def = MODULES[id];
    if(!def || state.bits < def.price) return;
    state.bits -= def.price;
    invModules().push(newModuleInstance(id));
    logMsg(`Purchased ${def.name}. Equip it from the Inventory or a partner's card in the Storage Box.`);
    render();
  }

  const INVENTORY_INFO = {
    trapSphere: {name:'Trap Sphere', icon:'◈',  desc:'Used automatically when you throw it in battle.', usableHere:false},
    primeMeat:  {name:'Prime Meat',  icon:'🍖', desc:'Fills hunger, restores a little energy.', usableHere:true},
    medicine:   {name:'Medicine',    icon:'🩹', desc:'Restores your active partner\'s HP to full.', usableHere:true},
    evoCrest:   {name:'Evolution Crest', icon:'🔷', desc:'Permanently hardens a partner\'s stats. Buy from the Shop — applies immediately on purchase.', usableHere:false},
  };

  function useItem(id){
    const p = getActive(), inv = state.inventory, nm = getForm(p).name;
    if((inv[id]||0) <= 0) return;
    const refuse = (msg) => { logMsg(msg); render(); };
    if(id === 'primeMeat'){
      inv.primeMeat--; p.hunger = Math.min(100, p.hunger + 40); p.energy = Math.min(100, p.energy + 8);
      logMsg(`Fed ${nm} a Prime Meat.`);
    } else if(id === 'medicine'){
      inv.medicine--; p.hp = p.maxHp;
      logMsg(`Used Medicine — ${nm}'s HP fully restored.`);
    } else if(id === 'nanoPatch'){
      if(p.hp >= p.maxHp) return refuse(`${nm} is already at full HP.`);
      inv.nanoPatch--;
      const heal = Math.max(1, Math.round(p.maxHp * 0.30));
      p.hp = Math.min(p.maxHp, p.hp + heal);
      logMsg(`Nano Patch restored ${heal} HP to ${nm}.`);
    } else if(id === 'chargeCell'){
      if(p.energy >= 100) return refuse(`${nm} is already fully charged.`);
      inv.chargeCell--; p.energy = Math.min(100, p.energy + 50);
      logMsg(`Charge Cell restored ${nm}'s Energy.`);
    } else if(id === 'primeSirloin'){
      if(p.hunger >= 100 && p.energy >= 100) return refuse(`${nm} has no need for that right now.`);
      inv.primeSirloin--; p.hunger = 100; p.energy = Math.min(100, p.energy + 25);
      logMsg(`${nm} devoured a Prime Sirloin — Hunger full.`);
    } else if(id === 'rebootKit'){
      if(p.hp >= p.maxHp && p.hunger >= 100 && p.energy >= 100) return refuse(`${nm} is already in perfect shape.`);
      inv.rebootKit--; p.hp = p.maxHp; p.hunger = 100; p.energy = 100;
      logMsg(`Reboot Kit — ${nm} is fully restored.`);
    } else if(id === 'expCapsule' || id === 'expCapsuleL'){
      inv[id]--;
      const xp = id === 'expCapsule' ? 250 : 1500;
      const before = p.level;
      gainXpCore(p, xp);
      logMsg(`${nm} absorbed ${xp} XP${p.level>before?` and reached level ${p.level}!`:'.'}`);
    } else if(SUPPLY_ITEMS[id] && SUPPLY_ITEMS[id].drive){
      const def = SUPPLY_ITEMS[id], key = def.drive;
      if(!p.driveBonus) p.driveBonus = {hp:0,str:0,def:0,spd:0};
      const cur = p.driveBonus[key]||0;
      if(cur >= def.cap) return refuse(`${nm} has already taken the maximum from ${def.name}s (+${def.cap}).`);
      inv[id]--;
      p.driveBonus[key] = Math.min(def.cap, cur + def.amount);
      recalcStats(p, false);
      logMsg(`${def.name} installed — ${nm} permanently gains +${p.driveBonus[key]-cur} ${key.toUpperCase()} (now +${p.driveBonus[key]}/${def.cap}).`);
    } else if(id === 'podOverclock'){
      inv.podOverclock--;
      state.farm.boostTicks = (state.farm.boostTicks||0) + 100;
      logMsg(`Pod Overclock engaged — pods grow at double speed for ${state.farm.boostTicks} ticks.`);
    } else { return; }
    render();
  }

          return `<div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
              <div style="color:${d.color}">${d.icon} ${d.name} <span class="badge">${x.ticksLeft!=null?x.ticksLeft+' ticks':(d.oneUse?'1 use':'permanent')}</span></div>

  function migrateMonster(m){
    if(m.stage === undefined || m.stage === null) m.stage = 1;
    if(!Array.isArray(m.movesKnown)) m.movesKnown = ['strike','pressurePoint'];
    if(!m.crestBonus) m.crestBonus = {hp:0,str:0,def:0,spd:0};
    if(typeof m.crestCount !== 'number'){
      // Best-effort inference for saves from before crests were tracked/capped —
      // existing bonuses are grandfathered in, only future purchases are capped.
      m.crestCount = Math.round((m.crestBonus.hp||0) / 4);
    }
    if(typeof m.xp !== 'number') m.xp = 0;
    if(typeof m.level !== 'number' || m.level < 1) m.level = 1;
    // Unknown species (e.g. a save from a build that had species this one lacks): don't
    // lose the identity — park it in missingSpeciesId and restore it once the species exists.
    if(m.missingSpeciesId && EVOLUTION_LINES[m.missingSpeciesId]){ m.speciesId = m.missingSpeciesId; delete m.missingSpeciesId; }
    if(!EVOLUTION_LINES[m.speciesId]){ m.missingSpeciesId = m.speciesId; m.speciesId = lineIds[0]; }
    if(m.stage > EVOLUTION_LINES[m.speciesId].length) m.stage = EVOLUTION_LINES[m.speciesId].length;
    if(m.cosmetic === undefined) m.cosmetic = null;
    if(!m.ivs) m.ivs = {hp:1,str:1,def:1,spd:1};
    if(!Array.isArray(m.ownedCosmetics)) m.ownedCosmetics = ['none'];
    if(!m.ownedCosmetics.includes('none')) m.ownedCosmetics.unshift('none');
    m.ownedCosmetics = m.ownedCosmetics.filter(id => COSMETICS.some(c=>c.id===id));
    if(m.cosmetic && !m.ownedCosmetics.includes(m.cosmetic)) m.ownedCosmetics.push(m.cosmetic);
    if(!m.driveBonus || typeof m.driveBonus !== 'object') m.driveBonus = {hp:0,str:0,def:0,spd:0};
    ['hp','str','def','spd'].forEach(k => { if(typeof m.driveBonus[k] !== 'number' || m.driveBonus[k] < 0) m.driveBonus[k] = 0; });
    if(m.module && (!MODULES[m.module.id])) m.module = null;
    if(m.module){ const md = MODULES[m.module.id]; if(md.ticks == null) m.module.ticksLeft = null; else if(typeof m.module.ticksLeft !== 'number' || m.module.ticksLeft <= 0) m.module = null; }
    if(m.module === undefined) m.module = null;
    if(typeof m.jobCooldown !== 'number') m.jobCooldown = 0;
    if(typeof m.playCooldown !== 'number' || m.playCooldown < 0) m.playCooldown = 0;
    if(!m.trainBonus || typeof m.trainBonus !== 'object') m.trainBonus = {str:0, def:0, spd:0};
    TRAIN_STATS.forEach(k => { if(typeof m.trainBonus[k] !== 'number') m.trainBonus[k] = 0; });
    if(typeof m.trainCooldown !== 'number') m.trainCooldown = 0;
    if(typeof m.marked !== 'boolean') m.marked = false;
    if(!Array.isArray(m.gearSlots)) m.gearSlots = Array(GEAR_SLOT_COUNT).fill(null);
    while(m.gearSlots.length < GEAR_SLOT_COUNT) m.gearSlots.push(null);
    m.gearSlots = m.gearSlots.slice(0, GEAR_SLOT_COUNT).map(g => (g && GEAR_ITEMS[g]) ? g : null);
    updateMoveUnlocks(m);
    if(typeof m.hp !== 'number' || typeof m.maxHp !== 'number' || m.maxHp <= 0){
      recalcStats(m, true);
    }
  }
  function migrateWildCell(cell){
    if(!cell) return;

  function migrateState(s){
    if(!s) return s;

    if(s.farm){

    // Training/Breeding gained prerequisites in this update. Anyone whose

    // grandfather them in rather than suddenly locking a feature they were

    if(isPreTierSave && typeof s.legacyUnlockAll !== 'boolean') s.legacyUnlockAll = true;
    if(typeof s.legacyUnlockAll !== 'boolean') s.legacyUnlockAll = false;
    if(!Array.isArray(s.log)) s.log = ['Welcome back to Neon Haven.'];
    if(!s.breeding) s.breeding = { a:null, b:null };
    if(!Array.isArray(s.wanted)) s.wanted = [];
    s.wanted.forEach(w => { if(typeof w.marked !== 'boolean') w.marked = false; });
    if(!Array.isArray(s.savedSeeds)) s.savedSeeds = [];
    if(!Array.isArray(s.recentSeeds)) s.recentSeeds = [];
    if(!Array.isArray(s.dexMilestonesClaimed)) s.dexMilestonesClaimed = [];
    if(typeof s.tutorialDone !== 'boolean') s.tutorialDone = true; // saves that predate the tutorial skip it
    if(!s.listSort || typeof s.listSort.key !== 'string') s.listSort = { key:'default', dir:'asc' };
    if(!s.dex){
      // Backfill: retroactively populate the Dex from monsters this save

      s.dex = {};
      const backfill = (m) => {
        if(!m || !m.speciesId) return;
        if(!s.dex[m.speciesId]) s.dex[m.speciesId] = newDexEntry(m.speciesId);
        const entry = s.dex[m.speciesId];
        const stage = m.stage || 1;
        entry.seenStage[stage] = true;

    s.bossDefeated.forEach((beaten, i) => { if(beaten) s.unlockedBiomeIndex = Math.max(s.unlockedBiomeIndex, Math.min(i+1, BIOMES.length-1)); });

    // unlocks onto whichever partner was active when the old save was made.
    if(Array.isArray(s.ownedCosmetics)){

  /* ---------------------------------------------------------
     BUILD + UPDATE NOTICES
     BUILD is the single source of truth for the version. `tools/sync_version.py`
     copies it into version.json (the tiny file the game polls). To ship an update:
     bump BUILD.version, add notes, run the script, then commit both files.
     Versions compare numerically (25.10 is newer than 25.9).
  --------------------------------------------------------- */
  const BUILD = {
    version: '25.1',
    date: '2026-09-21',
    notes: [
      'Play now costs Energy and Hunger on every try, hit or miss, and only allows a few tries in a row before a short break. It no longer refills Hunger or Energy.',
      'New: the game tells you when an update is available, and shows what changed after you update.',
      'The title screen now shows the version number.',

  const SEEN_BUILD_KEY = 'cybertamer_seen_build';
  function versionParts(v){ return String(v).split('.').map(n => parseInt(n, 10) || 0); }
  function isNewerVersion(remote, local){
    const a = versionParts(remote), b = versionParts(local);
    for(let i = 0; i < Math.max(a.length, b.length); i++){
      const x = a[i] || 0, y = b[i] || 0;
      if(x !== y) return x > y;
    }
    return false;
  }
  function escapeHtml(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

    const now = Date.now();

    lastUpdateCheck = now;
    try{
      const res = await fetch('version.json?ts=' + now, { cache: 'no-store' });
      if(!res.ok) return;
      const remote = await res.json();
      if(!remote || typeof remote.version !== 'string') return;
      if(isNewerVersion(remote.version, BUILD.version) && dismissedUpdate !== remote.version) showUpdateBanner(remote);
    }catch(e){ /* offline, local file, or no version.json: stay quiet */ }
  }
  function showUpdateBanner(remote){

    }

      <button class="btn btn-primary" id="update-now" style="padding:5px 10px; font-size:11px; min-height:0 !important;">Refresh now</button>
      <button class="btn" id="update-later" style="padding:5px 10px; font-size:11px; min-height:0 !important;">Later</button>`;
    bar.querySelector('#update-now').addEventListener('click', () => {
      try{ if(appMode === 'game') save(); }catch(e){}
      // A fresh query string forces the browser past its cached copy of the page; the save is untouched
      // because localStorage belongs to the site, not to the URL.
      location.replace(location.pathname + '?v=' + encodeURIComponent(remote.version));
    });
    bar.querySelector('#update-later').addEventListener('click', () => { dismissedUpdate = remote.version; bar.remove(); });
  }
  // After an update, show what changed once. A brand-new player (no stored version) just gets it recorded.
  function markBuildSeen(){ try{ localStorage.setItem(SEEN_BUILD_KEY, BUILD.version); }catch(e){} }
  function maybeShowWhatsNew(){
    let seen = null;
    try{ seen = localStorage.getItem(SEEN_BUILD_KEY); }catch(e){}
    if(seen === BUILD.version) return;
    const overlay = document.getElementById('modal-overlay');
    if(overlay && overlay.style.display === 'flex') return;   // never stack on another dialog
    markBuildSeen();
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <div class="pixel-font glow" style="font-size:10px; color:var(--phosphor); margin-bottom:4px;">🆕 UPDATED TO v${escapeHtml(BUILD.version)}</div>
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:8px;">${escapeHtml(BUILD.date)}</div>
      <div style="font-size:11px; color:var(--ink); line-height:1.5; max-height:50vh; overflow-y:auto; margin-bottom:12px;">
        ${BUILD.notes.map(n => `<div style="margin-bottom:6px;">· ${escapeHtml(n)}</div>`).join('')}
      </div>
      <button class="btn btn-primary" id="modal-ok" style="width:100%;">Got it</button>`;
    overlay.style.display = 'flex';
    document.getElementById('modal-ok').addEventListener('click', closeModal);
  }
  function startUpdateWatcher(){
    const label = document.getElementById('build-label');
    if(label) label.textContent = 'v' + BUILD.version;
    // tidy the address bar after a forced refresh (?v=...)
    try{ if(location.search.indexOf('v=') >= 0) history.replaceState(null, '', location.pathname); }catch(e){}
    checkForUpdate(true);
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); });
    window.addEventListener('focus', () => checkForUpdate(false));
    setInterval(() => checkForUpdate(false), 10*60*1000);
  }

  /* ---------------------------------------------------------
     INIT
  --------------------------------------------------------- */
  function init(){
    // Always boot to the title screen; New Game / Continue / Import decide
    // how `state` gets populated. This avoids dumping the player straight
    // back into Town on every page load, GBA-style.
    appMode = 'boot';
    try{
      state = defaultState();
    }catch(err){
      console.error('Init error:', err);
    }
    render();
    startUpdateWatcher();
  }
  init();
})();
</script>
</body>
</html>
