  function migrateMonster(m){
    if(typeof m.locked !== 'boolean') m.locked = false;
    if(m.stage === undefined || m.stage === null) m.stage = 1;
    if(!Array.isArray(m.movesKnown)) m.movesKnown = ['strike','pressurePoint'];
    if(!m.crestBonus) m.crestBonus = {hp:0,str:0,def:0,spd:0};
    if(typeof m.crestCount !== 'number'){
      // Best-effort inference for saves from before crests were tracked/capped —
      // existing bonuses are grandfathered in, only future purchases are capped.
      m.crestCount = Math.round((m.crestBonus.hp||0) / 4);
    }
    if(typeof m.xp !== 'number') m.xp = 0;
    if(typeof m.level !== 'number' || m.level < 1) m.level = 1;
    // Unknown species (e.g. a save from a build that had species this one lacks): don't
    // lose the identity — park it in missingSpeciesId and restore it once the species exists.
    if(m.missingSpeciesId && EVOLUTION_LINES[m.missingSpeciesId]){ m.speciesId = m.missingSpeciesId; delete m.missingSpeciesId; }
    if(!EVOLUTION_LINES[m.speciesId]){ m.missingSpeciesId = m.speciesId; m.speciesId = lineIds[0]; }
    if(m.stage > EVOLUTION_LINES[m.speciesId].length) m.stage = EVOLUTION_LINES[m.speciesId].length;
    if(m.cosmetic === undefined) m.cosmetic = null;
    if(!m.ivs) m.ivs = {hp:1,str:1,def:1,spd:1};
    if(!Array.isArray(m.ownedCosmetics)) m.ownedCosmetics = ['none'];
    if(!m.ownedCosmetics.includes('none')) m.ownedCosmetics.unshift('none');
    m.ownedCosmetics = m.ownedCosmetics.filter(id => COSMETICS.some(c=>c.id===id));
    if(m.cosmetic && !m.ownedCosmetics.includes(m.cosmetic)) m.ownedCosmetics.push(m.cosmetic);
    if(!m.driveBonus || typeof m.driveBonus !== 'object') m.driveBonus = {hp:0,str:0,def:0,spd:0};
    ['hp','str','def','spd'].forEach(k => { if(typeof m.driveBonus[k] !== 'number' || m.driveBonus[k] < 0) m.driveBonus[k] = 0; });
    if(!m.driveUses || typeof m.driveUses !== 'object') m.driveUses = {};
    ['hp','str','def','spd'].forEach(k => {
      if(typeof m.driveUses[k] !== 'number' || m.driveUses[k] < 0){
        // Pre-v25.27 saves have no driveUses at all — infer it from however much bonus this
        // monster already banked (under the OLD, higher cap), so a maxed-out old save correctly
        // shows as already at the new cap too. The bonus itself is grandfathered, never shrunk.
        const sup = SUPPLY_ITEMS[k+'Drive'];
        const amt = (sup && sup.amount) || 1;
        m.driveUses[k] = Math.min(DRIVE_CAP_USES, Math.ceil((m.driveBonus[k]||0) / amt));
      }
    });
    if(m.module && (!MODULES[m.module.id])) m.module = null;
    if(m.module){ const md = MODULES[m.module.id]; if(md.ticks == null) m.module.ticksLeft = null; else if(typeof m.module.ticksLeft !== 'number' || m.module.ticksLeft <= 0) m.module = null; }
    if(m.module === undefined) m.module = null;
    if(typeof m.jobCooldown !== 'number') m.jobCooldown = 0;
    if(typeof m.playCooldown !== 'number' || m.playCooldown < 0) m.playCooldown = 0;
    if(!m.trainBonus || typeof m.trainBonus !== 'object') m.trainBonus = {str:0, def:0, spd:0};
    TRAIN_STATS.forEach(k => { if(typeof m.trainBonus[k] !== 'number') m.trainBonus[k] = 0; });
    if(typeof m.trainCooldown !== 'number') m.trainCooldown = 0;
    if(typeof m.marked !== 'boolean') m.marked = false;
    if(!m.personality || !PERSONALITIES[m.personality]){ m.personality = rollPersonality(); recalcStats(m, false); }
    if(!Array.isArray(m.gearSlots)) m.gearSlots = Array(GEAR_SLOT_COUNT).fill(null);
    while(m.gearSlots.length < GEAR_SLOT_COUNT) m.gearSlots.push(null);
    m.gearSlots = m.gearSlots.slice(0, GEAR_SLOT_COUNT).map(g => (g && GEAR_ITEMS[g]) ? g : null);
    updateMoveUnlocks(m);
    if(typeof m.hp !== 'number' || typeof m.maxHp !== 'number' || m.maxHp <= 0){
      recalcStats(m, true);
    }
  }
  function migrateWildCell(cell){
    if(!cell) return;
    if(cell.role === undefined){
      const map = { grass:'open', mountain:'blockA', river:'blockB', chest:'chest', gate:'gate' };
      cell.role = map[cell.t] !== undefined ? map[cell.t] : 'open';
      delete cell.t;
    }
  }
  function migrateState(s){
    if(!s) return s;
    // Story layer: a save from before this existed never saw the intro cinematic or picked an
    // origin. Rather than silently grandfathering it in, we flag it — the app-level load flow
    // (continueGame/import) shows a mandatory one-time notice explaining that the save is being
    // reset back to a fresh start (Bits, inventory, unlocked biomes, farm, Dex, everything) EXCEPT
    // the monster roster, which is kept in full, then calls performStoryReset(). migrateState
    // itself stays a pure function — it only detects and flags, never performs the reset (which
    // needs to show UI and isn't idempotent the way ordinary field-backfilling is).
    const preStorySave = typeof s.storyIntroDone !== 'boolean';
    if(preStorySave) s.needsStoryReset = true;
    if(typeof s.handle !== 'string') s.handle = '';
    if(!ORIGINS[s.origin]) s.origin = null;

  /* ---------------------------------------------------------

  const MOTION_KEY = 'cybertamer_motion';

    document.body.appendChild(s);
    const a = animate(s, [
      { transform:'translate(-50%,0) scale(.6)', opacity:0 },
      { transform:'translate(-50%,-14px) scale(1.15)', opacity:1, offset:.2 },
      { transform:'translate(-50%,-48px) scale(1)', opacity:0 }

    if(!host || !motionOn() || !document.body.contains(host)) return;

      }
      case 'breachClear': { const g = document.getElementById('breach-grid'); if(g) flashEl(g, 'brightness(1.15)', 160); break; }
      case 'breachBad': { const g = document.getElementById('breach-grid'); if(g) shakeEl(g, 5, 220); break; }
      case 'breachSuccess': {
        const g = document.getElementById('breach-grid');
        if(g){
          floatText(g, 'BREACH COMPLETE!', '#4be37a', 20);
          burst(g, '#4be37a', 22, 80);
          flashEl(g, 'brightness(1.9)', 500);
        }
        break;
      }
      case 'breachFail': {
        const g = document.getElementById('breach-grid');
        if(g){
          floatText(g, 'CONNECTION LOST', '#ff4d5e', 18);
          shakeEl(g, 8, 400);
          flashEl(g, 'brightness(1.6) sepia(1) saturate(6) hue-rotate(-30deg)', 500);
        }
        break;
      }
      case 'hazard':
        animate(screenEl, [{ boxShadow:'inset 0 0 0 0 rgba(255,80,60,0)' }, { boxShadow:'inset 0 0 44px 8px rgba(255,80,60,.6)', offset:.3 }, { boxShadow:'inset 0 0 0 0 rgba(255,80,60,0)' }], { duration: 520 });
        break;
    }
  }
  function runFx(){
    const q = fxQueue; fxQueue = [];
    if(!q.length || !motionOn()) return;
    q.forEach((ev, i) => setTimeout(() => { try{ playFx(ev); }catch(e){} }, i * 240));
  }

  // CAPTURE.EXE overlay. The outcome (success/fail) is decided by the caller before this plays,
  // so the animation always resolves toward the real result rather than a random-looking readout.
  // Controls are locked for the duration; a hard fallback timer guarantees `done()` still fires.
  function playCapture(programName, enemyName, success, done){
    const ctl = document.getElementById('controls');
    let finished = false;
    const finish = () => { if(finished) return; finished = true; try{ ov.remove(); }catch(e){} if(ctl) ctl.style.pointerEvents = ''; done(); };
    if(ctl) ctl.style.pointerEvents = 'none';
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed; inset:0; z-index:940; display:flex; align-items:center; justify-content:center; background:rgba(2,8,5,.88); padding:20px;';
    ov.innerHTML = `
      <div class="card" style="width:100%; max-width:300px; text-align:left; border-color:var(--phosphor); font-family:'IBM Plex Mono',monospace;">
        <div class="pixel-font glow" style="color:var(--phosphor); font-size:12px; margin-bottom:8px; letter-spacing:1px;">${escapeHtml(programName.toUpperCase())}</div>
        <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:4px;">Target: <span style="color:var(--ink);">${escapeHtml(enemyName)}</span></div>
        <div style="font-size:10.5px; color:var(--ink-dim); margin-bottom:10px;">Encryption: <span id="cap-enc" style="color:var(--crimson); letter-spacing:1px;">██████████</span></div>
        <div id="cap-status" style="font-size:10.5px; color:var(--ink-dim); margin-bottom:6px;">Attempting acquisition...</div>
        <div id="cap-pct" class="pixel-font" style="font-size:26px; color:var(--phosphor);">0%</div>
      </div>`;
    document.body.appendChild(ov);
    const card = ov.firstElementChild;
    const encEl = ov.querySelector('#cap-enc'), pctEl = ov.querySelector('#cap-pct'), statusEl = ov.querySelector('#cap-status');
    setTimeout(finish, 3400); // hard fallback: never leave the controls locked
    if(!motionOn()){ // reduced motion: show the result instantly rather than not at all
      pctEl.textContent = success ? '100%' : Math.round(60 + Math.random()*20) + '%';
      statusEl.textContent = success ? 'CAPTURE.EXE COMPLETE' : 'CAPTURE.EXE FAILED ' + '—' + ' link lost';
      statusEl.style.color = success ? 'var(--phosphor)' : 'var(--crimson)';
      setTimeout(finish, 500);
      return;
    }
    let pct = 0;
    const target = success ? 100 : (58 + Math.random()*22); // a failed run stalls partway through
    const tick = () => {
      if(!document.body.contains(ov)) return;
      const remaining = target - pct;
      pct = Math.min(target, pct + Math.max(0.6, remaining * 0.18) * (0.6 + Math.random()*0.8));
      pctEl.textContent = Math.floor(pct) + '%';
      const bars = Math.max(0, 10 - Math.floor(pct / 10));
      encEl.textContent = '█'.repeat(bars) + '░'.repeat(10 - bars);
      if(pct < target - 0.5){ setTimeout(tick, 55 + Math.random()*70); return; }
      if(success){
        pctEl.textContent = '100%'; pctEl.style.color = 'var(--phosphor)';
        encEl.textContent = '░'.repeat(10);
        statusEl.textContent = 'CAPTURE.EXE COMPLETE'; statusEl.style.color = 'var(--phosphor)';
        flashEl(card, 'brightness(1.8)', 320);
        burst(card, '#4be37a', 14, 60);
      } else {
        statusEl.textContent = 'CAPTURE.EXE FAILED ' + '—' + ' link lost'; statusEl.style.color = 'var(--crimson)';
        pctEl.style.color = 'var(--crimson)';
        shakeEl(card, 6, 300);
      }
      setTimeout(finish, 850);
    };
    tick();
  }

  // A quick "scanning the target" beat before an encounter, then hands off to playTransition's
  // usual name reveal. Skips straight to the reveal under reduced motion.
  function playScanTransition(revealMessage, accentColor, onDone){
    if(!motionOn()){ playTransition(revealMessage, accentColor, onDone, 500); return; }
    const screenEl = document.getElementById('screen'), controlsEl = document.getElementById('controls');
    screenEl.style.pointerEvents = 'none'; controlsEl.style.pointerEvents = 'none';
    clearTimeout(transitionTimer); clearTimeout(inputLockTimer);
    screenEl.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:260px; text-align:center; padding:0 10px; font-family:'IBM Plex Mono',monospace;">
        <div class="pixel-font glow" style="color:var(--crimson); font-size:11px; letter-spacing:1px;">UNKNOWN ENTITY DETECTED</div>
        <div style="color:var(--ink-dim); font-size:10.5px; margin-top:14px;">Scanning...</div>
        <div id="scan-pct" class="pixel-font glow" style="color:var(--phosphor); font-size:20px; margin-top:10px;">0%</div>
      </div>`;
    controlsEl.innerHTML = '';
    let pct = 0;
    const tick = () => {
      const el = document.getElementById('scan-pct');
      if(!el){ playTransition(revealMessage, accentColor, onDone, 300); return; }
      pct = Math.min(100, pct + 16 + Math.random()*26);
      el.textContent = Math.floor(pct) + '%';
      transitionTimer = setTimeout(pct < 100 ? tick : () => playTransition(revealMessage, accentColor, onDone, 450), pct < 100 ? (55 + Math.random()*55) : 180);
    };
    transitionTimer = setTimeout(tick, 140);
  }

  function countUpBits(el, from, to){
    const start = performance.now(), dur = 450;
    const step = (ts) => {
      if(!document.body.contains(el)) return;
      const t = Math.min(1, (ts - start) / dur);
      el.textContent = `◈ ${Math.round(from + (to - from) * t)} Bits`;
      if(t < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
    setTimeout(() => { if(document.body.contains(el)) el.textContent = `◈ ${to} Bits`; }, dur + 150); // in case frames are throttled
  }

  // Full-screen evolution sequence. Queued by checkEvolution; plays after the next render.
  let evoQueue = [], evoActive = false;
  function queueEvolution(m, before, oldForm){
    if(appMode !== 'game') return;
    try{
      const nf = getForm(m);
      evoQueue.push({
        oldName: before.nickname || oldForm.name, newName: nf.name, color: nf.color,
        oldUrl: spriteDataUrl(before, oldForm, before.cosmetic), newUrl: spriteDataUrl(m, nf, m.cosmetic),
      });
    }catch(e){ console.warn('evolution overlay', e); }
  }
  function playNextEvolution(){
    if(evoActive || !evoQueue.length) return;
    const ev = evoQueue.shift();
    evoActive = true;
    const full = motionOn();
    const ov = document.createElement('div');
    ov.id = 'evo-overlay';
    ov.style.cssText = 'position:fixed; inset:0; z-index:950; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(ellipse at 50% 45%, #0b2a1a 0%, #020a06 72%); color:#dff7e6; text-align:center; padding:24px; cursor:pointer;';
    const imgCss = `position:absolute; left:0; top:0; width:200px; height:200px; image-rendering:pixelated;`;
    ov.innerHTML = `
      <div id="evo-rays" style="position:absolute; left:50%; top:42%; width:150vmax; height:150vmax; margin:-75vmax 0 0 -75vmax; background:repeating-conic-gradient(${ev.color}30 0deg 6deg, transparent 6deg 18deg); border-radius:50%; pointer-events:none; opacity:0;"></div>
      <div id="evo-stage" style="position:relative; width:200px; height:200px;">
        <img id="evo-old" src="${ev.oldUrl}" alt="" style="${imgCss} filter:drop-shadow(0 0 16px ${ev.color});">
        <img id="evo-new" src="${ev.newUrl}" alt="" style="${imgCss} filter:drop-shadow(0 0 22px ${ev.color}); opacity:0;">
      </div>
      <div id="evo-title" class="pixel-font glow" style="margin-top:26px; font-size:13px; line-height:1.8; color:${ev.color}; max-width:300px; min-height:48px;"></div>
      <div id="evo-hint" style="margin-top:14px; font-size:11px; color:#86ad96; opacity:0;">Tap to continue</div>
      <div id="evo-flash" style="position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;"></div>`;
    document.body.appendChild(ov);
    const $ = (id) => ov.querySelector('#' + id);
    const oldImg = $('evo-old'), newImg = $('evo-new'), title = $('evo-title'), hint = $('evo-hint'), rays = $('evo-rays'), stage = $('evo-stage'), flash = $('evo-flash');
    const timers = [];
    const at = (ms, fn) => timers.push(setTimeout(() => { if(document.body.contains(ov)) fn(); }, ms));
    const shown = Date.now();
    let done = false;
    const esc = escapeHtml;
    const finalTitle = `${esc(ev.oldName)} evolved into ${esc(ev.newName)}!`;
    const showFinal = () => {
      done = true;
      timers.forEach(clearTimeout);
      ov.getAnimations && ov.getAnimations({ subtree:true }).forEach(a => a.cancel());
      oldImg.style.opacity = '0';
      newImg.style.opacity = '1'; newImg.style.filter = `drop-shadow(0 0 22px ${ev.color})`; newImg.style.transform = 'none';
      flash.style.opacity = '0';
      rays.style.opacity = full ? '.5' : '.25';
      title.innerHTML = finalTitle; title.style.opacity = '1';
      hint.style.opacity = '1';
      if(full) animate(rays, [{ transform:'rotate(0deg)' }, { transform:'rotate(360deg)' }], { duration: 24000, iterations: Infinity });
    };
    const close = () => {
      const a = animate(ov, [{ opacity:1 }, { opacity:0 }], { duration: 250, fill:'forwards' });
      const end = () => { ov.remove(); evoActive = false; playNextEvolution(); };
      if(a) a.onfinish = end; else end();
      setTimeout(() => { if(document.body.contains(ov)) end(); }, 600);
    };
    ov.addEventListener('click', () => {
      if(Date.now() - shown < 500) return;        // ignore the tap that caused the level-up
      if(done) close(); else showFinal();          // first tap skips ahead, second dismisses
    });
    if(!full){ showFinal(); return; }

    // ---- full sequence (~3.4s) ----
    animate(ov, [{ opacity:0 }, { opacity:1 }], { duration: 300 });
    title.innerHTML = `${esc(ev.oldName)} is evolving...`;
    title.style.opacity = '1'; rays.style.opacity = '.5';   // final values set inline too, so a throttled animation can never leave them hidden
    animate(title, [{ opacity:0 }, { opacity:1 }], { duration: 400 });
    animate(rays, [{ opacity:0 }, { opacity:.5 }], { duration: 900 });
    animate(rays, [{ transform:'rotate(0deg)' }, { transform:'rotate(360deg)' }], { duration: 14000, iterations: Infinity });
    animate(oldImg, [{ transform:'scale(1)' }, { transform:'scale(1.06)' }, { transform:'scale(1)' }], { duration: 700, iterations: 3, easing:'ease-in-out' });
    // energy gathers toward the sprite
    at(300, () => {
      const c = centerOf(stage);
      for(let i = 0; i < 20; i++){
        const p = document.createElement('div');
        const ang = Math.random()*Math.PI*2, r = 140 + Math.random()*110;
        p.style.cssText = `position:fixed; left:${c.x + Math.cos(ang)*r}px; top:${c.y + Math.sin(ang)*r}px; width:4px; height:4px; background:${ev.color}; box-shadow:0 0 8px ${ev.color}; z-index:951; pointer-events:none; opacity:0;`;
        document.body.appendChild(p);
        const a = animate(p, [{ transform:'translate(-50%,-50%)', opacity:0 }, { opacity:1, offset:.3 }, { transform:`translate(calc(-50% + ${-Math.cos(ang)*r}px), calc(-50% + ${-Math.sin(ang)*r}px))`, opacity:0 }], { duration: 900 + Math.random()*500, delay: Math.random()*600, easing:'ease-in' });
        if(a) a.onfinish = () => p.remove();
        setTimeout(() => p.remove(), 2400);
      }
    });
    // the old form whites out and shudders
    at(1600, () => {
      animate(oldImg, [
        { filter:`drop-shadow(0 0 16px ${ev.color})`, transform:'scale(1) translateX(0)' },
        { filter:'brightness(0) invert(1) drop-shadow(0 0 30px #fff)', transform:'scale(1.2) translateX(-5px)', offset:.3 },
        { filter:'brightness(0) invert(1) drop-shadow(0 0 30px #fff)', transform:'scale(1.3) translateX(5px)', offset:.6 },
        { filter:'brightness(0) invert(1) drop-shadow(0 0 40px #fff)', transform:'scale(1.4) translateX(0)' }
      ], { duration: 800, fill:'forwards' });
    });
    // flash, swap, shockwave
    at(2400, () => {
      animate(flash, [{ opacity:0 }, { opacity:1, offset:.25 }, { opacity:0 }], { duration: 600 });
    });
    at(2550, () => {
      oldImg.style.opacity = '0';
      newImg.style.opacity = '1';
      newImg.style.filter = `drop-shadow(0 0 22px ${ev.color})`;
      animate(newImg, [
        { transform:'scale(.55)', filter:'brightness(0) invert(1) drop-shadow(0 0 30px #fff)' },
        { transform:'scale(1.25)', filter:'brightness(0) invert(1) drop-shadow(0 0 30px #fff)', offset:.45 },
        { transform:'scale(1)', filter:`drop-shadow(0 0 22px ${ev.color})` }
      ], { duration: 650, easing:'ease-out' });
      const c = centerOf(stage);
      for(let k = 0; k < 2; k++){
        const ring = document.createElement('div');
        ring.style.cssText = `position:fixed; left:${c.x}px; top:${c.y}px; width:120px; height:120px; margin:-60px 0 0 -60px; border:3px solid ${ev.color}; border-radius:50%; z-index:951; pointer-events:none; box-shadow:0 0 14px ${ev.color};`;
        document.body.appendChild(ring);
        const a = animate(ring, [{ transform:'scale(.3)', opacity:.9 }, { transform:'scale(3.4)', opacity:0 }], { duration: 900, delay: k*180, easing:'ease-out' });
        if(a) a.onfinish = () => ring.remove();
        setTimeout(() => ring.remove(), 1500);
      }
      burst(stage, ev.color, 18, 130);
      burst(stage, '#ffffff', 10, 90);
    });
    at(3000, () => {
      title.innerHTML = finalTitle;
      animate(title, [{ opacity:0, transform:'scale(.8)' }, { opacity:1, transform:'scale(1)' }], { duration: 450, easing:'ease-out' });
    });
    at(3500, () => { done = true; hint.style.opacity = '1'; animate(hint, [{ opacity:0 }, { opacity:1 }], { duration: 400 }); });
  }

  function afterRenderFx(screenChanged, screenEl){
    if(appMode !== 'game') return;
    try{
      if(motionOn()){
        if(screenChanged && state.screen !== 'battle'){
          animate(screenEl, [{ opacity:0, transform:'translateY(6px)' }, { opacity:1, transform:'none' }], { duration: 220, easing:'ease-out' });
        } else if(!screenChanged && (state.screen === 'wild' || state.screen === 'mine')){
          animate(document.getElementById('pl-tile'), [{ transform:'scale(1.5)' }, { transform:'scale(1)' }], { duration: 160, easing:'ease-out' });
        }
        if(state.screen === 'battle' && state.battle && battleEntered !== state.battle){
          battleEntered = state.battle;
          const E = document.getElementById('bt-enemy'), P = document.getElementById('bt-player');
          animate(E, [{ transform:'translateX(-36px)', opacity:0 }, { transform:'translateX(0)', opacity:1 }], { duration: 420, easing:'ease-out' });
          animate(P, [{ transform:'translateX(36px)', opacity:0 }, { transform:'translateX(0)', opacity:1 }], { duration: 420, easing:'ease-out' });
          flashEl(E, 'brightness(2.4) hue-rotate(40deg)', 500);
        }
      }
      runFx();
      playNextEvolution();
    }catch(e){ console.warn('fx error', e); }
  }

      'Data Sorting is a stack-sorting puzzle: move typed data chunks between containers until each one holds a single type. Running out of moves just re-locks the node for another try.',
    ]},
    { version:'25.6', date:'2026-09-21', notes:[
      'Ripe crops no longer wither. Harvest them whenever you get back — a long exploring trip never costs you a crop.',
      'New: Play, Job Board and Training Ground now share a Perfect streak — a bright-zone hit celebrates on the spot, and beating your best streak logs a 🏆 callout.',
    ]},
    { version:'25.5', date:'2026-09-21', notes:[
      'Fixed: opening a screen (like Inspect) from partway down a long list no longer inherits that scroll position — every screen now opens at the top.',
      'Fixed: the Inspect and Set Active buttons on a Network Registry card no longer squeeze the name/level onto a cramped, wrapping line.',
    ]},
    { version:'25.4', date:'2026-09-21', notes:[
      'New: a Network Registry Inspect screen for each monster, with exact IVs, full move list and everything held.',
      'The Network Registry (formerly the Storage Box) now shows your total monster count.',
      'Capture rework: catching a monster now runs a capture program (Basic Capture.exe, and the pricier Advanced/Hunter/Containment.exe) from the battle screen, with its own CAPTURE.EXE animation. Trap Spheres were converted 1:1 into Basic Capture.exe runs.',
      'Wild encounters open with a quick scan beat before the fight.',
    ]},
    { version:'25.2', date:'2026-09-21', notes:[
      'Play now costs Energy and Hunger on every try, hit or miss, and only allows a few tries in a row before a short break. It no longer refills Hunger or Energy.',
      'New: the game tells you when an update is available, and shows what changed after you update.',
      'The title screen now shows the version number.',
      'New animations: hits, damage numbers, sliding HP bars, dodges, entrances, a Trap Sphere throw and catch reveal, level-up bursts, counting Bits, and a full-screen evolution sequence.',
      'New Motion setting under System (Full or Reduced). It follows your device\'s reduce-motion setting by default.',
    ]},
    { version:'25.1', date:'2026-09-21', notes:[
      'Play now costs Energy and Hunger on every try, hit or miss, and only allows a few tries in a row before a short break. It no longer refills Hunger or Energy.',
      'New: the game tells you when an update is available, and shows what changed after you update.',
      'The title screen now shows the version number.',
    ]},
  ];
  const BUILD = {
    version: '25.28',
    date: '2026-09-23',
    notes: [
      'New: Data Mine gear now comes in three rarity tiers — Common, Rare and Legendary — instead of one flat pool. Which tier you find is weighted by how deep you are: Rare starts showing up around depth 15-20, Legendary never appears before depth 25 and stays rare even past it.',
      '10 new gear items across Rare and Legendary, with mechanics the game hasn\'t had before: Type Wards (reduced damage from one type), dodge/flee gear, a same-type damage bonus, and a DEF spike when HP runs low.',
      'Thermal Core and Frost Core (the move-granting gear) moved up to the Rare tier.',
    ],
  };
  function fullChangelog(){ return [{ version:BUILD.version, date:BUILD.date, notes:BUILD.notes }, ...CHANGELOG_HISTORY]; }
  function formatChangelogDate(d){
    const parts = String(d).split('-').map(Number);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    if(parts.length !== 3 || !months[parts[1]-1]) return d;
    return `${months[parts[1]-1]} ${parts[2]}, ${parts[0]}`;
  }
  function renderChangelog(screenEl, controlsEl){
    const entries = fullChangelog();
    screenEl.innerHTML = `
      ${screenTitle('🗓 UPDATE NOTES', 'var(--cyan)')}
      <div style="font-size:10px; color:var(--ink-dim); margin-bottom:10px;">Every update pushed to this game, newest first.</div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        ${entries.map(e => `<div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px;">
            <span class="pixel-font glow" style="color:var(--phosphor); font-size:10.5px;">v${escapeHtml(e.version)}</span>
            <span style="font-size:9.5px; color:var(--ink-dim);">${escapeHtml(formatChangelogDate(e.date))}</span>
          </div>
          <div style="font-size:10px; color:var(--ink-dim); line-height:1.6;">
            ${e.notes.map(n => `· ${escapeHtml(n)}`).join('<br>')}
          </div>
        </div>`).join('')}
      </div>
    `;
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to System</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='system'; render(); });
  }
  const SEEN_BUILD_KEY = 'cybertamer_seen_build';
  function versionParts(v){ return String(v).split('.').map(n => parseInt(n, 10) || 0); }
  function isNewerVersion(remote, local){
    const a = versionParts(remote), b = versionParts(local);
    for(let i = 0; i < Math.max(a.length, b.length); i++){
      const x = a[i] || 0, y = b[i] || 0;
      if(x !== y) return x > y;
    }
    return false;
  }
  function escapeHtml(t){ return String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  let dismissedUpdate = null;   // version the player chose "Later" for this session
  let lastUpdateCheck = 0;
  async function checkForUpdate(force){
    const now = Date.now();
    if(!force && now - lastUpdateCheck < 5*60*1000) return;   // at most every 5 minutes
    lastUpdateCheck = now;
    try{
      const res = await fetch('version.json?ts=' + now, { cache: 'no-store' });
      if(!res.ok) return;
      const remote = await res.json();
      if(!remote || typeof remote.version !== 'string') return;
      if(isNewerVersion(remote.version, BUILD.version) && dismissedUpdate !== remote.version) showUpdateBanner(remote);
    }catch(e){ /* offline, local file, or no version.json: stay quiet */ }
  }
  function showUpdateBanner(remote){
    let bar = document.getElementById('update-banner');
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'update-banner';
      bar.setAttribute('role', 'status');
      bar.style.cssText = 'position:fixed; left:0; right:0; top:0; z-index:900; display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; padding:calc(8px + env(safe-area-inset-top, 0px)) 12px 8px; background:#0b2a18; border-bottom:1px solid var(--phosphor); color:var(--ink); font-size:11px; box-shadow:0 4px 18px rgba(0,0,0,.5);';
      document.body.appendChild(bar);
    }
    bar.innerHTML = `<span>🔄 <b>Update ${escapeHtml(remote.version)} is available.</b> Your progress is saved.</span>
      <button class="btn btn-primary" id="update-now" style="padding:5px 10px; font-size:11px; min-height:0 !important;">Refresh now</button>
      <button class="btn" id="update-later" style="padding:5px 10px; font-size:11px; min-height:0 !important;">Later</button>`;
    bar.querySelector('#update-now').addEventListener('click', () => {
      try{ if(appMode === 'game') save(); }catch(e){}
      // A fresh query string forces the browser past its cached copy of the page; the save is untouched
      // because localStorage belongs to the site, not to the URL.
      location.replace(location.pathname + '?v=' + encodeURIComponent(remote.version));
    });
    bar.querySelector('#update-later').addEventListener('click', () => { dismissedUpdate = remote.version; bar.remove(); });
  }
  // After an update, show what changed once. A brand-new player (no stored version) just gets it recorded.
  function markBuildSeen(){ try{ localStorage.setItem(SEEN_BUILD_KEY, BUILD.version); }catch(e){} }
  function maybeShowWhatsNew(){
    let seen = null;
    try{ seen = localStorage.getItem(SEEN_BUILD_KEY); }catch(e){}
    if(seen === BUILD.version) return;
    const overlay = document.getElementById('modal-overlay');
    if(overlay && overlay.style.display === 'flex') return;   // never stack on another dialog
    markBuildSeen();
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <div class="pixel-font glow" style="font-size:10px; color:var(--phosphor); margin-bottom:4px;">🆕 UPDATED TO v${escapeHtml(BUILD.version)}</div>
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:8px;">${escapeHtml(BUILD.date)}</div>
      <div style="font-size:11px; color:var(--ink); line-height:1.5; max-height:50vh; overflow-y:auto; margin-bottom:12px;">
        ${BUILD.notes.map(n => `<div style="margin-bottom:6px;">· ${escapeHtml(n)}</div>`).join('')}
      </div>
      <button class="btn btn-primary" id="modal-ok" style="width:100%;">Got it</button>`;
    overlay.style.display = 'flex';
    document.getElementById('modal-ok').addEventListener('click', closeModal);
  }
  function startUpdateWatcher(){
    const label = document.getElementById('build-label');
    if(label) label.textContent = 'v' + BUILD.version;
    // tidy the address bar after a forced refresh (?v=...)
    try{ if(location.search.indexOf('v=') >= 0) history.replaceState(null, '', location.pathname); }catch(e){}
    checkForUpdate(true);
    document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkForUpdate(false); });
    window.addEventListener('focus', () => checkForUpdate(false));
    setInterval(() => checkForUpdate(false), 10*60*1000);
  }

  /* ---------------------------------------------------------
     INIT
  --------------------------------------------------------- */
  function init(){
    // Always boot to the title screen; New Game / Continue / Import decide
    // how `state` gets populated. This avoids dumping the player straight
    // back into Town on every page load, GBA-style.
    appMode = 'boot';
    try{
      state = defaultState();
    }catch(err){
      console.error('Init error:', err);
    }
    applyMotionMode();
    render();
    startUpdateWatcher();
  }
  init();
})();
</script>
</body>
