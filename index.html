  /* ---------------------------------------------------------
     WILD MAP GENERATION
  --------------------------------------------------------- */
  function shuffleArray(arr, rng){
    const rnd = rng || Math.random;
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(rnd()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // Carves a connected network of 'open' tiles into a grid that starts fully
  // walled (blockA/blockB), via a random walk with occasional room bursts.
  // Because every open tile is reachable by construction, no post-hoc
  // reachability retry is needed the way pure random noise required.
  function carveOpenPath(grid, size, cx, cy, rng){
    const rnd = rng || Math.random;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const nx=cx+dx, ny=cy+dy;
      if(nx>=0 && ny>=0 && nx<size && ny<size) grid[ny][nx].role = 'open';
    }
    const targetOpen = Math.round(size*size*0.55);
    let openCount = 9;
    let x = cx, y = cy, steps = 0;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    while(openCount < targetOpen && steps < size*size*8){
      steps++;
      if(grid[y][x].role !== 'open'){ grid[y][x].role = 'open'; openCount++; }
      if(steps % 17 === 0){
        for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
          const nx=x+dx, ny=y+dy;
          if(nx>=0 && ny>=0 && nx<size && ny<size && grid[ny][nx].role !== 'open'){ grid[ny][nx].role = 'open'; openCount++; }
        }
      }
      const [dx,dy] = dirs[Math.floor(rnd()*dirs.length)];
      const nx = x+dx, ny = y+dy;
      if(nx>=0 && ny>=0 && nx<size && ny<size){ x=nx; y=ny; }
    }
  }

  // A wild map's entire layout is a pure function of (biomeIndex, size, seed),
  // via a seeded PRNG (mulberry32) — so the same seed always regenerates the
  // identical tile layout. Passing no seed rolls a fresh random one. Fog/opened
  // state is always fresh regardless of seed, so revisiting a favorite seed
  // still feels like exploring it, not resuming a save.
  function generateWildMap(biomeIndex, sizeOverride, seed, opts){
    const layer = (opts && opts.layer === 2) ? 2 : 1;
    const layerBiome = layerBiomeDef(BIOMES[biomeIndex], layer);
    const size = sizeOverride || layerBiome.mapSize || (9 + biomeIndex*2);
    const useSeed = (typeof seed === 'number' && isFinite(seed)) ? (seed>>>0) : Math.floor(Math.random()*4294967296);
    // Layer 2's actual layout is derived from the entered/favorited seed number, same pattern as
    // every other derived-PRNG feature — so favoriting a seed favorites both layers at once, but
    // Layer 2 is never just a re-skin of the exact same grid.
    const mapSeed = layer === 2 ? (useSeed ^ 0x5bd1e995) >>> 0 : useSeed;
    const rng = mulberry32(mapSeed);
    const cx = Math.floor(size/2), cy = Math.floor(size/2);
    const grid = [];
    for(let y=0;y<size;y++){
      const row = [];
      for(let x=0;x<size;x++){
        row.push({ role: rng()<0.55 ? 'blockA' : 'blockB', opened:false });
      }
      grid.push(row);
    }
    carveOpenPath(grid, size, cx, cy, rng);
    grid[cy][cx] = { role:'gate', opened:true };

    const openCells = [];
    for(let y=0;y<size;y++) for(let x=0;x<size;x++){
      if(grid[y][x].role === 'open' && !(x===cx && y===cy)) openCells.push([x,y]);
    }
    shuffleArray(openCells, rng);
    let cursor = 0;
    const takeCell = () => cursor < openCells.length ? openCells[cursor++] : null;

    const chestCount = Math.max(2, Math.round(openCells.length*0.12));
    for(let i=0;i<chestCount;i++){
      const c = takeCell();
      if(!c) break;
      grid[c[1]][c[0]] = { role:'chest', opened:false };
    }

    let hasKeyPair = false;
    if(rng() < 0.5){
      const kc = takeCell(), vc = takeCell();
      if(kc && vc){
        grid[kc[1]][kc[0]] = { role:'key', opened:false };
        grid[vc[1]][vc[0]] = { role:'vault', opened:false };
        hasKeyPair = true;
      }
    }

    if(rng() < 0.7){
      const sc = takeCell();
      if(sc) grid[sc[1]][sc[0]] = { role:'shrine', opened:false };
    }

    // Anomaly tiles are kept a minimum distance from the gate so a lucky
    // seed can't be farmed by camping one step from spawn and re-triggering
    // the same encounter over and over — reaching one always costs a real
    // walk through the map.
    if(rng() < 0.3){
      const minDist = Math.max(3, Math.floor(size/3));
      const chebyshev = ([x,y]) => Math.max(Math.abs(x-cx), Math.abs(y-cy));
      let candidates = openCells.slice(cursor).filter(c => chebyshev(c) >= minDist);
      if(candidates.length === 0){
        // Map too small/cramped to satisfy the minimum — fall back to
        // whichever remaining cell is farthest from the gate.
        candidates = openCells.slice(cursor).sort((a,b) => chebyshev(b) - chebyshev(a));
      }
      if(candidates.length){
        const [ax,ay] = candidates[0]; // pool was already shuffled, so this is a random qualifying cell
        grid[ay][ax] = { role:'anomaly', opened:false };
        const idx = openCells.findIndex(c => c[0]===ax && c[1]===ay);
        if(idx >= 0) openCells.splice(idx, 1); // keep it out of the shared pool for later placements (e.g. boss)
      }
    }

    const bossAlreadyDefeated = layer === 2 ? state.layer2Defeated[biomeIndex] : state.bossDefeated[biomeIndex];
    if(!bossAlreadyDefeated){
      const bc = takeCell();
      if(bc) grid[bc[1]][bc[0]] = { role:'boss', opened:false };
    }

    // Biome mechanics and daily extras use their OWN derived PRNGs, placed after everything
    // above, so biomes without them generate exactly the same layouts as before.
    const biomeDef = layerBiome;
    if(biomeDef.hazard){
      const hr = mulberry32((mapSeed ^ 0x9e3779b9) >>> 0);
      for(let y=0;y<size;y++) for(let x=0;x<size;x++){
        if(grid[y][x].role === 'open' && hr() < biomeDef.hazard.density) grid[y][x] = { role:'hazard', opened:false };
      }
    }
    if(opts && opts.daily){
      const cr = mulberry32((mapSeed ^ 0x51ed270b) >>> 0);
      const cheb = (x,y) => Math.max(Math.abs(x-cx), Math.abs(y-cy));
      const minD = Math.max(3, Math.floor(size/3));
      let cand = [];
      for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x].role === 'open' && cheb(x,y) >= minD) cand.push([x,y]);
      if(!cand.length) for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x].role === 'open') cand.push([x,y]);
      if(cand.length){ const [kx,ky] = cand[Math.floor(cr()*cand.length)]; grid[ky][kx] = { role:'cache', opened:false }; }
    }

    // Locked Node — its own derived PRNG, placed last, so it never disturbs the base layout
    // (favorited seeds keep their existing chests/vault/shrine/anomaly/boss exactly where they
    // were; this only ever claims a still-'open' cell, added on top).
    {
      const lr = mulberry32((mapSeed ^ 0x27220a95) >>> 0);
      if(lr() < 0.4){
        const cand = [];
        for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x].role === 'open') cand.push([x,y]);
        if(cand.length){ const [lx,ly] = cand[Math.floor(lr()*cand.length)]; grid[ly][lx] = { role:'locked', opened:false }; }
      }
    }

    // Restricted Zone — same additive pattern, its own derived PRNG, but converts an existing
    // wall tile (blockA/blockB) into something that opens for good with a Firewall Breaker,
    // rather than claiming open ground. A favorited seed without the tool sees no difference at
    // all (still just a wall); with the tool it's strictly a new option, never new blockage.
    {
      const rr = mulberry32((mapSeed ^ 0x3c6ef372) >>> 0);
      if(rr() < 0.35){
        const cand = [];
        for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x].role === 'blockA' || grid[y][x].role === 'blockB') cand.push([x,y]);
        if(cand.length){ const [rx,ry] = cand[Math.floor(rr()*cand.length)]; grid[ry][rx] = { role:'restricted', opened:false }; }
      }
    }

    // Field Barriers — several per map, each requiring a specific TYPE as your active partner to
    // cross for good. Same additive pattern as Restricted Zone (converts an existing wall tile,
    // never claims open ground), but its own derived PRNG and drawn multiple times so a full loot
    // of the map can require swapping partners more than once — collecting a varied roster is
    // what pays off here, not a Shop purchase.
    {
      const fbr = mulberry32((mapSeed ^ 0x7f4a7c15) >>> 0);
      const barrierCount = 2 + Math.floor(fbr()*3); // 2-4 per map
      for(let i=0;i<barrierCount;i++){
        const cand = [];
        for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(grid[y][x].role === 'blockA' || grid[y][x].role === 'blockB') cand.push([x,y]);
        if(!cand.length) break;
        const [bx,by] = cand[Math.floor(fbr()*cand.length)];
        const reqType = TYPE_IDS[Math.floor(fbr()*TYPE_IDS.length)];
        grid[by][bx] = { role:'barrier', opened:false, reqType };
      }
    }

    // Power Surge — Layer 2 only, on top of whatever hazard the biome already has (Foundry keeps
    // its heat vents AND gets surges). Its own derived PRNG placed last, so Layer 1 maps and
    // biomes without a layer2 entry never see it.
    if(layer === 2){
      const sr = mulberry32((mapSeed ^ 0x1e35a7bd) >>> 0);
      for(let y=0;y<size;y++) for(let x=0;x<size;x++){
        if(grid[y][x].role === 'open' && sr() < 0.07) grid[y][x] = { role:'surge', opened:false };
      }
    }

    const fog = grid.map(row => row.map(()=>false));
    revealFog(fog, cx, cy, size, 1);
    return { size, grid, fog, px:cx, py:cy, steps:0, biomeIndex, layer, hasKey:false, keyPairPresent:hasKeyPair, seed:useSeed,
             daily: !!(opts && opts.daily), dailyDay: (opts && opts.daily && opts.day) || null };
  }

  // Remembers the most recent maps you've walked into (regardless of whether
  // you favorited them), so a seed you forgot to save isn't gone the moment
  // you leave or generate a new map — you can still find and favorite it here.
  function recordVisitedSeed(biomeIndex, seed){
    if(!Array.isArray(state.recentSeeds)) state.recentSeeds = [];
    const last = state.recentSeeds[0];
    if(last && last.seed === seed && last.biomeIndex === biomeIndex) return; // don't spam re-entries of the same spot
    state.recentSeeds.unshift({ seed, biomeIndex, enteredAt: Date.now() });
    state.recentSeeds = state.recentSeeds.slice(0, 6);
  }

  // Anomaly encounters are seeded off (mapSeed, tileX, tileY) — species and
  // IVs and marked-status are fixed to that exact tile forever, independent
  // of when you visit. Ordinary wild encounters stay on plain Math.random()
  // so grinding open ground still feels like grinding; only anomalies (rare,
  // one-shot-per-visit, position-fixed) become genuine "hunting spots" a
  // favorited seed can guarantee. Level still scales off your current
  // partner's level each visit, since that's difficulty, not identity.
  function anomalySeedRng(mapSeed, x, y, layer){
    return mulberry32(strToSeed(`${mapSeed}_anomaly_${x}_${y}${layer===2?'_l2':''}`));
  }

  function isSeedFavorited(seed, biomeIndex){
    return state.savedSeeds.some(s => s.seed === seed && s.biomeIndex === biomeIndex);
  }

  function toggleFavoriteSeed(seed, biomeIndex){
    const biome = BIOMES[biomeIndex];
    const already = state.savedSeeds.find(s => s.seed === seed && s.biomeIndex === biomeIndex);
    if(already){
      state.savedSeeds = state.savedSeeds.filter(s => s !== already);
      logMsg('Removed seed from favorites.');
      render();
      return;
    }
    showPromptModal('Name this spot (optional):', `${biome.name} Sector`, (label)=>{
      state.savedSeeds.push({ seed, biomeIndex, label: (label||'').trim() || `${biome.name} Sector`, savedAt: Date.now() });
      logMsg('Seed saved to favorites.');
      render();
    });
  }

  function relativeTime(ts){
    const mins = Math.max(0, Math.round((Date.now()-ts)/60000));
    if(mins < 1) return 'just now';
    if(mins < 60) return `${mins}m ago`;
    const hrs = Math.round(mins/60);
    if(hrs < 24) return `${hrs}h ago`;
    return `${Math.round(hrs/24)}d ago`;
  }

  // Standard biomes permanently reveal a 3x3 around you. Fading-fog biomes forget everything
  // except the gate each time you move, and only show a wider radius around your position.
  function applyFog(w, biome){
    if(biome.fadeFog){
      w.fog.forEach(r => r.fill(false));
      const c = Math.floor(w.size/2);
      w.fog[c][c] = true; // the exit is always known
      revealFog(w.fog, w.px, w.py, w.size, biome.fadeFog.radius);
    } else {
      revealFog(w.fog, w.px, w.py, w.size, 1);
    }
  }
  function bossSignalText(w, biome){
    // The Ghost Server's own mechanic keeps its flavor text; a Packet Tracer working on any
    // other biome reads as the tool's own signal instead, not a biome-specific effect.
    const ghostFlavor = biome && biome.bossSignal;
    let bx=-1, by=-1;
    for(let y=0;y<w.size;y++) for(let x=0;x<w.size;x++) if(w.grid[y][x].role === 'boss'){ bx=x; by=y; }
    if(bx < 0) return ghostFlavor ? '👁 The ghost signal has gone quiet.' : '🧭 No boss signal on this map.';
    const dx = bx - w.px, dy = by - w.py, dist = Math.max(Math.abs(dx), Math.abs(dy));
    const dir = ((dy<0?'N':(dy>0?'S':'')) + (dx>0?'E':(dx<0?'W':''))) || 'right here';
    const band = dist <= 3 ? 'very close' : (dist <= 7 ? 'near' : 'far');
    return ghostFlavor ? `👁 Ghost signal: ${band} · ${dir}` : `🧭 Boss signal: ${band} · ${dir}`;
  }
  function revealFog(fog, px, py, size, radius){
    for(let y=Math.max(0,py-radius); y<=Math.min(size-1,py+radius); y++){
      for(let x=Math.max(0,px-radius); x<=Math.min(size-1,px+radius); x++){
        fog[y][x] = true;
      }
    }
  }

  /* ---------------------------------------------------------
     RENDER: ROOT
  --------------------------------------------------------- */
  function render(){
    try{
      const screenEl = document.getElementById('screen');
      const controlsEl = document.getElementById('controls');
      const statusEl = document.getElementById('statusbar');
      screenEl.classList.toggle('wild-screen', appMode !== 'boot' && (state.screen === 'wild' || state.screen === 'mine'));

      if(appMode === 'boot'){
        const screenChanged = 'boot' !== lastRenderedScreen;
        statusEl.innerHTML = '';
        statusEl.style.display = 'none';
        screenEl.innerHTML = '';
        controlsEl.innerHTML = '';
        renderTitleScreen(screenEl, controlsEl);
        if(screenChanged){
          screenEl.style.pointerEvents = 'none';
          controlsEl.style.pointerEvents = 'none';
          clearTimeout(inputLockTimer);
          inputLockTimer = setTimeout(()=>{
            screenEl.style.pointerEvents = 'auto';
            controlsEl.style.pointerEvents = 'auto';
          }, 300);
        }
        lastRenderedScreen = 'boot';
        return;
      }

      statusEl.style.display = '';
      dailyRefresh();
      renderStatusbar();
      const screenChanged = state.screen !== lastRenderedScreen;
      screenEl.innerHTML = '';
      controlsEl.innerHTML = '';
      switch(state.screen){
        case 'town': renderTown(screenEl, controlsEl); break;
        case 'wild': renderWild(screenEl, controlsEl); break;
        case 'battle': renderBattle(screenEl, controlsEl); break;
        case 'storage': renderStorage(screenEl, controlsEl); break;
        case 'breeding': renderBreeding(screenEl, controlsEl); break;
        case 'shop': renderShop(screenEl, controlsEl); break;
        case 'inventory': renderInventory(screenEl, controlsEl); break;
        case 'jobs': renderJobs(screenEl, controlsEl); break;
        case 'training': renderTraining(screenEl, controlsEl); break;
        case 'farm': renderFarm(screenEl, controlsEl); break;
        case 'mine': renderMine(screenEl, controlsEl); break;
        case 'trainAttempt': renderTrainAttempt(screenEl, controlsEl); break;
        case 'biomes': renderBiomeSelect(screenEl, controlsEl); break;
        case 'play': renderPlay(screenEl, controlsEl); break;
        case 'jobAttempt': renderJobAttempt(screenEl, controlsEl); break;
        case 'wanted': renderWanted(screenEl, controlsEl); break;
        case 'system': renderSystemMenu(screenEl, controlsEl); break;
        case 'changelog': renderChangelog(screenEl, controlsEl); break;
        case 'dex': renderDex(screenEl, controlsEl); break;
        case 'daily': renderDaily(screenEl, controlsEl); break;
        case 'statsGuide': renderStatsGuide(screenEl, controlsEl); break;
        case 'inspect': renderInspect(screenEl, controlsEl); break;
        case 'breach': renderBreach(screenEl, controlsEl); break;
        case 'storyIntro': renderStoryIntro(screenEl, controlsEl); break;
      }
      // A fresh screen always starts scrolled to the top — otherwise it can silently inherit
      // scroll position from whatever the previous (often longer) screen was left at, which
      // reads as content missing or jumping straight to the bottom.
      if(screenChanged) screenEl.scrollTop = 0;
      if(screenEl.querySelector('[data-sort-key]')) bindSortBar(screenEl);
      save();
      // Only guard against accidental taps when the screen itself changed —
      // never throttle repeated taps within the same screen (e.g. wilderness movement).
      if(screenChanged){
        screenEl.style.pointerEvents = 'none';
        controlsEl.style.pointerEvents = 'none';
        clearTimeout(inputLockTimer);
        inputLockTimer = setTimeout(()=>{
          screenEl.style.pointerEvents = 'auto';
          controlsEl.style.pointerEvents = 'auto';
        }, 300);
      }
      lastRenderedScreen = state.screen;
      afterRenderFx(screenChanged, screenEl);
      // Story layer: Patch's origin-confirmation scene, the first time the player is back in
      // town after their first battle resolves. Checked here (not at each individual battle-exit
      // call site — faint/flee/catch/flee-fail all end differently) so it can't be missed
      // regardless of which path ended the fight; self-guards via originConfirmationShown so it
      // never pops more than once even if town re-renders before it's answered.
      if(state.screen === 'town') maybeShowOriginConfirmation();
    }catch(err){
      console.error('Render error:', err);
      renderFatalError(err);
    }
  }

  /* ---------------------------------------------------------
     TITLE SCREEN / BOOT MENU
  --------------------------------------------------------- */
  function hasSaveData(){
    try{ return !!localStorage.getItem('cybertamer_save'); }catch(e){ return false; }
  }

  function renderTitleScreen(screenEl, controlsEl){
    const canContinue = hasSaveData();
    screenEl.innerHTML = `
      <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:300px; text-align:center; gap:4px;">
        <div class="pixel-font glow" style="font-size:15px; color:var(--phosphor); letter-spacing:1px;">DIGITAL EXPLORER</div>
        <div class="pixel-font glow" style="font-size:11px; color:var(--amber); margin-bottom:18px;">// CYBER TAMER</div>
        <div style="font-size:9.5px; color:var(--ink-dim); max-width:220px; line-height:1.6;">
          ${canContinue ? 'A save file was found on this device.' : 'No save file found on this device.'}
        </div>
        ${importErrorMsg ? `<div style="font-size:9.5px; color:var(--crimson); max-width:220px; margin-top:8px;">${importErrorMsg}</div>` : ''}
      </div>
    `;
    const buttons = [
      {label:'▶ New Game', cls:'btn-primary', fn:()=>confirmNewGame(canContinue)},
      {label:'⏵ Continue', cls:'btn-cyan', disabled:!canContinue, fn:()=>continueGame()},
      {label:'⇩ Import Save File', cls:'', fn:()=>triggerImportFile()},
      {label:'■ Quit', cls:'btn-crimson', fn:()=>quitGame()},
    ];
    controlsEl.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">
      ${buttons.map((b,i)=>`<button class="btn ${b.cls}" data-i="${i}" ${b.disabled?'disabled style="opacity:.4;"':''}>${b.label}</button>`).join('')}
    </div>
    <input type="file" id="import-file-input" accept="application/json,.json" style="display:none;">`;
    buttons.forEach((b,i)=>{
      if(b.disabled) return;
      controlsEl.querySelector(`[data-i="${i}"]`).addEventListener('click', b.fn);
    });
    controlsEl.querySelector('#import-file-input').addEventListener('change', onImportFileChosen);
  }

  function confirmNewGame(canContinue){
    const proceed = () => {
      importErrorMsg = null;
      state = defaultState();
      save();
      appMode = 'game';
      render();
      markBuildSeen();
      startStoryIntro(()=> showTutorial(0));
    };
    if(canContinue){
      showConfirmModal('Starting a new game will overwrite your existing save on this device. Continue?', proceed);
    } else {
      proceed();
    }
  }

  let pendingTutorial = false;
  function continueGame(){
    const hadSave = hasSaveData();
    try{
      const loaded = migrateState(load());
      if(hadSave && !loaded) throw new Error('Save data could not be read.');
      state = loaded || defaultState();
      if(!getActive()) state.activeId = state.storage[0] && state.storage[0].uid;
      importErrorMsg = null;
      appMode = 'game';
      lastRenderedScreen = null;
      pendingTutorial = !state.tutorialDone;
    }catch(err){
      // Stay on the title screen and surface the problem rather than
      // silently dropping the player into a brand-new game.
      console.error('Continue/migration error:', err);
      importErrorMsg = 'Your save file appears to be corrupted and could not be loaded. You can start a new game below, or try importing a backup file.';
    }
    render();
    if(state && state.needsStoryReset){
      showStoryResetNotice(()=>{
        state = performStoryReset(state);
        save();
        const wasPendingTutorial = pendingTutorial;
        pendingTutorial = false;
        startStoryIntro(()=>{
          if(wasPendingTutorial) showTutorial(0);
          else maybeShowWhatsNew();
        });
      });
      return; // wait for the notice to resolve before the intro/tutorial/what's-new can show
    }
    if(pendingTutorial){ pendingTutorial = false; showTutorial(0); }
    else if(appMode === 'game') maybeShowWhatsNew();
  }

  function triggerImportFile(){
    const input = document.getElementById('import-file-input');
    if(input) input.click();
  }

  function onImportFileChosen(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try{
        const parsed = JSON.parse(reader.result);
        const migrated = migrateState(parsed);
        if(!migrated || !Array.isArray(migrated.storage) || migrated.storage.length === 0){
          throw new Error('This file does not look like a Cyber Tamer save.');
        }
        state = migrated;
        if(!getActive()) state.activeId = state.storage[0] && state.storage[0].uid;
        save();
        importErrorMsg = null;
        appMode = 'game';
        lastRenderedScreen = null;
        logMsg('Save file imported successfully.');
        render();
        if(state.needsStoryReset){
          showStoryResetNotice(()=>{
            state = performStoryReset(state);
            save();
            startStoryIntro(()=>{});
          });
        }
      }catch(err){
        console.error('Import error:', err);
        importErrorMsg = 'Import failed: ' + ((err && err.message) || 'invalid file') + '.';
        render();
      }
    };
    reader.onerror = () => {
      importErrorMsg = 'Import failed: could not read that file.';
      render();
    };
    reader.readAsText(file);
  }

  function quitGame(){
    const screenEl = document.getElementById('screen');
    const controlsEl = document.getElementById('controls');
    screenEl.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:center; min-height:300px; text-align:center;">
        <div class="pixel-font glow" style="color:var(--ink-dim); font-size:11px; line-height:2;">Your progress is saved.<br>It is now safe to close this tab.</div>
      </div>`;
    controlsEl.innerHTML = '';
  }

  /* ---------------------------------------------------------
     SYSTEM MENU (export / import / return to title)
  --------------------------------------------------------- */
  function exportSave(){
    try{
      save();
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const d = new Date();
      const stamp = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      const a = document.createElement('a');
      a.href = url;
      a.download = `cybertamer-save-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
      logMsg('Save file exported.');
    }catch(e){
      console.error('Export failed', e);
      logMsg('Export failed — see console for details.');
    }
    render();
  }

  function triggerInGameImport(){
    const input = document.getElementById('system-import-input');
    if(input) input.click();
  }

  function onSystemImportChosen(ev){
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    showConfirmModal('Importing a save file will overwrite your current progress. Continue?', ()=>{
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const parsed = JSON.parse(reader.result);
          const migrated = migrateState(parsed);
          if(!migrated || !Array.isArray(migrated.storage) || migrated.storage.length === 0){
            throw new Error('This file does not look like a Cyber Tamer save.');
          }
          state = migrated;
          if(!getActive()) state.activeId = state.storage[0] && state.storage[0].uid;
          state.screen = 'town';
          save();
          logMsg('Save file imported successfully.');
          render();
          if(state.needsStoryReset){
            showStoryResetNotice(()=>{
              state = performStoryReset(state);
              save();
              startStoryIntro(()=>{});
            });
          }
        }catch(err){
          console.error('Import error:', err);
          showAlertModal('Import failed: ' + ((err && err.message) || 'invalid file'));
        }
      };
      reader.readAsText(file);
    }, ()=>{ ev.target.value = ''; });
  }

  function renderSystemMenu(screenEl, controlsEl){
    const originDef = state.origin && ORIGINS[state.origin];
    screenEl.innerHTML = `
      ${screenTitle('⚙ SYSTEM')}
      ${originDef ? `<div class="card" style="margin-bottom:8px;">
        <div style="color:var(--cyan);">${state.handle ? state.handle + ' — ' : ''}${originDef.name}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-top:3px;">${originDef.story}</div>
        <div style="font-size:9px; color:var(--amber); margin-top:3px;">Perk: ${originDef.perkText}</div>
        ${(state.auditor_stage||0) > 0 ? `<div style="font-size:9px; color:var(--crimson); margin-top:6px; border-top:1px solid var(--glass-border); padding-top:6px;">Trace: ${state.trace||0}/100 (floor ${state.trace_floor||0}) — Auditor stage ${state.auditor_stage}/5</div>` : ''}
      </div>` : ''}
      <div class="card" style="margin-bottom:8px; font-size:11px; color:var(--ink-dim); line-height:1.6;">
        Export your save to a file you can keep as a backup or move to a different browser or device.
        Importing a file will overwrite your current progress on this device.
        <br><br>Motion controls animations. It follows your device's reduce-motion setting until you change it here.
      </div>
    `;
    const buttons = [
      {label:'⇧ Export Save File', cls:'btn-cyan', fn:exportSave},
      {label:'⇩ Import Save File', cls:'', fn:triggerInGameImport},
      {label:`🎞 Motion: ${motionOn() ? 'Full' : 'Reduced'}`, cls:'', fn:()=>{ setMotionMode(motionOn() ? 'reduced' : 'full'); render(); }},
      {label:'🗓 Update Notes', cls:'', fn:()=>{ state.screen='changelog'; render(); }},
      {label:'← Back to Town', cls:'btn-primary', fn:()=>{ state.screen='town'; render(); }},
      {label:'⏻ Return to Title', cls:'btn-crimson', fn:()=>{ appMode='boot'; lastRenderedScreen=null; render(); }},
    ];
    controlsEl.innerHTML = `<div style="display:flex; flex-direction:column; gap:8px;">
      ${buttons.map((b,i)=>`<button class="btn ${b.cls}" data-i="${i}">${b.label}</button>`).join('')}
    </div>
    <input type="file" id="system-import-input" accept="application/json,.json" style="display:none;">`;
    buttons.forEach((b,i)=>{
      controlsEl.querySelector(`[data-i="${i}"]`).addEventListener('click', b.fn);
    });
    controlsEl.querySelector('#system-import-input').addEventListener('change', onSystemImportChosen);
  }

  function renderFatalError(err){
    const screenEl = document.getElementById('screen');
    const controlsEl = document.getElementById('controls');
    document.getElementById('statusbar').innerHTML = `<div style="color:var(--crimson)">⚠ Save data error</div>`;
    screenEl.innerHTML = `
      ${screenTitle('⚠ SYSTEM FAULT', 'var(--crimson)')}
      <div class="card" style="color:var(--ink-dim); font-size:11px;">
        Something in your saved data didn't match this version of the game (error: ${(err&&err.message)||'unknown'}).
        You can reset your save to keep playing — this starts a fresh partner and storage box.
      </div>`;
    controlsEl.innerHTML = `<button class="btn btn-crimson" id="reset-save" style="width:100%;">⟲ Reset Save &amp; Continue</button>`;
    // A transition or other flow may have left pointer-events disabled right
    // before this error fired — always restore it, or the reset button
    // itself would be unclickable, turning a recoverable error into a freeze.
    screenEl.style.pointerEvents = 'auto';
    controlsEl.style.pointerEvents = 'auto';
    controlsEl.querySelector('#reset-save').addEventListener('click', ()=>{
      try{ localStorage.removeItem('cybertamer_save'); }catch(e){}
      state = defaultState();
      render();
    });
  }

  function renderStatusbar(){
    const p = getActive();
    const sp = getForm(p);
    const bar = (val, color, low) => `<div class="barwrap${low?' bar-low':''}"><div class="barfill" style="width:${Math.max(0,Math.min(100,val))}%;background:${low?'var(--crimson)':color}"></div></div>`;
    const hungerLow = p.hunger > 0 && p.hunger <= 20;

    document.getElementById('statusbar').innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <div style="color:${sp.color}; display:flex; align-items:center; gap:5px;" class="glow">${spriteImgHtml(p,20,'mon-bob')} ${p.nickname || sp.name} <span class="badge">Gen ${p.gen} · Lv${p.level}</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="btn" id="log-open" title="Open the log" style="padding:2px 7px; font-size:10px; min-height:0 !important; position:relative;">📜 Log${logSeq>logSeenSeq?'<span style="position:absolute; top:-3px; right:-3px; width:7px; height:7px; border-radius:50%; background:var(--amber);"></span>':''}</button>
          <div id="bits-val" style="color:var(--amber)" class="glow">◈ ${(motionOn() && shownBits !== null && shownBits !== state.bits) ? shownBits : state.bits} Bits</div>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; font-size:9.5px; color:var(--ink-dim); margin-bottom:5px;">
        <div>HP ${p.hp}/${p.maxHp}${bar(100*p.hp/p.maxHp, 'var(--crimson)')}</div>
        <div class="${hungerLow?'label-low':''}">HUNGER${bar(p.hunger, 'var(--amber)', hungerLow)}</div>
        <div class="${energyLow?'label-low':''}">ENERGY${bar(p.energy, 'var(--cyan)', energyLow)}</div>
      </div>
      <div style="font-size:9px; color:var(--ink-dim);">XP ${p.xp}/${xpToNext(p.level)}${bar(100*p.xp/xpToNext(p.level), 'var(--violet)')}</div>`;
    document.getElementById('log-open').addEventListener('click', openLogModal);
    const bv = document.getElementById('bits-val');
    if(bv && motionOn() && shownBits !== null && shownBits !== state.bits) countUpBits(bv, shownBits, state.bits);
    shownBits = state.bits;
  }

  function screenTitle(text, color){
    return `<div class="pixel-font glow" style="font-size:10px;color:${color||'var(--phosphor)'};margin-bottom:10px;">${text}</div>`;
  }

  let transitionTimer = null;
  function playTransition(message, accentColor, onDone, delayMs){
    delayMs = delayMs || 650;
    const screenEl = document.getElementById('screen');
    const controlsEl = document.getElementById('controls');
    screenEl.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:center; min-height:260px; text-align:center; padding:0 10px;">
        <div class="pixel-font glow" style="color:${accentColor}; font-size:11px; line-height:2;">${message}</div>
      </div>`;
    controlsEl.innerHTML = '';
    screenEl.style.pointerEvents = 'none';
    controlsEl.style.pointerEvents = 'none';
    clearTimeout(transitionTimer);
    clearTimeout(inputLockTimer);
    transitionTimer = setTimeout(()=>{
      onDone();
      // Safety net: guarantee pointer-events get restored even if the
      // render() triggered by onDone doesn't see a screen-NAME change (e.g.
      // entering an active mine dive from the mine's own entrance screen —
      // both are screen 'mine', so render()'s own screenChanged-gated reset
      // never fires and taps would stay permanently disabled). Runs just
      // after render()'s own 300ms reset so it never fights that one.
      setTimeout(()=>{
        const se = document.getElementById('screen');
        const ce = document.getElementById('controls');
        if(se) se.style.pointerEvents = 'auto';
        if(ce) ce.style.pointerEvents = 'auto';
      }, 350);
    }, delayMs);
  }

  /* ---------------------------------------------------------
     TOWN
  --------------------------------------------------------- */
  function isTrainingUnlocked(){ return state.legacyUnlockAll || state.bossDefeated.some(Boolean); }
  function isBreedingUnlocked(){ return state.legacyUnlockAll || (state.farm ? state.farm.tierIndex : 0) >= 1; }

    } else {
      townFlavor = 'Every biome gate stands quiet and cleared. Neon Haven feels like it belongs to you now.';
    }
    screenEl.innerHTML = `
      ${screenTitle('◆ NEON HAVEN ◆')}

      </div>
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:8px;">📖 Dex: ${dexCaught}/${lineIds.length} lines caught · ⚠ Bosses defeated: ${bossesDefeated}/${BIOMES.length}</div>
      <div style="font-size:11px; color:var(--ink-dim); margin-top:12px;">Recent log</div>
      <div style="font-size:10.5px; color:var(--ink-dim); margin-top:4px;">

      {label:'⛏ Data Mine', cls:'', locked:!isMiningUnlocked(), lockMsg:'Defeat 2 biome bosses to unlock the Data Mine.', fn:()=>{ state.screen='mine'; render(); }},
      {label:'📋 Wanted Board', cls:'', fn:()=>{ state.screen='wanted'; render(); }},
      {label:`📅 Daily${dailyClaimableCount() ? ' ('+dailyClaimableCount()+')' : ''}`, cls:'btn-amber', fn:()=>{ state.screen='daily'; render(); }},
      {label:'💼 Job Board', cls:'', fn:()=>{ state.screen='jobs'; render(); }},
      {label:'🌾 Server Farm', cls:'', fn:()=>{ state.screen='farm'; render(); }},
      {label:'🏋 Training Ground', cls:'', locked:!trainingUnlocked, lockMsg:'Defeat a biome boss to unlock the Training Ground.', fn:()=>{ state.screen='training'; render(); }},
      {label:'🧬 Splice Lab', cls:'btn-cyan', locked:!breedingUnlocked, lockMsg:'Upgrade your farm to a Server Shack to unlock the Splice Lab.', fn:()=>{ state.breeding={a:null,b:null}; state.screen='breeding'; render(); }},
      {label:'🎮 Play', cls:'btn-cyan', fn:()=>{ state.screen='play'; render(); }},
      {label:'💤 Rest Partner', cls:'', fn:()=>restPartner()},
      {label:'📦 Network Registry', cls:'', fn:()=>{ state.screen='storage'; render(); }},
      {label:'🎒 Inventory', cls:'', fn:()=>{ state.screen='inventory'; render(); }},
      {label:'🛒 Shop', cls:'btn-amber', fn:()=>{ state.screen='shop'; render(); }},
      {label:'📖 Dex', cls:'btn-violet', fn:()=>{ state.screen='dex'; render(); }},
      {label:'❓ Help', cls:'', fn:()=>{ helpSection=null; state.screen='statsGuide'; render(); }},

    </div>`;
    buttons.forEach((b,i)=>{

  function feedPartner(){
    const p = getActive();
    if(state.inventory.primeMeat <= 0){ logMsg('No Databite left — visit the shop.'); render(); return; }
    state.inventory.primeMeat--;
    p.hunger = Math.min(100, p.hunger + 40);
    p.energy = Math.min(100, p.energy + 8);
    logMsg(`Fed ${getForm(p).name} a Databite.`);
    questEvent('care', 1);
    render();
  }
  function restPartner(){
    const p = getActive();
    questEvent('care', 1);
    p.energy = Math.min(100, p.energy + 35);
    p.hunger = Math.max(0, p.hunger - 8);
    logMsg(`${getForm(p).name} rested and recovered energy.`);
    render();
  }


  /* ---------------------------------------------------------
     DAILY OPS — login streak, daily quests, daily sector
     Everything keys off the device's LOCAL calendar date. The clock is
     monotonic (see dailyToday): winding the clock back never re-opens a
     claimed day. Rewards are pull-based and forgiving — one missed day
     never breaks a streak, and a long absence earns a welcome-back gift
     rather than a penalty.
  --------------------------------------------------------- */
  let clockFn = () => new Date();
  function localDayKey(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function dayIndex(key){ const [y,m,d] = key.split('-').map(Number); return Math.floor(Date.UTC(y, m-1, d) / 86400000); }
  function dailyToday(){
    const real = localDayKey(clockFn());
    const seen = state && state.daily && state.daily.lastSeenDay;
    return (seen && seen > real) ? seen : real;
  }
  function msUntilMidnight(){
    const n = clockFn(); const next = new Date(n.getFullYear(), n.getMonth(), n.getDate()+1);
    return Math.max(0, next - n);
  }
  function defaultDaily(){
    return {
      lastSeenDay: null,
      login:   { streak:0, best:0, lastClaimDay:null, nextDay:1, cycles:0, comebacks:0 },
      quests:  { day:null, list:[], bonusClaimed:false, totalCompleted:0 },
      sector:  { day:null, biomeIndex:0, seed:0, claimed:false, total:0 },
    };
  }

  const LOGIN_REWARDS = [
    { day:1, bits:100 },
    { day:2, bits:50,  basicCapture:2 },
    { day:3, bits:150, primeMeat:2 },
    { day:4, bits:100, medicine:2 },
    { day:5, bits:250, basicCapture:2 },
    { day:6, bits:150, seeds:{crestshard:1} },
    { day:7, bits:400, evoCrest:1, medicine:2 },
  ];
  const COMEBACK_REWARD = { bits:150, primeMeat:3, basicCapture:2 };
  const QUEST_BONUS_REWARD = { bits:150, medicine:1, basicCapture:2 };

  // kind → definition. goal:[min,max]; town:true kinds happen at the base rather than in the wild.
  const QUEST_DEFS = {
    win:     { goal:[4,6],   town:false, reward:{bits:80},                     text:(n)=>`Win ${n} battles` },
    winType: { goal:[2,3],   town:false, reward:{bits:90},                     text:(n,t)=>`Defeat ${n} ${t}-type monsters`, param:true },
    catch:   { goal:[1,2],   town:false, reward:{bits:60, basicCapture:2},     text:(n)=>`Capture ${n} wild monster${n>1?'s':''}` },
    step:    { goal:[50,80], town:false, reward:{bits:70},                      text:(n)=>`Explore ${n} tiles of wilderness` },
    chest:   { goal:[2,3],   town:false, reward:{bits:70, basicCapture:1},     text:(n)=>`Open ${n} chests or vaults` },
    dig:     { goal:[20,35], town:false, reward:{bits:90},                     text:(n)=>`Dig through ${n} blocks in the Data Mine`, gate:()=>isMiningUnlocked() },
    harvest: { goal:[2,4],   town:true,  reward:{bits:60, primeMeat:1},        text:(n)=>`Harvest ${n} crops at the Server Farm` },
    job:     { goal:[2,3],   town:true,  reward:{bits:60},                      text:(n)=>`Complete ${n} jobs at the Job Board` },
    train:   { goal:[1,2],   town:true,  reward:{bits:80, medicine:1},         text:(n)=>`Finish ${n} Training Ground session${n>1?'s':''}`, gate:()=>isTrainingUnlocked() },
    care:    { goal:[2,3],   town:true,  reward:{bits:50, primeMeat:1},        text:(n)=>`Feed or rest your partner ${n} times` },
  };

  function grantReward(r, bitsMult){
    const parts = [];
    const bits = Math.round((r.bits||0) * (bitsMult||1));
    if(bits){ state.bits += bits; parts.push(`◈${bits}`); }
    [['basicCapture','Basic Capture.exe'],['advancedCapture','Advanced Capture.exe'],['hunterExe','Hunter.exe'],['containmentExe','Containment.exe'],['primeMeat','Databite'],['medicine','Medicine'],['evoCrest','Evolution Crest']].forEach(([k,label])=>{
      if(r[k]){ state.inventory[k] = (state.inventory[k]||0) + r[k]; parts.push(`${r[k]} ${label}`); }
    });
    if(r.seeds){
      Object.keys(r.seeds).forEach(sid => {
        if(!state.inventory.seeds) state.inventory.seeds = {};
        state.inventory.seeds[sid] = (state.inventory.seeds[sid]||0) + r.seeds[sid];
        parts.push(`${r.seeds[sid]} ${(CROPS[sid]&&CROPS[sid].name)||sid} seed${r.seeds[sid]>1?'s':''}`);
      });
    }
    return parts.join(' + ');
  }
  function rewardPreview(r, bitsMult){
    const parts = [];
    if(r.bits) parts.push(`◈${Math.round(r.bits*(bitsMult||1))}`);
    [['basicCapture','Basic Capture.exe'],['advancedCapture','Advanced Capture.exe'],['hunterExe','Hunter.exe'],['containmentExe','Containment.exe'],['primeMeat','Databite'],['medicine','Medicine'],['evoCrest','Evo Crest']].forEach(([k,label])=>{ if(r[k]) parts.push(`${r[k]} ${label}`); });
    if(r.seeds) Object.keys(r.seeds).forEach(sid => parts.push(`${r.seeds[sid]} ${(CROPS[sid]&&CROPS[sid].name)||sid} seed`));
    return parts.join(' + ');
  }

  function dailyRefresh(){
    if(!state || !state.daily) return;
    const today = dailyToday(), d = state.daily;
    if(d.lastSeenDay === today && d.quests.day === today && d.sector.day === today) return;
    const hadPrev = !!d.lastSeenDay && d.lastSeenDay !== today;
    d.lastSeenDay = today;
    if(d.quests.day !== today) generateDailyQuests(today);
    if(d.sector.day !== today) generateDailySector(today);
    if(hadPrev) logMsg('🌅 A new day — fresh Daily Ops are ready.');
  }

  function loginClaimable(){ return !!state.daily && state.daily.login.lastClaimDay !== dailyToday(); }
  function loginStreakShown(){
    const L = state.daily.login;
    if(!L.lastClaimDay) return 0;
    return (dayIndex(dailyToday()) - dayIndex(L.lastClaimDay) <= 2) ? L.streak : 0;
  }
  function loginCycleMult(){ return 1 + 0.25 * Math.min(state.daily.login.cycles, 4); }
  function claimLogin(){
    dailyRefresh();
    const L = state.daily.login, today = dailyToday();
    if(L.lastClaimDay === today) return null;
    const gap = L.lastClaimDay ? dayIndex(today) - dayIndex(L.lastClaimDay) : null;
    let note = '', comeback = null;
    if(gap === null){ L.streak = 1; L.nextDay = 1; }
    else if(gap <= 2){ L.streak++; if(gap === 2) note = ' A grace day kept your streak alive.'; }
    else { L.streak = 1; L.nextDay = 1; if(gap >= 4){ comeback = grantReward(COMEBACK_REWARD, 1); L.comebacks++; note = ` Welcome back! Gift: ${comeback}.`; } }
    const rw = LOGIN_REWARDS[L.nextDay-1];
    const txt = grantReward(rw, loginCycleMult());
    L.best = Math.max(L.best, L.streak);
    L.lastClaimDay = today;
    if(L.nextDay >= LOGIN_REWARDS.length){ L.nextDay = 1; L.cycles++; } else { L.nextDay++; }
    logMsg(`📅 Day ${rw.day} login reward: ${txt}. Streak ${L.streak}.${note}`);
    render();
    return txt;
  }

  function generateDailyQuests(today){
    const rng = mulberry32(strToSeed('daily_quests_' + today));
    const kinds = Object.keys(QUEST_DEFS).filter(k => !QUEST_DEFS[k].gate || QUEST_DEFS[k].gate());
    shuffleArray(kinds, rng);
    let pick = kinds.slice(0,3);
    if(pick.every(k => QUEST_DEFS[k].town)){ // never a day of pure chores
      const wildK = kinds.find(k => !QUEST_DEFS[k].town);
      if(wildK) pick[2] = wildK;
    }
    const types = Object.keys(TYPE_CHART);
    const list = pick.map(kind => {
      const def = QUEST_DEFS[kind];
      const goal = def.goal[0] + Math.floor(rng() * (def.goal[1]-def.goal[0]+1));
      const q = { kind, goal, progress:0, claimed:false };
      if(def.param) q.param = types[Math.floor(rng()*types.length)];
      return q;
    });
    state.daily.quests = { day: today, list, bonusClaimed:false, totalCompleted: state.daily.quests.totalCompleted||0 };
  }
  function questText(q){ const def = QUEST_DEFS[q.kind]; return def ? def.text(q.goal, q.param) : 'Unknown task'; }
  function questEvent(kind, amount, meta){
    const d = state && state.daily;
    if(!d || !d.quests || !Array.isArray(d.quests.list)) return;
    dailyRefresh();
    const kinds = kind === 'win' ? ['win','winType'] : [kind];
    d.quests.list.forEach(q => {
      if(q.claimed || q.progress >= q.goal || !kinds.includes(q.kind)) return;
      if(q.kind === 'winType' && !(meta && meta.type === q.param)) return;
      q.progress = Math.min(q.goal, q.progress + (amount||1));
    });
  }
  function claimQuest(i){
    dailyRefresh();
    const q = state.daily.quests.list[i];
    if(!q || q.claimed || q.progress < q.goal) return;
    q.claimed = true;
    state.daily.quests.totalCompleted++;
    const txt = grantReward(QUEST_DEFS[q.kind].reward, 1);
    logMsg(`✔ Daily quest complete: ${questText(q)} — ${txt}.`);
    render();
  }
  function questBonusReady(){
    const Q = state.daily.quests;
    return !Q.bonusClaimed && Q.list.length > 0 && Q.list.every(q => q.claimed);
  }
  function claimQuestBonus(){
    dailyRefresh();
    if(!questBonusReady()) return;
    state.daily.quests.bonusClaimed = true;
    const txt = grantReward(QUEST_BONUS_REWARD, 1);
    logMsg(`🎁 All daily quests done — bonus cache: ${txt}.`);
    render();
  }

  function generateDailySector(today){
    const rng = mulberry32(strToSeed('daily_sector_' + today));
    const idx = Math.floor(rng() * (state.unlockedBiomeIndex + 1));
    const seed = Math.floor(rng() * 4294967296) >>> 0;
    state.daily.sector = { day: today, biomeIndex: idx, seed, claimed:false, total: state.daily.sector.total||0 };
  }
  function enterDailySector(){
    dailyRefresh();
    const sec = state.daily.sector, biome = BIOMES[sec.biomeIndex];
    playTransition(`Daily Sector<br>${biome.name}...`, biome.accentColor, ()=>{
      state.wild = generateWildMap(sec.biomeIndex, undefined, sec.seed, { daily: !sec.claimed, day: sec.day });
      recordVisitedSeed(sec.biomeIndex, state.wild.seed);
      state.screen = 'wild';
      render();
    });
  }
  function claimDailyCache(w){
    const sec = state.daily.sector;
    if(sec.claimed || !w || w.dailyDay !== sec.day){ logMsg('This cache has already been drained.'); return; }
    sec.claimed = true; sec.total = (sec.total||0) + 1;
    const r = { bits: 150 + sec.biomeIndex*50, primeMeat:2, medicine:1 };
    if(sec.total % 5 === 0) r.evoCrest = 1; // every 5th daily sector
    const txt = grantReward(r, 1);
    logMsg(`✪ Daily cache decrypted: ${txt}!${sec.total%5===0 ? ' (5th sector bonus)' : ''}`);
    questEvent('sector', 1);
  }

  function dailyClaimableCount(){
    if(!state || !state.daily) return 0;
    let n = loginClaimable() ? 1 : 0;
    n += state.daily.quests.list.filter(q => !q.claimed && q.progress >= q.goal).length;
    if(questBonusReady()) n++;
    return n;
  }

  function renderDaily(screenEl, controlsEl){
    dailyRefresh();
    const d = state.daily, L = d.login, Q = d.quests, S = d.sector;
    const biome = BIOMES[S.biomeIndex];
    const mins = Math.ceil(msUntilMidnight()/60000);
    const resetTxt = `${Math.floor(mins/60)}h ${mins%60}m`;
    const claimable = loginClaimable();
    const streak = loginStreakShown();
    const mult = loginCycleMult();
    // Today's reward day: if unclaimed it's nextDay; if already claimed, nextDay has moved on (tomorrow's)
    const strip = LOGIN_REWARDS.map(r => {
      const isNext = r.day === L.nextDay;
      const done = claimable ? r.day < L.nextDay : r.day < L.nextDay || (L.nextDay === 1 && L.cycles > 0 && !claimable);
      const border = isNext ? (claimable ? 'var(--amber)' : 'var(--cyan)') : (done ? 'var(--phosphor-dim)' : 'var(--glass-border)');
      const color = isNext ? (claimable ? 'var(--amber)' : 'var(--cyan)') : (done ? 'var(--phosphor)' : 'var(--ink-dim)');
      return `<div style="flex:1; min-width:0; text-align:center; border:1px solid ${border}; border-radius:6px; padding:4px 1px; background:rgba(255,255,255,.03);">
        <div style="font-size:8.5px; color:${color};">${done?'✓':'D'+r.day}</div>
        <div style="font-size:7.5px; color:var(--ink-dim); margin-top:2px; line-height:1.2;">${r.day===7?'★':(r.evoCrest?'★':'◈'+Math.round(r.bits*mult))}</div>
      </div>`;
    }).join('');
    const nextR = LOGIN_REWARDS[L.nextDay-1];

    screenEl.innerHTML = `
      ${screenTitle('📅 DAILY OPS', 'var(--amber)')}
      <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:8px;">Resets in ${resetTxt} (local midnight) · one missed day never breaks your streak.</div>

      <div class="card" style="margin-bottom:8px; border-color:var(--amber);">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-size:10.5px; color:var(--amber);">🔥 Login Streak: ${streak}</span>
          <span style="font-size:9px; color:var(--ink-dim);">Best ${L.best}${L.cycles>0?` · Cycle ${L.cycles+1} (+${Math.round((mult-1)*100)}% ◈)`:''}</span>
        </div>
        <div style="display:flex; gap:3px; margin-bottom:6px;">${strip}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:6px;">${claimable ? 'Ready — Day '+L.nextDay+': ' : 'Tomorrow — Day '+L.nextDay+': '}${rewardPreview(nextR, mult)}</div>
        ${claimable
          ? `<button class="btn btn-amber" id="claim-login" style="width:100%; padding:7px; font-size:10.5px;">Claim Day ${L.nextDay} Reward</button>`
          : `<div style="font-size:9.5px; color:var(--phosphor); text-align:center;">✓ Claimed today — come back tomorrow</div>`}
      </div>

      <div class="card" style="margin-bottom:8px;">
        <div style="font-size:10.5px; color:var(--cyan); margin-bottom:6px;">📋 Daily Quests <span style="color:var(--ink-dim); font-size:9px;">— ${Q.list.filter(q=>q.claimed).length}/${Q.list.length} claimed</span></div>
        <div style="display:flex; flex-direction:column; gap:6px;">
          ${Q.list.map((q,i)=>{
            const done = q.progress >= q.goal, pct = Math.round(q.progress/q.goal*100);
            return `<div style="border:1px solid ${q.claimed?'var(--phosphor-dim)':(done?'var(--amber)':'var(--glass-border)')}; border-radius:6px; padding:6px 7px; background:rgba(255,255,255,.03);">
              <div style="display:flex; justify-content:space-between; gap:6px; align-items:center;">
                <div style="font-size:10px; color:${q.claimed?'var(--phosphor)':'var(--ink)'};">${q.claimed?'✓ ':''}${questText(q)}</div>
                ${done && !q.claimed ? `<button class="btn btn-amber" style="padding:3px 8px; font-size:9px; flex-shrink:0;" data-claim-q="${i}">Claim</button>` : ''}
              </div>
              <div style="height:5px; background:#0a1f14; border-radius:3px; margin:5px 0 3px; overflow:hidden;"><div style="height:100%; width:${pct}%; background:${q.claimed?'var(--phosphor-dim)':(done?'var(--amber)':'var(--cyan)')};"></div></div>
              <div style="font-size:8.5px; color:var(--ink-dim);">${q.progress}/${q.goal} · Reward: ${rewardPreview(QUEST_DEFS[q.kind].reward,1)}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="margin-top:8px; border-top:1px dashed var(--glass-border); padding-top:6px; display:flex; justify-content:space-between; align-items:center; gap:6px;">
          <div style="font-size:9.5px; color:${Q.bonusClaimed?'var(--phosphor)':'var(--ink-dim)'};">🎁 Clear all 3: ${rewardPreview(QUEST_BONUS_REWARD,1)}</div>
          ${questBonusReady() ? `<button class="btn btn-amber" id="claim-bonus" style="padding:3px 8px; font-size:9px; flex-shrink:0;">Open</button>` : (Q.bonusClaimed ? '<span style="font-size:9px; color:var(--phosphor);">✓</span>' : '')}
        </div>
      </div>

      <div class="card" style="border-color:${biome.accentColor};">
        <div style="font-size:10.5px; color:${biome.accentColor}; margin-bottom:4px;">🧭 Daily Sector — ${biome.name}</div>
        <div style="font-size:9.5px; color:var(--ink-dim); margin-bottom:4px;">Today's fixed map · Seed <span style="color:var(--phosphor);">${S.seed}</span> · every visit today is the same layout. Find the ✪ cache for a bonus.</div>
        ${biome.mechanic ? `<div style="font-size:9px; color:${biome.accentColor}; margin-bottom:6px;">${biome.mechanic.split('.')[0]}.</div>` : ''}
        <div style="font-size:9.5px; margin-bottom:6px; color:${S.claimed?'var(--phosphor)':'var(--amber)'};">${S.claimed ? '✓ Cache claimed today' : '✪ Cache waiting'} · ${S.total||0} total${(S.total||0)%5===4 && !S.claimed ? ' · next claim gives an Evolution Crest!' : ''}</div>
        <button class="btn btn-primary" id="enter-sector" style="width:100%; padding:7px; font-size:10.5px;">Enter Daily Sector</button>
      </div>
    `;
    const cl = screenEl.querySelector('#claim-login'); if(cl) cl.addEventListener('click', ()=>claimLogin());
    screenEl.querySelectorAll('[data-claim-q]').forEach(b=>b.addEventListener('click', ()=>claimQuest(parseInt(b.getAttribute('data-claim-q'),10))));
    const cb = screenEl.querySelector('#claim-bonus'); if(cb) cb.addEventListener('click', ()=>claimQuestBonus());
    screenEl.querySelector('#enter-sector').addEventListener('click', ()=>enterDailySector());
    controlsEl.innerHTML = `<button class="btn" id="back" style="width:100%;">← Back to Town</button>`;
    controlsEl.querySelector('#back').addEventListener('click', ()=>{ state.screen='town'; render(); });
  }

                return `To open ${b.name}, in ${BIOMES[i-1].name}:`

                  + check(st.recycle, `Recycle ${RECYCLE_QUOTA} ${st.type}-type monsters (${Math.min(st.recycled,RECYCLE_QUOTA)}/${RECYCLE_QUOTA})`)
                  + check(st.key, `Find the Network Access Key (solve a Data Breach)`);
